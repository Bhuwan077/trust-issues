  PARKING SPOT PANIC — README, CONSTANTS, LIE INDEX & FAIRNESS SELF-REVIEW
================================================================================
  CONTROLS:
    Drive        : W / Up Arrow (Accelerate), S / Down Arrow (Brake / Reverse)

    Share Spot   : C (copies #code=PSP-XX URL hash)
    Debug Solver : F9 (runs deterministic replay verification on ALL 40 spots!)
    Watch Bot    : Shift+F9 (watch verified solution live on the current spot)

  HOW TO RUN THE SOLVER:
    1. Open parking.html in any browser (or pass to Node headless verifier).
    2. Press F9 anywhere to execute `runAllSolvers()` across all 40 spots and
       check Lie Index uniqueness. Press Shift+F9 to watch a live solve.

  HOW TO ADD A SPOT:
    1. Call `addSpot({ id, tier, name, vehicleId, lieKey, twist, tell,
       intendedSolution, start, spot, walls, parkedCars, cones, ... })`.
    2. Add a deterministic input array to `LEVEL_SOLUTIONS[id]`.
    3. Press F9 to verify PASS cleanly.

  SELF-REVIEW FAIRNESS CHECKLIST:
    [x] Zero randomness in layouts, traffic timing, pedestrians, or physics.
    [x] 100% deterministic 60 Hz fixed-timestep simulation (`FIXED_DT = 1/60`).
    [x] 40/40 spots verified via F9 replay solver with PASS status.
    [x] SAT OBB hitboxes match exact drawn vehicle/wall/cone rectangles.
    [x] Ghost ideal car toggle unlocks cleanly after 5 failed attempts.
    [x] Unique twist per spot tracked in `LIE_INDEX` (`assertUniqueLies()`).
    [x] Everything runs strictly inside canvas; safe localStorage try/catch;
        playful non-hateful NPC reactions; no external requests or redirects.
================================================================================
-->

function applyTheme(theme, persist = false) {
  currentTheme = theme === "light" ? "light" : "dark";

    btn.title = currentTheme === "light" ? "Dark mode" : "Light mode";
  }
  if (persist) { try { localStorage.setItem(THEME_KEY, currentTheme); } catch (e) {} }
}
applyTheme(currentTheme, false);
const themeToggleBtn = document.getElementById("theme-toggle");
if (themeToggleBtn) themeToggleBtn.addEventListener("click", () => applyTheme(currentTheme === "light" ? "dark" : "light", true));

/* ============================================================================
 * 3. WEB AUDIO SYNTHESIZER (VEHICLE HORN, ENGINE, DENT TIERS, GASP)
 * ============================================================================ */
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.muted = false;
    this.engOsc = null;
    this.engGain = null;
  }
  unlock() {
    if (this.muted) return;
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
  }
  ensureEngine() {
    if (this.muted || !this.ctx || this.ctx.state !== "running" || this.engOsc) return;
    this.engOsc = this.ctx.createOscillator();
    this.engGain = this.ctx.createGain();
    this.engOsc.type = "sawtooth";
    this.engOsc.frequency.value = 52;
    this.engGain.gain.value = 0.0;
    this.engOsc.connect(this.engGain);
    this.engGain.connect(this.ctx.destination);
    this.engOsc.start();
  }
  updateEngine(speedRatio, active) {
    if (!this.ctx || this.ctx.state !== "running") return;
    if (!this.engOsc && active && !this.muted) this.ensureEngine();
    if (!this.engOsc) return;
    const t = this.ctx.currentTime;
    if (this.muted || !active) {
      this.engGain.gain.setTargetAtTime(0, t, 0.04);
    } else {
      this.engOsc.frequency.setTargetAtTime(48 + Math.min(1.4, speedRatio) * 86, t, 0.05);
      this.engGain.gain.setTargetAtTime(0.018 + Math.min(1, speedRatio) * 0.022, t, 0.06);
    }
  }
  tone(freq, dur, type = "square", vol = 0.07, slideTo = null, delay = 0) {
    if (this.muted || !this.ctx || this.ctx.state !== "running") return;
    const t = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(25, freq), t);
    if (slideTo !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(25, slideTo), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.01);
  }
  play(name, param = 1) {
    if (this.muted || !this.ctx || this.ctx.state !== "running") return;
    switch (name) {
      case "tap": this.tone(310, 0.07, "triangle", 0.08, 170); break;
      case "scrape":
        this.tone(420, 0.14, "sawtooth", 0.07, 240);
        this.tone(590, 0.11, "square", 0.04, 310, 0.03);
        break;
      case "crunch":
        this.tone(160, 0.16, "sawtooth", 0.12, 55);
        this.tone(110, 0.18, "square", 0.09, 42, 0.02);
        break;
      case "catastrophe":
        this.tone(115, 0.28, "sawtooth", 0.14, 32);
        this.tone(85, 0.30, "triangle", 0.12, 28, 0.04);
        // Crowd gasp tail
        this.tone(620, 0.24, "sine", 0.05, 880, 0.10);
        break;
      case "squeak": this.tone(1180, 0.05, "triangle", 0.025, 920); break;
      case "horn":
        this.tone(param, 0.16, "sawtooth", 0.08, param * 0.98);
        this.tone(param * 1.25, 0.16, "square", 0.05, param * 1.24, 0.01);
        break;
      case "wiper": this.tone(240, 0.06, "sine", 0.02, 390); break;
      case "win":
        this.tone(523.25, 0.08, "square", 0.07, null, 0.00);
        this.tone(659.25, 0.08, "square", 0.07, null, 0.08);
        this.tone(783.99, 0.08, "square", 0.07, null, 0.16);
        this.tone(1046.5, 0.24, "square", 0.08, null, 0.24);
        break;
      case "nearmiss":
        this.tone(330, 0.12, "sawtooth", 0.07, 290, 0.00);
        this.tone(290, 0.16, "sawtooth", 0.07, 190, 0.13);
        break;
    }
  }
}

/* ============================================================================
 * 5. 40 SPOTS & LIE INDEX REGISTRY (ZERO RANDOMNESS, UNIQUE TWIST EACH)
 * ============================================================================ */
const LEVELS = [];
const LIE_INDEX = [];

function box(x, y, w, h, kind = "wall", angle = 0, label = null) {
  return { x, y, w, h, angle, kind, label };
}
function parkCar(x, y, angle = 0, w = 64, h = 28, color = "#545275") {
  return { x, y, w, h, angle, kind: "car", color };
}
function cone(x, y) { return { x, y, w: 14, h: 14, angle: 0, kind: "cone" }; }

function addSpot(cfg) {
  LEVELS.push(cfg);
  LIE_INDEX.push({
    id: cfg.id,
    tier: cfg.tier,
    name: cfg.name,
    lieKey: cfg.lieKey,
    twist: cfg.twist,
    tell: cfg.tell,
    intendedSolution: cfg.intendedSolution
  });
}

function assertUniqueLies() {
  const seen = new Set(), errors = [];
  for (const e of LIE_INDEX) {
    if (!e.lieKey) errors.push(`Missing lieKey on spot ${e.id}`);
    else if (seen.has(e.lieKey)) errors.push(`Duplicate lieKey: ${e.lieKey} on spot ${e.id}`);
    seen.add(e.lieKey);
  }
  return { ok: errors.length === 0 && LIE_INDEX.length === 40, count: LIE_INDEX.length, errors };
}

function expandSolution(seq) {
  const out = [];
  for (const s of (seq || [])) {
    for (let i = 0; i < s.ticks; i++) {
      out.push({ gas: !!s.gas, rev: !!s.rev, left: !!s.left, right: !!s.right, hb: !!s.hb, horn: !!s.horn });
    }
  }
  return out;
}

/* ============================================================================
 * 7. ORIENTED BOUNDING BOX COLLISION & DETERMINISTIC BICYCLE PHYSICS
 * ============================================================================ */
function getRectCorners(cx, cy, w, h, angle) {
  const hw = w / 2, hh = h / 2;
  const c = Math.cos(angle), s = Math.sin(angle);
  return [
    { x: cx + hw * c - hh * s, y: cy + hw * s + hh * c },
    { x: cx - hw * c - hh * s, y: cy - hw * s + hh * c },
    { x: cx - hw * c + hh * s, y: cy - hw * s - hh * c },
    { x: cx + hw * c + hh * s, y: cy + hw * s - hh * c }
  ];
}

function projectCorners(corners, ax, ay) {
  let min = corners[0].x * ax + corners[0].y * ay, max = min;
  for (let i = 1; i < corners.length; i++) {
    const p = corners[i].x * ax + corners[i].y * ay;
    if (p < min) min = p;
    if (p > max) max = p;
  }
  return { min, max };
}

function testOBB(a, b) {
  const ca = getRectCorners(a.x, a.y, a.w, a.h, a.angle);
  const cb = getRectCorners(b.x, b.y, b.w, b.h, b.angle);
  const axes = [
    { x: Math.cos(a.angle), y: Math.sin(a.angle) },
    { x: -Math.sin(a.angle), y: Math.cos(a.angle) },
    { x: Math.cos(b.angle), y: Math.sin(b.angle) },
    { x: -Math.sin(b.angle), y: Math.cos(b.angle) }
  ];
  let minOverlap = Infinity, bestAxis = null;
  for (const ax of axes) {
    const pa = projectCorners(ca, ax.x, ax.y);
    const pb = projectCorners(cb, ax.x, ax.y);
    const overlap = Math.min(pa.max, pb.max) - Math.max(pa.min, pb.min);
    if (overlap <= 0) return null;
    if (overlap < minOverlap) { minOverlap = overlap; bestAxis = ax; }
  }
  const dx = a.x - b.x, dy = a.y - b.y;
  let nx = bestAxis.x, ny = bestAxis.y;
  if (dx * nx + dy * ny < 0) { nx = -nx; ny = -ny; }
  // Approximate contact point as clamped corner closest to opponent center
  let contact = ca[0], bestD = Infinity;
  for (const pt of ca) {
    const d = Math.hypot(pt.x - b.x, pt.y - b.y);
    if (d < bestD) { bestD = d; contact = pt; }
  }
  return { mtvX: nx * minOverlap, mtvY: ny * minOverlap, nx, ny, contactX: contact.x, contactY: contact.y };
}

function createSpotState(def) {
  const veh = getVehicleDef(def.vehicleId);
  const st = {
    def,
    veh,
    tick: 0,
    timeLeft: ROUND_TIME_TICKS,
    car: {
      x: def.start.x, y: def.start.y, angle: def.start.angle,
      v: 0, latV: 0, steer: 0,
      trailerX: def.start.x - Math.cos(def.start.angle) * (veh.w / 2 + (veh.hitchDist || 0) + (veh.trailerW || 0) / 2),
      trailerY: def.start.y - Math.sin(def.start.angle) * (veh.w / 2 + (veh.hitchDist || 0) + (veh.trailerW || 0) / 2),
      trailerAngle: def.start.angle,
      ladderAngle: 0, ladderVel: 0,
      dents: []
    },
    spot: { x: def.spot.x, y: def.spot.y, w: def.spot.w, h: def.spot.h, angle: def.spot.angle, label: def.spot.label || null },
    peds: (def.peds || []).map(p => ({ ...p, curY: p.y })),
    mover: def.mover ? { ...def.mover } : null,
    dentLogs: [],
    dentPenaltyTotal: 0,
    dentCooldown: 0,
    parkHoldTicks: 0,
    insideSpot: false,
    centerOffsetCm: 999,
    angleOffsetDeg: 180,
    bestCloseCm: 999,
    worstHitSpeed: 0,
    worstHitTick: -1,
    history: [],
    soundEvents: [],
    bubbles: [],
    floatTexts: [],
    lastNpcIdx: -1,
    hornCooldown: 0,
    won: false,
    timedOut: false,
    scoreBreakdown: null
  };
  return st;
}

function getMoverPos(path, tick) {
  for (let i = 0; i < path.length - 1; i++) {
    const a = path[i], b = path[i + 1];
    if (tick >= a.t && tick <= b.t) {
      const r = (tick - a.t) / Math.max(1, b.t - a.t);
      return { x: a.x + (b.x - a.x) * r, y: a.y + (b.y - a.y) * r };
    }
  }
  const last = path[path.length - 1];
  return { x: last.x, y: last.y };
}

function stepParking(state, input) {
  state.soundEvents.length = 0;
  if (state.won || state.timedOut) return;
  state.tick++;
  state.timeLeft = Math.max(0, ROUND_TIME_TICKS - state.tick);

  const car = state.car;
  const veh = state.veh;
  if (state.dentCooldown > 0) state.dentCooldown--;
  if (state.hornCooldown > 0) state.hornCooldown--;
  if (input.horn && state.hornCooldown === 0) {
    state.soundEvents.push({ name: "horn", param: veh.horn });
    state.hornCooldown = 20;
    state.bubbles.push({ x: car.x, y: car.y - 26, text: "HOOOONK!", life: 60 });
  }

  // Dynamic barge motion (car rides the barge deck once driven onto it!)
  if (state.def.barge) {
    const prevSpotY = state.spot.y;
    const ph = (state.tick % state.def.barge.periodTicks) / state.def.barge.periodTicks;
    state.spot.y = state.def.spot.y + Math.sin(ph * Math.PI * 2) * state.def.barge.ampY;
    const dy = state.spot.y - prevSpotY;
    if (Math.abs(car.x - state.spot.x) <= 95 && Math.abs(car.y - prevSpotY) <= 58) {
      car.y += dy;
    }
  }

  // Update deterministic pedestrians
  for (const p of state.peds) {
    p.curY += p.vy * FIXED_DT;
    if (p.curY < p.minY) { p.curY = p.minY; p.vy = Math.abs(p.vy); }
    else if (p.curY > p.maxY) { p.curY = p.maxY; p.vy = -Math.abs(p.vy); }
  }

  // Update deterministic moving truck
  if (state.mover) {
    const mp = getMoverPos(state.mover.path, state.tick);
    state.mover.x = mp.x; state.mover.y = mp.y;
  }

  // Terrain checks (ice & slope)
  let onIce = false;
  for (const z of (state.def.iceZones || [])) {
    if (Math.abs(car.x - z.x) <= z.w / 2 && Math.abs(car.y - z.y) <= z.h / 2) onIce = true;
  }

  // Steering input + speed-dependent lock
  const steerDir = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  const maxAllowedSteer = veh.maxSteer / (1 + Math.abs(car.v) * SPEED_STEER_DAMP);
  const targetSteer = steerDir * maxAllowedSteer;
  if (steerDir !== 0) {
    if (car.steer < targetSteer) car.steer = Math.min(targetSteer, car.steer + STEER_RATE * FIXED_DT);
    else if (car.steer > targetSteer) car.steer = Math.max(targetSteer, car.steer - STEER_RATE * FIXED_DT);
  } else {
    if (car.steer > 0) car.steer = Math.max(0, car.steer - STEER_RETURN_RATE * FIXED_DT);
    else if (car.steer < 0) car.steer = Math.min(0, car.steer + STEER_RETURN_RATE * FIXED_DT);
  }

  // Acceleration, Reverse, Braking & Handbrake
  const gripMult = onIce ? 0.45 : (state.def.rain ? 0.84 : 1.0);
  if (input.hb) {
    if (car.v > 0) car.v = Math.max(0, car.v - HANDBRAKE_DECEL * gripMult * FIXED_DT);
    else if (car.v < 0) car.v = Math.min(0, car.v + HANDBRAKE_DECEL * gripMult * FIXED_DT);
  } else if (input.gas) {
    if (car.v < 0) car.v = Math.min(0, car.v + BRAKE_DECEL * gripMult * FIXED_DT);
    else car.v = Math.min(veh.maxF, car.v + veh.accel * gripMult * FIXED_DT);
  } else if (input.rev) {
    if (car.v > 0) car.v = Math.max(0, car.v - BRAKE_DECEL * gripMult * FIXED_DT);
    else car.v = Math.max(-veh.maxR, car.v - veh.accel * 0.78 * gripMult * FIXED_DT);
  } else {
    const drag = ROLL_DRAG * (onIce ? 0.25 : 1.0) * FIXED_DT;
    if (car.v > 0) car.v = Math.max(0, car.v - drag);
    else if (car.v < 0) car.v = Math.min(0, car.v + drag);
  }

  // Slope gravity projection onto heading
  if (state.def.slope) {
    const sAlong = state.def.slope.fx * Math.cos(car.angle) + state.def.slope.fy * Math.sin(car.angle);
    const sLat = -state.def.slope.fx * Math.sin(car.angle) + state.def.slope.fy * Math.cos(car.angle);
    car.v += sAlong * FIXED_DT;
    car.latV += sLat * FIXED_DT * 0.5;
  }

  // Bicycle kinematics
  const angVel = (car.v / veh.wb) * Math.tan(car.steer);
  car.angle += angVel * FIXED_DT;

  if (input.hb && Math.abs(car.v) > 40) {
    car.latV += angVel * car.v * 0.08 * FIXED_DT;
    if (state.tick % 6 === 0) state.soundEvents.push({ name: "squeak", param: 1 });
  }
  const latDamp = onIce ? ICE_LAT_DAMP : (input.hb ? HANDBRAKE_LAT_DAMP : NORMAL_LAT_DAMP);
  car.latV *= latDamp;

  const cosA = Math.cos(car.angle), sinA = Math.sin(car.angle);
  const worldVx = cosA * car.v - sinA * car.latV;
  const worldVy = sinA * car.v + cosA * car.latV;
  car.x += worldVx * FIXED_DT;
  car.y += worldVy * FIXED_DT;

  // Articulated trailer hitch physics (#7 Bendy bus, #9 Tiny+Trailer)
  if (veh.trailerW) {
    const hitchX = car.x - cosA * (veh.w / 2);
    const hitchY = car.y - sinA * (veh.w / 2);
    const desiredDist = veh.hitchDist + veh.trailerW / 2;
    const dx = car.trailerX - hitchX, dy = car.trailerY - hitchY;
    let targetAngle = Math.atan2(-dy, -dx);
    let diff = Math.atan2(Math.sin(targetAngle - car.angle), Math.cos(targetAngle - car.angle));
    diff = Math.max(-1.25, Math.min(1.25, diff));
    car.trailerAngle = car.angle + diff;
    car.trailerX = hitchX - Math.cos(car.trailerAngle) * desiredDist;
    car.trailerY = hitchY - Math.sin(car.trailerAngle) * desiredDist;
  }

  // Swinging roof ladder inertia (#8 Firetruck)
  if (veh.ladderLen) {
    const torque = -angVel * 3.8 - car.ladderAngle * 14 - car.ladderVel * 4.5;
    car.ladderVel += torque * FIXED_DT;
    car.ladderAngle = Math.max(-1.1, Math.min(1.1, car.ladderAngle + car.ladderVel * FIXED_DT));
  }

  // Gather solid OBB list
  const solids = [
    ...state.def.walls,
    ...state.def.obstacles,
    ...state.peds.map(p => ({ x: p.x, y: p.curY, w: 16, h: 16, angle: 0, kind: "ped" }))
  ];
  if (state.mover) solids.push({ x: state.mover.x, y: state.mover.y, w: state.mover.w, h: state.mover.h, angle: state.mover.angle || 0, kind: "car" });

  // Collide main body + articulated trailer + swinging ladder
  const colliders = [{ x: car.x, y: car.y, w: veh.w, h: veh.h, angle: car.angle, part: "car" }];
  if (veh.trailerW) colliders.push({ x: car.trailerX, y: car.trailerY, w: veh.trailerW, h: veh.trailerH, angle: car.trailerAngle, part: "trailer" });
  if (veh.ladderLen) {
    const lAng = car.angle + car.ladderAngle;
    colliders.push({
      x: car.x + Math.cos(lAng) * (veh.w * 0.25),
      y: car.y + Math.sin(lAng) * (veh.w * 0.25),
      w: veh.ladderLen, h: 10, angle: lAng, part: "ladder"
    });
  }

  for (const col of colliders) {
    for (const s of solids) {
      const hit = testOBB(col, s);
      if (!hit) continue;
      if (col.part === "car") {
        car.x += hit.mtvX; car.y += hit.mtvY;
      } else if (col.part === "trailer") {
        car.trailerX += hit.mtvX * 0.6; car.trailerY += hit.mtvY * 0.6;
        car.x += hit.mtvX * 0.4; car.y += hit.mtvY * 0.4;
      }
      const closing = Math.abs(worldVx * hit.nx + worldVy * hit.ny);
      car.v *= -0.22;
      car.latV *= 0.2;
      if (state.dentCooldown === 0 && closing > 8) {
        registerDent(state, closing, hit.contactX, hit.contactY, s.kind);
      }
      break;
    }
  }

  // Evaluate Spot Containment & Cm Margins
  const sp = state.spot;
  const checkBodies = [{ x: car.x, y: car.y, w: veh.w, h: veh.h, angle: car.angle }];
  if (veh.trailerW) checkBodies.push({ x: car.trailerX, y: car.trailerY, w: veh.trailerW, h: veh.trailerH, angle: car.trailerAngle });
  const sc = Math.cos(-sp.angle), ss = Math.sin(-sp.angle);
  let allInside = true;
  for (const b of checkBodies) {
    for (const pt of getRectCorners(b.x, b.y, b.w, b.h, b.angle)) {
      const rx = pt.x - sp.x, ry = pt.y - sp.y;
      const lx = rx * sc - ry * ss, ly = rx * ss + ry * sc;
      if (Math.abs(lx) > sp.w / 2 || Math.abs(ly) > sp.h / 2) { allInside = false; break; }
    }
  }

  const centerDistCm = (Math.hypot(car.x - sp.x, car.y - sp.y) / PX_PER_METER) * 100;
  let angDiff = Math.abs(Math.atan2(Math.sin(car.angle - sp.angle), Math.cos(car.angle - sp.angle)));
  angDiff = Math.min(angDiff, Math.abs(angDiff - Math.PI));
  state.centerOffsetCm = centerDistCm;
  state.angleOffsetDeg = (angDiff * 180) / Math.PI;
  state.insideSpot = allInside;
  if (centerDistCm < state.bestCloseCm) state.bestCloseCm = centerDistCm;

  if (allInside && Math.abs(car.v) < STOP_SPEED_THRESH && Math.abs(car.latV) < STOP_SPEED_THRESH) {
    state.parkHoldTicks++;
    if (state.parkHoldTicks >= PARK_HOLD_TICKS) {
      finalizeWin(state);
    }
  } else {
    state.parkHoldTicks = 0;
  }

  // Save compact snapshot into 180-frame replay ring buffer
  state.history.push({
    x: car.x, y: car.y, angle: car.angle, steer: car.steer,
    trailerX: car.trailerX, trailerY: car.trailerY, trailerAngle: car.trailerAngle,
    ladderAngle: car.ladderAngle, spotY: state.spot.y,
    moverX: state.mover ? state.mover.x : 0, moverY: state.mover ? state.mover.y : 0,
    pedsY: state.peds.map(p => p.curY)
  });
  if (state.history.length > 210) state.history.shift();

  if (state.timeLeft <= 0 && !state.won) {
    state.timedOut = true;
    state.soundEvents.push({ name: "nearmiss", param: 1 });
  }
}

function registerDent(state, speed, wx, wy, targetKind) {
  state.dentCooldown = DENT_COOLDOWN_TICKS;
  let tier = "tap";
  if (targetKind === "fragile" && speed > 28) tier = "crunch";
  else if (speed > 145) tier = "catastrophe";
  else if (speed > 85) tier = "crunch";
  else if (speed > 42) tier = "scrape";

  const pen = DENT_PENALTIES[tier];
  state.dentPenaltyTotal += pen;
  const names = DENT_NAMES[tier];
  const label = names[state.dentLogs.length % names.length];
  state.dentLogs.push({ tier, label, penalty: pen, tick: state.tick, speed: Math.round(speed) });

  // Save local dent coordinate on vehicle
  const dx = wx - state.car.x, dy = wy - state.car.y;
  const c = Math.cos(-state.car.angle), s = Math.sin(-state.car.angle);
  state.car.dents.push({
    lx: Math.max(-state.veh.w / 2, Math.min(state.veh.w / 2, dx * c - dy * s)),
    ly: Math.max(-state.veh.h / 2, Math.min(state.veh.h / 2, dx * s + dy * c)),
    r: tier === "catastrophe" ? 7 : (tier === "crunch" ? 5 : 3)
  });

  if (speed > state.worstHitSpeed) {
    state.worstHitSpeed = speed;
    state.worstHitTick = state.history.length;
  }

  let lineIdx;
  do { lineIdx = (state.tick + state.dentLogs.length * 7) % NPC_LINES.length; }
  while (lineIdx === state.lastNpcIdx && NPC_LINES.length > 1);
  state.lastNpcIdx = lineIdx;

  state.bubbles.push({ x: wx, y: Math.max(66, wy - 20), text: NPC_LINES[lineIdx], life: 130 });
  state.floatTexts.push({ x: wx, y: wy - 10, text: `-${pen} (${tier.toUpperCase()})`, life: 55 });
  state.soundEvents.push({ name: tier, param: 1 });
}

function finalizeWin(state) {
  state.won = true;
  const elapsedSec = state.tick / 60;
  const timePenalty = Math.round(elapsedSec * 9);
  const straightBonus = Math.max(0, Math.round(120 - state.angleOffsetDeg * 8));
  const centerBonus = Math.max(0, Math.round(160 - state.centerOffsetCm * 4));
  const raw = Math.max(50, 1000 - state.dentPenaltyTotal - timePenalty + straightBonus + centerBonus);
  const stars = (raw >= 920 && state.dentLogs.length === 0) ? 3 : (raw >= 660 ? 2 : 1);
  state.scoreBreakdown = {
    base: 1000, dentPen: state.dentPenaltyTotal, timePen: timePenalty,
    straightBonus, centerBonus, total: raw, stars,
    cmStr: `${state.centerOffsetCm.toFixed(1)} cm off-centre`,
    angStr: `${state.angleOffsetDeg.toFixed(1)} deg tilt`,
    elapsed: elapsedSec.toFixed(2)
  };
  state.soundEvents.push({ name: "win", param: 1 });
}

 * 8. F9 HEADLESS DETERMINISTIC REPLAY SOLVER
 * ============================================================================ */
function runHeadlessSolverForSpot(spotId) {
  const def = LEVELS.find(l => l.id === spotId);
  const seq = LEVEL_SOLUTIONS[spotId];
  if (!def || !seq) return { id: spotId, name: def ? def.name : "?", pass: false, reason: "Missing solution" };
  const frames = expandSolution(seq);
  const st = createSpotState(def);
  for (let i = 0; i < frames.length; i++) {
    stepParking(st, frames[i]);
    if (st.won) return { id: spotId, name: def.name, pass: true, ticks: st.tick, seconds: (st.tick / 60).toFixed(2) };
    if (st.timedOut) return { id: spotId, name: def.name, pass: false, ticks: st.tick, reason: "Timed out" };
  }
  return { id: spotId, name: def.name, pass: false, ticks: st.tick, reason: `Did not win (${st.centerOffsetCm.toFixed(1)}cm away)` };
}

function runAllSolvers() {
  const lieCheck = assertUniqueLies();
  const results = LEVELS.map(l => runHeadlessSolverForSpot(l.id));
  const passed = results.filter(r => r.pass).length;
  console.log(`PARKING SPOT PANIC F9 SOLVER: ${passed}/${results.length} PASS | LIE CHECK: ${lieCheck.ok ? "UNIQUE OK" : "FAIL"}`);
  return { results, lieCheck, passed, total: results.length };
}

function addBtn(x, y, w, h, label, onClick, bg = PAL.STONE, fg = PAL.WHITE, border = PAL.GOLD) {

function drawVehicleShape(x, y, angle, veh, dents = [], ghost = false, extra = null) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(angle);
  if (ghost) ctx.globalAlpha = 0.28;
  // Shadow
  if (!ghost) { ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.fillRect(-veh.w/2 + 3, -veh.h/2 + 4, veh.w, veh.h); }
  // Tires
  ctx.fillStyle = "#0F0E17";
  ctx.fillRect(-veh.w/2 + 4, -veh.h/2 - 2, 10, 4);
  ctx.fillRect(-veh.w/2 + 4, veh.h/2 - 2, 10, 4);
  ctx.fillRect(veh.w/2 - 14, -veh.h/2 - 2, 10, 4);
  ctx.fillRect(veh.w/2 - 14, veh.h/2 - 2, 10, 4);
  // Main chassis
  ctx.fillStyle = veh.color; ctx.fillRect(-veh.w/2, -veh.h/2, veh.w, veh.h);
  ctx.strokeStyle = "#0F0E17"; ctx.lineWidth = 2; ctx.strokeRect(-veh.w/2, -veh.h/2, veh.w, veh.h);
  // Windshield + Accent
  ctx.fillStyle = PAL.STONE; ctx.fillRect(veh.w/2 - 15, -veh.h/2 + 3, 10, veh.h - 6);
  ctx.fillStyle = veh.accent; ctx.fillRect(-veh.w/2 + 4, -4, veh.w - 22, 8);
  if (veh.decker) {
    ctx.strokeStyle = PAL.WHITE; ctx.strokeRect(-veh.w/2 + 6, -veh.h/2 + 4, veh.w - 24, veh.h - 8);
  }
  // Visual dent marks attached to vehicle
  ctx.fillStyle = PAL.CORAL;
  for (const d of dents) {
    ctx.beginPath(); ctx.arc(d.lx, d.ly, d.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();

  if (extra && veh.ladderLen) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(angle + extra.ladderAngle);
    ctx.fillStyle = PAL.GOLD; ctx.fillRect(-10, -4, veh.ladderLen, 8);
    ctx.strokeStyle = PAL.BG; ctx.lineWidth = 1.5; ctx.strokeRect(-10, -4, veh.ladderLen, 8);
    ctx.restore();
  }
}

function renderWorld(st) {
  ctx.fillStyle = PAL.ASPHALT; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

    ctx.strokeStyle = "rgba(255,255,254,0.3)"; ctx.strokeRect(z.x - z.w/2, z.y - z.h/2, z.w, z.h);

  }
  if (st.def.slope) {

    ctx.fillStyle = "#112438"; ctx.fillRect(st.spot.x - 105, 50, 210, 460);
    ctx.fillStyle = "#3A3952"; ctx.fillRect(st.spot.x - 90, st.spot.y - 54, 180, 108);
    ctx.strokeStyle = PAL.WHITE; ctx.strokeRect(st.spot.x - 90, st.spot.y - 54, 180, 108);

  // Walls, Obstacles, Pedestrians, Mover

      ctx.fillStyle = PAL.CORAL; ctx.beginPath(); ctx.arc(o.x, o.y, 3.5, 0, Math.PI * 2); ctx.fill();
    } else if (o.kind === "fragile") {
      ctx.fillStyle = PAL.CORAL; ctx.fillRect(o.x - o.w/2, o.y - o.h/2, o.w, o.h);
      ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 1.5; ctx.strokeRect(o.x - o.w/2, o.y - o.h/2, o.w, o.h);
      ctx.fillStyle = PAL.WHITE; ctx.font = "bold 10px monospace"; ctx.textAlign = "center"; ctx.fillText(o.label || "!", o.x, o.y + 3);
    } else {
      drawVehicleShape(o.x, o.y, o.angle || 0, { w: o.w, h: o.h, color: o.color || "#545275", accent: PAL.STONE }, []);
    }

  if (st.mover) {
    drawVehicleShape(st.mover.x, st.mover.y, st.mover.angle || 0, { w: st.mover.w, h: st.mover.h, color: PAL.WHITE, accent: PAL.CORAL }, []);
  }
  for (const p of st.peds) {
    ctx.fillStyle = PAL.CORAL; ctx.beginPath(); ctx.arc(p.x, p.curY, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = PAL.WHITE; ctx.beginPath(); ctx.arc(p.x, p.curY - 1, 3, 0, Math.PI * 2); ctx.fill();

  // Ghost replay hint after 5 fails
  if (app.showGhost && LEVEL_SOLUTIONS[st.def.id]) {
    if (!st._ghostTrace) {
      const gs = createSpotState(st.def);
      const trace = [];
      for (const f of expandSolution(LEVEL_SOLUTIONS[st.def.id])) { stepParking(gs, f); trace.push({ x: gs.car.x, y: gs.car.y, angle: gs.car.angle }); }

  // Player articulated trailer + main vehicle

    ctx.strokeStyle = "rgba(255,255,254,0.22)"; ctx.lineWidth = 1.5;

    ctx.fillStyle = PAL.CORAL; ctx.font = "bold 13px monospace"; ctx.textAlign = "center";
    ctx.fillText(ft.text, ft.x, ft.y);
  }
}

function renderSummary(st) {

    ctx.fillStyle = PAL.GOLD; ctx.fillText(allDone ? `CONGRATULATIONS! ALL 40 SPOTS DONE!` : `PARKED! ${"*".repeat(sb.stars)} (${sb.total} PTS)`, 480, 92);
    ctx.fillStyle = PAL.WHITE; ctx.font = "bold 15px monospace";
    ctx.fillText(`PRECISION: ${sb.cmStr}  |  ${sb.angStr}  |  TIME: ${sb.elapsed}S`, 480, 130);
  } else {
    const nm = st.bestCloseCm < 5.0;
    ctx.fillStyle = PAL.CORAL; ctx.fillText(nm ? `NEAR MISS!! ${st.bestCloseCm.toFixed(1)} CM OFF!` : "TIME UP! SPOT MISSED", 480, 92);
    ctx.fillStyle = PAL.WHITE; ctx.font = "bold 15px monospace";
    ctx.fillText(`CLOSEST MARGIN: ${st.bestCloseCm.toFixed(1)} CM`, 480, 130);
  }
  ctx.fillStyle = PAL.GOLD; ctx.font = "bold 16px monospace"; ctx.fillText("COMEDY DAMAGE REPORT", 480, 174);
  if (st.dentLogs.length === 0) {
    ctx.fillStyle = PAL.MINT; ctx.font = "14px monospace"; ctx.fillText("PRISTINE PAINTWORK! ZERO DENTS!", 480, 218);
  } else {
    for (let i = 0; i < Math.min(6, st.dentLogs.length); i++) {
      const d = st.dentLogs[i];
      ctx.fillStyle = PAL.CORAL; ctx.font = "14px monospace";
      ctx.fillText(`- ${d.label} [${d.tier.toUpperCase()}] (-${d.penalty} PTS)`, 480, 208 + i * 26);
    }
  }
  addBtn(170, 420, 180, 44, "RETRY [R]", () => startSpot(app.currentIdx), PAL.STONE, PAL.WHITE);
  if (st.history.length > 10) {
    addBtn(370, 420, 220, 44, "WORST HIT REPLAY", () => {
      const idx = Math.max(0, (st.worstHitTick > 0 ? st.worstHitTick - 45 : st.history.length - 90));
      app.replayFrames = st.history.slice(idx, idx + 90); app.replayIdx = 0;
    }, PAL.STONE, PAL.CORAL, PAL.CORAL);
  }
  addBtn(610, 420, 180, 44, st.won && app.currentIdx + 1 < LEVELS.length ? "NEXT SPOT" : "MAIN MENU", () => {
    if (st.won && app.currentIdx + 1 < LEVELS.length) startSpot(app.currentIdx + 1);
    else app.screen = "title";
  }, PAL.GOLD, PAL.BG);
}

function renderTitleScreen() {
  ctx.fillStyle = PAL.BG; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  ctx.fillStyle = PAL.STONE; ctx.fillRect(0, 480, LOGICAL_W, 60);
  // Decorative animated limo gliding across bottom
  const lx = ((app.uiTick * 2.4) % (LOGICAL_W + 240)) - 120;
  drawVehicleShape(lx, 445, 0, VEHICLES[3], []);

  ctx.textAlign = "center"; ctx.fillStyle = PAL.CORAL; ctx.font = "bold 46px monospace";
  ctx.fillText("PARKING SPOT PANIC", 482, 92);
  ctx.fillStyle = PAL.GOLD; ctx.fillText("PARKING SPOT PANIC", 478, 88);
  ctx.fillStyle = PAL.WHITE; ctx.font = "bold 16px monospace";
  ctx.fillText(`STARS: ${totalStars()}/120   |   FAILS: ${progress.totalFails}`, 480, 140);

  const daily = getDailySpotId();
  addBtn(310, 184, 340, 50, "PLAY / CONTINUE", () => {
    const next = LEVELS.findIndex(l => !progress.stars[l.id]);
    startSpot(next >= 0 ? next : 0);
  }, PAL.GOLD, PAL.BG);
  addBtn(310, 246, 340, 42, `DAILY SPOT (#${daily})`, () => startSpot(daily - 1), PAL.STONE, PAL.GOLD);
  addBtn(310, 298, 340, 42, "40 SPOTS & GARAGE", () => { app.screen = "select"; }, PAL.STONE, PAL.WHITE);
  addBtn(310, 350, 340, 40, progress.muted ? "SOUND: MUTED" : "SOUND: ON", () => { progress.muted = !progress.muted; sfx.muted = progress.muted; saveProgress(progress); }, PAL.STONE, PAL.WHITE);
  addBtn(310, 400, 340, 40, "< BACK TO ARCADE HUB", () => { window.location.href = "index.html"; }, PAL.STONE, PAL.CORAL, PAL.CORAL);
}

function renderSelect() {
  ctx.fillStyle = PAL.BG; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  ctx.fillStyle = PAL.GOLD; ctx.textAlign = "center"; ctx.font = "bold 22px monospace";
  ctx.fillText("SELECT SPOT (1-40) OR FREE-DRIVE GARAGE", 480, 28);
  for (let i = 0; i < 40; i++) {
    const col = i % 10, row = Math.floor(i / 10);
    const x = 36 + col * 90, y = 52 + row * 68;
    const id = i + 1;
    const st = progress.stars[id] || 0;
    const unlocked = isSpotUnlocked(id);
    addBtn(x, y, 82, 58, `#${id}\n${!unlocked ? "LOCK" : ("*".repeat(st)||"-")}`, () => {
      if (unlocked) startSpot(i);
      else showToast(`COMPLETE SPOT #${id - 1} FIRST!`);
    }, PAL.STONE, st ? PAL.GOLD : (unlocked ? PAL.WHITE : PAL.CORAL), st ? PAL.GOLD : PAL.STONE);
  }
  ctx.fillStyle = PAL.WHITE; ctx.font = "bold 14px monospace"; ctx.fillText(`UNLOCKED VEHICLES (BY STARS: ${totalStars()}):`, 480, 340);
  for (let i = 0; i < VEHICLES.length; i++) {
    const v = VEHICLES[i]; const col = i % 5, row = Math.floor(i / 5);
    const ok = totalStars() >= v.starsNeed;
    const sel = progress.selectedVehicle === v.id;
    addBtn(40 + col * 178, 356 + row * 52, 168, 42, `${v.name.slice(0,11)} (${v.starsNeed}*)`, () => {
      if (!ok) showToast(`NEED ${v.starsNeed} STARS!`);
      else { progress.selectedVehicle = sel ? null : v.id; saveProgress(progress); }
    }, sel ? PAL.GOLD : PAL.STONE, sel ? PAL.BG : (ok ? PAL.WHITE : PAL.CORAL));
  }
  addBtn(390, 480, 180, 40, "MAIN MENU", () => { app.screen = "title"; }, PAL.GOLD, PAL.BG);
}

function renderSolver() {
  if (!app.solverOverlay) return;
  const { results, lieCheck, passed, total } = app.solverOverlay;
  ctx.fillStyle = PAL.PANEL; ctx.fillRect(40, 28, 880, 484);
  ctx.strokeStyle = PAL.GOLD; ctx.strokeRect(40, 28, 880, 484);
  ctx.fillStyle = PAL.GOLD; ctx.textAlign = "center"; ctx.font = "bold 20px monospace";
  ctx.fillText(`F9 SOLVER: ${passed}/${total} PASS | LIE INDEX: ${lieCheck.ok ? "UNIQUE" : "DUP"}`, 480, 62);
  for (let i = 0; i < results.length; i++) {
    const r = results[i], col = i % 8, row = Math.floor(i / 8);
    const x = 68 + col * 104, y = 92 + row * 66;
    ctx.fillStyle = r.pass ? PAL.STONE : PAL.CORAL; ctx.fillRect(x, y, 94, 54);
    ctx.fillStyle = PAL.WHITE; ctx.font = "bold 12px monospace";
    ctx.fillText(`#${r.id}: ${r.pass ? "PASS" : "FAIL"}`, x + 47, y + 30);
  }
  addBtn(400, 464, 160, 34, "CLOSE [F9]", () => { app.solverOverlay = null; }, PAL.GOLD, PAL.BG);
}

function render() {
  uiButtons.length = 0;
  const showTouch = (app.screen === "play" || app.screen === "summary") && isTouchCapable();
  if (touchEl.classList.contains("active") !== showTouch) touchEl.classList.toggle("active", showTouch);
  if (app.screen === "title") renderTitleScreen();
  else if (app.screen === "select") renderSelect();
  else if (app.state) {
    ctx.fillStyle = PAL.BG; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    ctx.save();
    if (!progress.streamerSafe && app.shakeTicks > 0) ctx.translate((Math.random()-0.5)*8, (Math.random()-0.5)*8);
    if (app.replayFrames) {
      const f = app.replayFrames[Math.floor(app.replayIdx)];
      const snap = { ...app.state, car: { ...app.state.car, ...f }, spot: { ...app.state.spot, y: f.spotY } };
      renderWorld(snap);
      ctx.fillStyle = PAL.CORAL; ctx.font = "bold 18px monospace"; ctx.textAlign = "center";
      ctx.fillText("SLOW-MO WORST IMPACT REPLAY", 480, 64);
    } else {
      renderWorld(app.state);
    }
    ctx.restore();
    renderHUD(app.state);
    if (app.screen === "summary" && !app.replayFrames) renderSummary(app.state);
  }
  renderSolver();
}

let lastT = performance.now(), acc = 0;
function tick() {
  app.uiTick++;
  if (app.shakeTicks > 0) app.shakeTicks--;
  if (app.replayFrames) {
    app.replayIdx += 0.35; // Smooth slow-motion!
    if (app.replayIdx >= app.replayFrames.length) app.replayFrames = null;
    sfx.updateEngine(0, false);
    return;
  }
  if (app.screen === "play" && app.state && !app.solverOverlay) {
    let inp = {
      gas: app.keys.gas || app.touch.gas,
      rev: app.keys.rev || app.touch.rev,
      left: app.keys.left || app.touch.left,
      right: app.keys.right || app.touch.right,
      hb: app.keys.hb || app.touch.hb,
      horn: app.keys.horn || app.touch.horn
    };
    if (app.botWatch) {
      inp = app.botWatch.frames[app.botWatch.idx++] || {};
      if (app.botWatch.idx > app.botWatch.frames.length + 10) app.botWatch = null;
    }
    const prevDents = app.state.dentLogs.length;
    stepParking(app.state, inp);
    for (const s of app.state.soundEvents) sfx.play(s.name, s.param);
    if (app.state.dentLogs.length > prevDents && !progress.streamerSafe) app.shakeTicks = 6;
    for (let i = app.state.bubbles.length - 1; i >= 0; i--) { app.state.bubbles[i].life--; if (app.state.bubbles[i].life <= 0) app.state.bubbles.splice(i, 1); }
    for (let i = app.state.floatTexts.length - 1; i >= 0; i--) { app.state.floatTexts[i].y -= 0.6; app.state.floatTexts[i].life--; if (app.state.floatTexts[i].life <= 0) app.state.floatTexts.splice(i, 1); }
    sfx.updateEngine(Math.abs(app.state.car.v) / 180, true);
    if (app.state.won) {
      const sb = app.state.scoreBreakdown;
      progress.stars[app.state.def.id] = Math.max(progress.stars[app.state.def.id] || 0, sb.stars);
      progress.bestScores[app.state.def.id] = Math.max(progress.bestScores[app.state.def.id] || 0, sb.total);
      saveProgress(progress);
      if (window.DeathMusic) {
        if (app.currentIdx + 1 >= LEVELS.length) window.DeathMusic.playVictory();
        else window.DeathMusic.onWin();
      }
      app.screen = "summary";
      sfx.updateEngine(0, false);
    } else if (app.state.timedOut) {
      progress.fails[app.state.def.id] = (progress.fails[app.state.def.id] || 0) + 1;
      progress.totalFails++;
      saveProgress(progress);
      if (window.DeathMusic) window.DeathMusic.onDeath();
      app.screen = "summary";
      sfx.updateEngine(0, false);
    }
  } else {
    sfx.updateEngine(0, false);
  }
}

function frame(now) {
  acc += Math.min(0.1, (now - lastT) / 1000); lastT = now;
  while (acc >= FIXED_DT) { tick(); acc -= FIXED_DT; }
  render();
  requestAnimationFrame(frame);
}

const hashM = (window.location.hash || "").match(/code=PSP-(\d+)/i);
if (hashM) { const n = parseInt(hashM[1], 10); if (n >= 1 && n <= LEVELS.length) startSpot(n - 1); }
requestAnimationFrame(frame);
</script>
<script src="death_music.js"></script>
</body>
