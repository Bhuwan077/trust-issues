  CONTROLS:

    2. Press F9 anywhere to execute `runAllSolvers()` across all 30 levels and

    [x] 30/30 levels verified PASS in `runAllSolvers()`.
    [x] Every hazard provides an unmistakable pre-hit tell (warning ring, hiss,

    [x] Ghost route unlocks cleanly after 8 failures (`[G]`).
    [x] Unique obstacle documented in `LIE_INDEX` (`assertUniqueLies()`).
    [x] Zero external network calls or libraries; safe localStorage try/catch.
================================================================================

/* ============================================================================
 * 4. WEB AUDIO SYNTHESIZER (FLOOR STEPS, RISING CREAK, GASP, DROP, FANFARE)
 * ============================================================================ */
class SoundEngine {
  constructor() { this.ctx = null; this.muted = false; }
  unlock() {
    if (this.muted) return;
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
  }
  tone(freq, dur, type = "triangle", vol = 0.06, slideTo = null, delay = 0) {
    if (this.muted || !this.ctx || this.ctx.state !== "running") return;
    const t = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator(), g = this.ctx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(Math.max(30, freq), t);
    if (slideTo !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g); g.connect(this.ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.01);
  }
  play(name, param = 0) {
    if (this.muted || !this.ctx || this.ctx.state !== "running") return;
    switch (name) {
      case "step_kitchen": this.tone(170, 0.035, "square", 0.025, 110); break;
      case "step_hall":    this.tone(125, 0.045, "triangle", 0.03, 95); break;
      case "step_dance":   this.tone(240, 0.03, "sine", 0.025, 190); break;
      case "step_grass":   this.tone(95, 0.05, "sawtooth", 0.02, 70); break;
      case "creak":
        this.tone(260 + param * 420, 0.07, "sawtooth", 0.025, 290 + param * 460);
        break;
      case "steady": this.tone(440, 0.09, "sine", 0.05, 620); break;
      case "gasp":   this.tone(520, 0.20, "sine", 0.055, 860); break;
      case "sprinkler": this.tone(900, 0.09, "sawtooth", 0.02, 1200); break;
      case "drop":
        this.tone(240, 0.34, "sawtooth", 0.12, 48);
        this.tone(130, 0.38, "triangle", 0.11, 34, 0.06);
        break;
      case "win":
        this.tone(523.25, 0.09, "triangle", 0.08, null, 0.00);
        this.tone(659.25, 0.09, "triangle", 0.08, null, 0.09);
        this.tone(783.99, 0.09, "triangle", 0.08, null, 0.18);
        this.tone(1046.5, 0.25, "triangle", 0.09, null, 0.27);
        break;
    }
  }
}

const LEVELS = [];

function addCakeLevel(cfg) {
  LEVELS.push(cfg);

    id: cfg.id, tier: cfg.tier, name: cfg.name, lieKey: cfg.lieKey,
    obstacle: cfg.obstacle, tell: cfg.tell, intendedRoute: cfg.intendedRoute
  });
}

function assertUniqueLies() {
  const seen = new Set(), errors = [];
  for (const e of LIE_INDEX) {
    if (!e.lieKey) errors.push(`Missing lieKey on ${e.id}`);
    else if (seen.has(e.lieKey)) errors.push(`Dup lieKey ${e.lieKey}`);
    seen.add(e.lieKey);
  }
  return { ok: errors.length === 0 && LIE_INDEX.length === 30, count: LIE_INDEX.length, errors };
}

function expandSolution(seq) {
  const out = [];
  for (const s of (seq || [])) {
    for (let i = 0; i < s.ticks; i++) out.push({ left: !!s.left, right: !!s.right, leanL: !!s.leanL, leanR: !!s.leanR, steady: !!s.steady });
  }
  return out;
}

/* ============================================================================
 * 7. CAKE STACK SPRING-DAMPER & CASCADE COLLAPSE ENGINE
 * ============================================================================ */
function getFloorY(def, x) {
  let y = 415;
  for (const h of def.hazards) {
    if ((h.type === "step" || h.type === "bump") && x >= h.x && x <= h.x + h.w) {
      y = Math.min(y, 415 + h.dy);
    }
  }
  return y;
}

function createCakeState(def, styleId = "classic") {
  const style = CAKE_STYLES.find(s => s.id === styleId) || CAKE_STYLES[0];
  const tiers = [];
  for (let i = 0; i < def.tiersCount; i++) {
    const ratio = 1 - (i / (def.tiersCount + 1)) * 0.62;
    tiers.push({
      idx: i,
      w: Math.round(76 * ratio),
      h: 22,
      xOff: 0,
      vx: 0,
      angle: 0,
      angVel: 0,
      fallen: false,
      fallX: 0,
      fallY: 0,
      fallVx: 0,
      fallVy: 0,
      fallAng: 0,
      fallAngVel: 0
    });
  }
  return {
    def,
    style,
    tick: 0,
    simAccum: 0,
    timeLeft: def.timeSec * 60,
    playerX: 110,
    playerY: getFloorY(def, 110),
    prevFloorY: getFloorY(def, 110),
    playerVx: 0,
    facing: 1,
    stepPhase: 0,
    steadyTicks: 0,
    steadyCooldown: 0,
    wobblePct: 0,
    peakWobblePct: 0,
    closestSaveDelta: 0,
    zeroWobbleStreak: 0,
    bestZeroStreak: 0,
    tiers,
    hazards: def.hazards.map(h => ({ ...h, curX: h.x || 0, curVx: h.vx || 0, headTurn: false, activeSpray: false, hissing: false, gusting: false })),
    bubbles: [],
    soundEvents: [],
    dropReports: [],
    history: [],
    collapsing: false,
    slowMoTicks: 0,
    failed: false,
    won: false,
    scoreBreakdown: null
  };
}

function stepCake(state, input) {
  state.soundEvents.length = 0;
  if (state.won || state.failed) return;

  // Handle cinematic slow-motion drop sequence!
  const stepMult = state.collapsing ? SLOWMO_DROP_FACTOR : 1.0;
  state.simAccum += stepMult;
  if (state.simAccum < 0.999) {
    // Still render smooth falling tiers in slow-mo ticks
    for (const t of state.tiers) {
      if (t.fallen) {
        t.fallX += t.fallVx * FIXED_DT * stepMult;
        t.fallY += t.fallVy * FIXED_DT * stepMult;
        t.fallVy += 480 * FIXED_DT * stepMult;
        t.fallAng += t.fallAngVel * FIXED_DT * stepMult;
      }
    }
    if (state.collapsing) {
      state.slowMoTicks++;
      if (state.slowMoTicks >= 75) state.failed = true;
    }
    return;
  }
  state.simAccum -= 1.0;
  state.tick++;
  if (!state.collapsing) state.timeLeft = Math.max(0, state.def.timeSec * 60 - state.tick);

  if (state.steadyTicks > 0) state.steadyTicks--;
  if (state.steadyCooldown > 0) state.steadyCooldown--;
  if (input.steady && state.steadyCooldown === 0 && !state.collapsing) {
    state.steadyTicks = STEADY_DURATION_TICKS;
    state.steadyCooldown = STEADY_COOLDOWN_TICKS;
    state.soundEvents.push({ name: "steady", param: 1 });
  }

  // Determine floor zone friction, rug push, disco spin, wind, sprinkler
  let onPolish = state.def.floor === "dance";
  let onDisco = false;
  let rugPush = 0;
  let externalImpulse = 0;
  for (const h of state.hazards) {
    if (h.type === "polish" && state.playerX >= h.x && state.playerX <= h.x + h.w) onPolish = true;
    if (h.type === "disco" && state.playerX >= h.x && state.playerX <= h.x + h.w) onDisco = true;
    if (h.type === "rug" && state.playerX >= h.x && state.playerX <= h.x + h.w) rugPush += h.pushSpeed;
    if (h.type === "wind") {
      const ph = state.tick % h.period;
      h.gusting = (ph >= h.onFrom && ph <= h.onTo);
      if (h.gusting && state.playerX >= h.x && state.playerX <= h.x + h.w) externalImpulse += h.force;
    }
    if (h.type === "sprinkler") {
      const ph = state.tick % h.period;
      h.hissing = (ph >= h.hissAt && ph < h.blastAt);
      h.activeSpray = (ph >= h.blastAt && ph <= h.endAt);
      if (h.hissing && ph === h.hissAt) state.soundEvents.push({ name: "sprinkler", param: 1 });
      if (h.activeSpray && Math.abs(state.playerX - h.x) <= h.w / 2) externalImpulse += h.push * (state.tick % 2 === 0 ? 1 : -0.6);
    }
    if (h.type === "guest" || h.type === "waiter") {
      h.curX += h.curVx * FIXED_DT;
      h.headTurn = (h.curX <= h.minX + 26 && h.curVx < 0) || (h.curX >= h.maxX - 26 && h.curVx > 0);
      if (h.curX < h.minX) { h.curX = h.minX; h.curVx = Math.abs(h.curVx); }
      if (h.curX > h.maxX) { h.curX = h.maxX; h.curVx = -Math.abs(h.curVx); }
      if (!state.collapsing && Math.abs(state.playerX - h.curX) < 24) {
        externalImpulse += Math.sign(state.playerX - h.curX || 1) * (h.push || 1.5);
      }
    }
    if (h.type === "dog") {
      const ph = state.tick % h.pausePeriod;
      h.headTurn = (ph < h.pauseLen);
      if (!h.headTurn) {
        h.curX += h.curVx * FIXED_DT;
        if (h.curX < h.minX) { h.curX = h.minX; h.curVx = Math.abs(h.curVx); }
        if (h.curX > h.maxX) { h.curX = h.maxX; h.curVx = -Math.abs(h.curVx); }
      }
      if (!state.collapsing && Math.abs(state.playerX - h.curX) < 22) {
        externalImpulse += Math.sign(h.curVx || 1) * 1.9;
      }
    }
  }

  // Locomotion & horizontal acceleration calculation
  const oldVx = state.playerVx;
  const moveDir = state.collapsing ? 0 : ((input.right ? 1 : 0) - (input.left ? 1 : 0));
  if (moveDir !== 0) state.facing = moveDir;
  const fric = onPolish ? WAX_FRICTION : GROUND_FRICTION;
  if (moveDir !== 0) {
    const accMult = onPolish ? 0.68 : 1.0;
    state.playerVx = Math.max(-WALK_MAX, Math.min(WALK_MAX, state.playerVx + moveDir * WALK_ACCEL * accMult * FIXED_DT));
  } else {
    const dv = fric * FIXED_DT;
    if (state.playerVx > 0) state.playerVx = Math.max(0, state.playerVx - dv);
    else if (state.playerVx < 0) state.playerVx = Math.min(0, state.playerVx + dv);
  }
  const plateAx = (state.playerVx - oldVx) / FIXED_DT + (rugPush * 0.45);
  state.playerX = Math.max(50, Math.min(LOGICAL_W - 70, state.playerX + (state.playerVx + rugPush) * FIXED_DT));

  // Floor steps / grass bump vertical jolt
  const newFloorY = getFloorY(state.def, state.playerX);
  const floorStepDy = newFloorY - state.prevFloorY;
  state.prevFloorY = newFloorY;
  state.playerY = newFloorY;

  // Footstep sound cadence
  if (Math.abs(state.playerVx) > 25 && !state.collapsing) {
    state.stepPhase += Math.abs(state.playerVx) * FIXED_DT;
    if (state.stepPhase >= 28) {
      state.stepPhase = 0;
      state.soundEvents.push({ name: `step_${state.def.floor}`, param: 1 });
    }
  }

  // Cake Tier Stack Physics (multi-body coupled spring-damper + friction slide + tip cascade)
  const steadyMult = state.steadyTicks > 0 ? 0.25 : 1.0;
  const leanInput = (input.leanR ? 1 : 0) - (input.leanL ? 1 : 0);
  const discoTorque = onDisco ? Math.sin(state.tick * 0.24) * 2.4 : 0;
  const stepTorque = Math.abs(floorStepDy) > 1 ? Math.sign(state.playerVx || 1) * Math.abs(floorStepDy) * 0.28 : 0;

  let maxRatio = 0;
  for (let i = 0; i < state.tiers.length; i++) {
    const t = state.tiers[i];
    if (t.fallen) {
      t.fallX += t.fallVx * FIXED_DT;
      t.fallY += t.fallVy * FIXED_DT;
      t.fallVy += 480 * FIXED_DT;
      t.fallAng += t.fallAngVel * FIXED_DT;
      continue;
    }

    const heightMult = 1 + i * 0.16;
    const accelTorque = -plateAx * PLATE_IMPULSE_MULT * heightMult * steadyMult;
    const extTorque = externalImpulse * heightMult * 0.85 * steadyMult;
    const playerCounter = leanInput * LEAN_COUNTER_FORCE * (i === 0 ? 1.15 : 0.7);
    const parentAngle = i > 0 && !state.tiers[i - 1].fallen ? state.tiers[i - 1].angle : 0;
    const relAng = t.angle - parentAngle;

    const alpha = (-TIER_SPRING_K * relAng - TIER_DAMPING * t.angVel + accelTorque + extTorque + discoTorque + stepTorque + playerCounter) * (state.steadyTicks > 0 ? 1.55 : 1.0);
    t.angVel += alpha * FIXED_DT;
    if (state.steadyTicks > 0) {
      t.angVel *= 0.84; t.vx *= 0.84; t.xOff *= 0.92;
    }
    t.angle += t.angVel * FIXED_DT;

    // Horizontal frosting friction limit -> slides laterally if tilted too far!
    if (Math.abs(t.angle) > SLIDE_FRICTION_LIMIT) {
      t.vx += Math.sign(t.angle) * SLIDE_RATE * FIXED_DT * steadyMult;
    } else {
      t.vx *= 0.88;
    }
    t.xOff += t.vx * FIXED_DT;

    const baseW = (i === 0 ? 84 : state.tiers[i - 1].w);
    const ratio = Math.max(Math.abs(t.xOff) / (baseW * 0.5 * COM_FALL_MARGIN), Math.abs(t.angle) / MAX_TILT_COLLAPSE);
    if (ratio > maxRatio) maxRatio = ratio;

    // Trigger COM collapse cascade if outside base support!
    if (ratio >= 1.0 || (i > 0 && state.tiers[i - 1].fallen)) {
      t.fallen = true;
      const plateX = state.playerX + state.facing * 12;
      const plateY = state.playerY - 46 - i * 22;
      t.fallX = plateX + t.xOff; t.fallY = plateY;
      t.fallVx = state.playerVx * 0.6 + (t.xOff >= 0 ? 55 : -55);
      t.fallVy = -35;
      t.fallAng = t.angle; t.fallAngVel = (t.xOff >= 0 ? 3.5 : -3.5);
      state.dropReports.push(`Tier ${i + 1}: ${DROP_CAPTIONS[i % DROP_CAPTIONS.length]}`);
      if (!state.collapsing) {
        state.collapsing = true;
        state.slowMoTicks = 0;
        state.soundEvents.push({ name: "gasp", param: 1 });
        state.soundEvents.push({ name: "drop", param: 1 });
      }
    }
  }

  state.wobblePct = Math.min(100, Math.round(maxRatio * 100));
  if (state.wobblePct > state.peakWobblePct) state.peakWobblePct = state.wobblePct;
  if (state.peakWobblePct >= 72 && state.wobblePct <= 24) {
    state.closestSaveDelta = Math.max(state.closestSaveDelta, state.peakWobblePct - state.wobblePct);
    state.peakWobblePct = state.wobblePct;
  }
  if (state.wobblePct <= 18) {
    state.zeroWobbleStreak++;
    if (state.zeroWobbleStreak > state.bestZeroStreak) state.bestZeroStreak = state.zeroWobbleStreak;
  } else {
    state.zeroWobbleStreak = 0;
  }

  if (state.wobblePct > 62 && state.tick % 18 === 0 && !state.collapsing) {
    state.soundEvents.push({ name: "creak", param: state.wobblePct / 100 });
  }

  // Record history for drop instant replay
  state.history.push({
    px: state.playerX, py: state.playerY, facing: state.facing,
    tiers: state.tiers.map(t => ({ ...t }))
  });
  if (state.history.length > 180) state.history.shift();

  // Check Goal Arrival (at table & reasonably settled)
  if (!state.collapsing && state.playerX >= state.def.goalX && Math.abs(state.playerVx) < 35 && state.wobblePct < 65) {
    finalizeWin(state);
  }
  if (!state.collapsing && state.timeLeft <= 0) {
    state.failed = true;
    state.dropReports.push("Speech started before the cake arrived!");
    state.soundEvents.push({ name: "gasp", param: 1 });
  }
}

function finalizeWin(state) {
  state.won = true;
  const intact = state.tiers.filter(t => !t.fallen).length;
  const integrityScore = Math.round((intact / state.tiers.length) * 700);
  const speedBonus = Math.round((state.timeLeft / 60) * 18);
  const styleBonus = Math.min(200, Math.round(state.bestZeroStreak * 1.4));
  const total = integrityScore + speedBonus + styleBonus;
  const stars = (intact === state.tiers.length && total >= 900) ? 3 : (total >= 650 ? 2 : 1);
  state.scoreBreakdown = { intact, totalTiers: state.tiers.length, integrityScore, speedBonus, styleBonus, total, stars };
  state.soundEvents.push({ name: "win", param: 1 });
}

/* ============================================================================
 * 8. F9 HEADLESS DETERMINISTIC REPLAY SOLVER
 * ============================================================================ */
function runHeadlessSolverForLevel(levelId) {
  const def = LEVELS.find(l => l.id === levelId);
  const seq = LEVEL_SOLUTIONS[levelId];
  if (!def || !seq) return { id: levelId, name: def ? def.name : "?", pass: false, reason: "Missing solution" };
  const frames = expandSolution(seq);
  const st = createCakeState(def);
  for (let i = 0; i < frames.length; i++) {
    stepCake(st, frames[i]);
    if (st.won) return { id: levelId, name: def.name, pass: true, ticks: st.tick, seconds: (st.tick / 60).toFixed(2) };
    if (st.failed) return { id: levelId, name: def.name, pass: false, ticks: st.tick, reason: st.dropReports[0] || "Failed" };
  }
  return { id: levelId, name: def.name, pass: false, ticks: st.tick, reason: `Stopped at x=${Math.round(st.playerX)}` };
}

function runAllSolvers() {
  const lieCheck = assertUniqueLies();
  const results = LEVELS.map(l => runHeadlessSolverForLevel(l.id));
  const passed = results.filter(r => r.pass).length;
  console.log(`DON'T DROP THE CAKE F9 SOLVER: ${passed}/${results.length} PASS | LIE CHECK: ${lieCheck.ok ? "UNIQUE OK" : "FAIL"}`);
  return { results, lieCheck, passed, total: results.length };
}

  }

  // Floor surface colored by venue type
  const floorColor = def.floor === "grass" ? "#1E3A2B" : (def.floor === "dance" ? "#26213A" : (def.floor === "hall" ? "#2B2438" : "#2E2D40"));
  ctx.fillStyle = floorColor; ctx.fillRect(0, 415, LOGICAL_W, 125);
  ctx.fillStyle = PAL.GOLD; ctx.fillRect(0, 415, LOGICAL_W, 2);

  // Hazards
  for (const h of st.hazards) {
    if (h.type === "step" || h.type === "bump") {
      ctx.fillStyle = def.floor === "grass" ? "#2B563E" : PAL.STONE;
      ctx.fillRect(h.x, 415 + h.dy, h.w, -h.dy + 4);
      ctx.strokeStyle = PAL.GOLD; ctx.strokeRect(h.x, 415 + h.dy, h.w, -h.dy);
    } else if (h.type === "rug") {
      ctx.fillStyle = PAL.CORAL; ctx.fillRect(h.x, 412, h.w, 6);
    } else if (h.type === "disco") {
      ctx.fillStyle = (Math.floor(st.tick / 8) % 2 === 0) ? PAL.GOLD : PAL.CORAL;
      ctx.fillRect(h.x, 412, h.w, 6);
    } else if (h.type === "polish") {
      ctx.fillStyle = "rgba(255,255,254,0.12)"; ctx.fillRect(h.x, 415, h.w, 10);
    } else if (h.type === "sprinkler") {
      ctx.fillStyle = PAL.STONE; ctx.fillRect(h.x - 10, 405, 20, 10);
      if (h.hissing) { ctx.fillStyle = PAL.WHITE; ctx.font = "bold 11px monospace"; ctx.textAlign = "center"; ctx.fillText("HISS!", h.x, 385); }
      if (h.activeSpray) {
        ctx.strokeStyle = PAL.MINT; ctx.lineWidth = 2;
        for (let sx = -40; sx <= 40; sx += 20) {
          ctx.beginPath(); ctx.moveTo(h.x, 405); ctx.lineTo(h.x + sx, 250); ctx.stroke();
        }
      }
    } else if (h.type === "wind" && h.gusting) {
      ctx.fillStyle = "rgba(255,255,254,0.3)";
      for (let i = 0; i < 6; i++) ctx.fillRect(h.x + ((st.tick * 9 + i * 70) % h.w), 230 + i * 28, 22, 2);
    } else if (h.type === "guest" || h.type === "waiter") {
      ctx.fillStyle = h.type === "waiter" ? PAL.WHITE : PAL.GOLD;
      ctx.fillRect(h.curX - 10, 360, 20, 55);
      ctx.fillStyle = PAL.BG; ctx.fillRect(h.curX + (h.curVx > 0 ? 3 : -7), 366, 4, 4);
      if (h.headTurn) { ctx.fillStyle = PAL.CORAL; ctx.fillText("!", h.curX, 348); }
    } else if (h.type === "dog") {
      ctx.fillStyle = PAL.GOLD; ctx.fillRect(h.curX - 14, 395, 28, 20);
      if (h.headTurn) { ctx.fillStyle = PAL.CORAL; ctx.fillText("SNIFF", h.curX, 382); }
    }
  }

  // Destination Banquet Table
  ctx.fillStyle = PAL.WHITE; ctx.fillRect(def.goalX - 10, 370, 95, 45);
  ctx.fillStyle = PAL.CORAL; ctx.fillRect(def.goalX - 10, 370, 95, 10);
  ctx.fillStyle = PAL.GOLD; ctx.font = "bold 12px monospace"; ctx.textAlign = "center";
  ctx.fillText("CAKE TABLE", def.goalX + 38, 354);

  // Carrier Player Silhouette
  ctx.fillStyle = PAL.WHITE; ctx.fillRect(px - 10, py - 54, 20, 54);
  ctx.fillStyle = PAL.GOLD; ctx.fillRect(px - 10, py - 54, 20, 12); // Hat/hair
  if (wobblePct > 65) {
    ctx.fillStyle = PAL.CORAL; ctx.font = "bold 12px monospace"; ctx.textAlign = "center";
    ctx.fillText("WHOA!", px + 26, py - 68);
  }

  // Silver Plate
  const plateX = px + facing * 12, plateY = py - 46;
  ctx.fillStyle = PAL.WHITE; ctx.fillRect(plateX - 42, plateY, 84, 5);

  // Stacked Tiers + Fallen Tiers
  let curY = plateY;
  for (const t of tiers) {
    if (t.fallen) {
      ctx.save(); ctx.translate(t.fallX, t.fallY); ctx.rotate(t.fallAng);
      ctx.fillStyle = st.style.body; ctx.fillRect(-t.w/2, -t.h, t.w, t.h);
      ctx.fillStyle = st.style.frost; ctx.fillRect(-t.w/2, -t.h, t.w, 5);
      ctx.restore();
    } else {
      ctx.save(); ctx.translate(plateX + t.xOff, curY); ctx.rotate(t.angle);
      ctx.fillStyle = st.style.body; ctx.fillRect(-t.w/2, -t.h, t.w, t.h);
      ctx.fillStyle = st.style.frost; ctx.fillRect(-t.w/2, -t.h, t.w, 5);
      ctx.strokeStyle = PAL.BG; ctx.lineWidth = 1.5; ctx.strokeRect(-t.w/2, -t.h, t.w, t.h);
      ctx.restore();
      curY -= t.h;
    }
  }
}

function renderHUD(st) {
  ctx.fillStyle = "rgba(15,14,23,0.92)"; ctx.fillRect(0, 0, LOGICAL_W, 42);
  ctx.fillStyle = PAL.GOLD; ctx.fillRect(0, 40, LOGICAL_W, 2);
  ctx.textAlign = "left"; ctx.font = "bold 14px monospace";
  ctx.fillStyle = PAL.GOLD; ctx.fillText(`CAKE #${String(st.def.id).padStart(2,"0")}: ${st.def.name}`, 14, 21);

  // Wobble Meter Bar
  ctx.fillStyle = PAL.WHITE; ctx.fillText("WOBBLE:", 310, 21);
  ctx.fillStyle = PAL.STONE; ctx.fillRect(380, 12, 110, 16);
  ctx.fillStyle = st.wobblePct > 70 ? PAL.CORAL : (st.wobblePct > 40 ? PAL.GOLD : PAL.MINT);
  ctx.fillRect(380, 12, Math.round(1.1 * st.wobblePct), 16);

  const sec = (st.timeLeft / 60).toFixed(1);
  ctx.fillStyle = st.timeLeft < 300 ? PAL.CORAL : PAL.WHITE; ctx.fillText(`TIME:${sec}S`, 512, 21);
  const intact = st.tiers.filter(t => !t.fallen).length;
  ctx.fillStyle = PAL.MINT; ctx.fillText(`TIERS:${intact}/${st.tiers.length}`, 615, 21);

  addBtn(726, 7, 66, 26, "MENU", () => { app.screen = "title"; }, PAL.STONE, PAL.GOLD);
  addBtn(798, 7, 74, 26, "VENUES", () => { app.screen = "select"; }, PAL.STONE, PAL.WHITE);
  addBtn(878, 7, 70, 26, "RETRY", () => startCakeLevel(app.currentIdx), PAL.STONE, PAL.CORAL, PAL.CORAL);

  if ((progress.fails[st.def.id] || 0) >= 8) {
    addBtn(14, 48, 178, 26, app.showGhost ? "GHOST: ON [G]" : "GHOST ROUTE [G]", () => { app.showGhost = !app.showGhost; }, app.showGhost ? PAL.GOLD : PAL.STONE);
  }
  if (progress.bigObsOverlay) {
    ctx.fillStyle = "rgba(15,14,23,0.9)"; ctx.fillRect(LOGICAL_W - 180, 50, 166, 68);
    ctx.strokeStyle = PAL.CORAL; ctx.strokeRect(LOGICAL_W - 180, 50, 166, 68);
    ctx.fillStyle = PAL.WHITE; ctx.textAlign = "center"; ctx.font = "bold 12px monospace"; ctx.fillText("CAKE DROPS", LOGICAL_W - 97, 68);
    ctx.fillStyle = PAL.CORAL; ctx.font = "bold 28px monospace"; ctx.fillText(String(progress.totalFalls), LOGICAL_W - 97, 98);
  }

  // Narrator hushed footer
  ctx.fillStyle = "rgba(15,14,23,0.92)"; ctx.fillRect(0, LOGICAL_H - 32, LOGICAL_W, 32);
  ctx.fillStyle = PAL.CORAL; ctx.fillRect(0, LOGICAL_H - 32, 6, 32);
  ctx.fillStyle = PAL.WHITE; ctx.font = "bold 13px monospace"; ctx.textAlign = "left";
  ctx.fillText(app.narratorText, 16, LOGICAL_H - 12);
}

function renderSummary(st) {
  ctx.fillStyle = "rgba(15,14,23,0.95)"; ctx.fillRect(130, 52, 700, 436);
  ctx.strokeStyle = st.won ? PAL.GOLD : PAL.CORAL; ctx.lineWidth = 3; ctx.strokeRect(130, 52, 700, 436);
  ctx.textAlign = "center";
  if (st.won) {
    const sb = st.scoreBreakdown;
    ctx.fillStyle = PAL.GOLD; ctx.font = "bold 28px monospace";
    ctx.fillText(`DELIVERED! ${"*".repeat(sb.stars)} (${sb.total} PTS)`, 480, 96);
    // Polaroid Photo summary box
    ctx.fillStyle = PAL.WHITE; ctx.fillRect(365, 118, 230, 160);
    ctx.fillStyle = PAL.BG; ctx.fillRect(377, 130, 206, 118);
    let cy = 236;
    for (const t of st.tiers) {
      if (t.fallen) continue;
      ctx.fillStyle = st.style.body; ctx.fillRect(480 - t.w/2, cy - 16, t.w, 16);
      ctx.fillStyle = st.style.frost; ctx.fillRect(480 - t.w/2, cy - 16, t.w, 4);
      cy -= 16;
    }
    ctx.fillStyle = PAL.BG; ctx.font = "bold 11px monospace";
    ctx.fillText(`${sb.intact}/${sb.totalTiers} TIERS INTACT!`, 480, 266);
    ctx.fillStyle = PAL.MINT; ctx.font = "bold 14px monospace";
    ctx.fillText(`CLOSEST SAVE DELTA: ${st.closestSaveDelta}%  |  ZERO-WOBBLE STREAK: ${st.bestZeroStreak}T`, 480, 312);
  } else {
    ctx.fillStyle = PAL.CORAL; ctx.font = "bold 30px monospace";
    ctx.fillText("CAKE TRAGEDY!", 480, 96);
    ctx.fillStyle = PAL.GOLD; ctx.font = "bold 16px monospace"; ctx.fillText("DAMAGE REPORT", 480, 142);
    for (let i = 0; i < Math.min(6, st.dropReports.length); i++) {
      ctx.fillStyle = PAL.WHITE; ctx.font = "14px monospace";
      ctx.fillText(st.dropReports[i], 480, 178 + i * 28);
    }
  }
  addBtn(175, 418, 175, 44, "RETRY [R]", () => startCakeLevel(app.currentIdx), PAL.STONE, PAL.WHITE);
  if (st.history.length > 20) {
    addBtn(368, 418, 224, 44, "DRAMATIC REPLAY", () => {
      app.replayFrames = st.history.slice(Math.max(0, st.history.length - 100)); app.replayIdx = 0;
    }, PAL.STONE, PAL.CORAL, PAL.CORAL);
  }
  addBtn(610, 418, 175, 44, st.won && app.currentIdx + 1 < LEVELS.length ? "NEXT VENUE" : "MAIN MENU", () => {
    if (st.won && app.currentIdx + 1 < LEVELS.length) startCakeLevel(app.currentIdx + 1);
    else app.screen = "title";
  }, PAL.GOLD, PAL.BG);
}

function renderTitleScreen() {
  ctx.fillStyle = PAL.BG; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  ctx.fillStyle = PAL.CORAL; ctx.textAlign = "center"; ctx.font = "bold 44px monospace";
  ctx.fillText("DON'T DROP THE CAKE", 482, 92);
  ctx.fillStyle = PAL.GOLD; ctx.fillText("DON'T DROP THE CAKE", 478, 88);
  ctx.fillStyle = PAL.WHITE; ctx.font = "bold 16px monospace";
  ctx.fillText(`STARS: ${totalStars()}/90   |   DROPS: ${progress.totalFalls}`, 480, 140);

  const daily = getDailyCakeId();
  addBtn(310, 184, 340, 50, "PLAY / CONTINUE", () => {
    const next = LEVELS.findIndex(l => !progress.stars[l.id]);
    startCakeLevel(next >= 0 ? next : 0);
  }, PAL.GOLD, PAL.BG);
  addBtn(310, 246, 340, 42, `DAILY CAKE (#${daily})`, () => startCakeLevel(daily - 1), PAL.STONE, PAL.GOLD);
  addBtn(310, 298, 340, 42, "30 VENUES & CAKE SHOP", () => { app.screen = "select"; }, PAL.STONE, PAL.WHITE);
  addBtn(310, 350, 340, 40, progress.muted ? "SOUND: MUTED" : "SOUND: ON", () => { progress.muted = !progress.muted; sfx.muted = progress.muted; saveProgress(progress); }, PAL.STONE, PAL.WHITE);
  addBtn(310, 400, 340, 40, "< BACK TO ARCADE HUB", () => { window.location.href = "index.html"; }, PAL.STONE, PAL.CORAL, PAL.CORAL);
}

function renderSelect() {
  ctx.fillStyle = PAL.BG; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  ctx.fillStyle = PAL.GOLD; ctx.textAlign = "center"; ctx.font = "bold 22px monospace";
  ctx.fillText("SELECT VENUE (1-30) & UNLOCK CAKES", 480, 28);
  for (let i = 0; i < 30; i++) {
    const col = i % 10, row = Math.floor(i / 10);
    const st = progress.stars[i + 1] || 0;
    addBtn(36 + col * 90, 56 + row * 78, 82, 66, `#${i+1} ${"*".repeat(st)||"-"}`, () => startCakeLevel(i), PAL.STONE, st ? PAL.GOLD : PAL.WHITE, st ? PAL.GOLD : PAL.STONE);
  }
  for (let i = 0; i < CAKE_STYLES.length; i++) {
    const s = CAKE_STYLES[i];
    const ok = totalStars() >= s.starsNeed;
    const sel = progress.styleId === s.id;
    addBtn(90 + i * 200, 330, 180, 46, `${s.name} (${s.starsNeed}*)`, () => {
      if (!ok) showToast(`NEED ${s.starsNeed} STARS!`);
      else { progress.styleId = s.id; saveProgress(progress); }
    }, sel ? PAL.GOLD : PAL.STONE, sel ? PAL.BG : (ok ? PAL.WHITE : PAL.CORAL));
  }
  addBtn(390, 468, 180, 42, "MAIN MENU", () => { app.screen = "title"; }, PAL.GOLD, PAL.BG);
}

function renderSolver() {
  if (!app.solverOverlay) return;
  const { results, lieCheck, passed, total } = app.solverOverlay;
  ctx.fillStyle = "rgba(15,14,23,0.96)"; ctx.fillRect(40, 28, 880, 484);
  ctx.strokeStyle = PAL.GOLD; ctx.strokeRect(40, 28, 880, 484);
  ctx.fillStyle = PAL.GOLD; ctx.textAlign = "center"; ctx.font = "bold 20px monospace";
  ctx.fillText(`F9 SOLVER: ${passed}/${total} PASS | LIE CHECK: ${lieCheck.ok ? "UNIQUE" : "DUP"}`, 480, 62);
  for (let i = 0; i < results.length; i++) {
    const r = results[i], col = i % 6, row = Math.floor(i / 6);
    const x = 90 + col * 132, y = 92 + row * 68;
    ctx.fillStyle = r.pass ? PAL.STONE : PAL.CORAL; ctx.fillRect(x, y, 120, 54);
    ctx.fillStyle = PAL.WHITE; ctx.font = "bold 12px monospace"; ctx.fillText(`#${r.id}: ${r.pass ? "PASS" : "FAIL"}`, x + 60, y + 30);
  }
  addBtn(400, 464, 160, 34, "CLOSE [F9]", () => { app.solverOverlay = null; }, PAL.GOLD, PAL.BG);
}

function render() {
  uiButtons.length = 0;
  touchEl.classList.toggle("active", (app.screen === "play" || app.screen === "summary") && isTouchCapable());
  if (app.screen === "title") renderTitleScreen();
  else if (app.screen === "select") renderSelect();
  else if (app.state) {
    if (app.replayFrames) {
      const f = app.replayFrames[Math.floor(app.replayIdx)];
      ctx.save(); ctx.translate(480, 270); ctx.scale(1.45, 1.45); ctx.translate(-f.px, -f.py + 50);
      drawCakeScene(app.state, f.px, f.py, f.tiers, f.facing, 100);
      ctx.restore();
      ctx.fillStyle = PAL.CORAL; ctx.textAlign = "center"; ctx.font = "bold 18px monospace"; ctx.fillText("DRAMATIC ZOOM REPLAY", 480, 66);
    } else {
      drawCakeScene(app.state, app.state.playerX, app.state.playerY, app.state.tiers, app.state.facing, app.state.wobblePct);
    }
    renderHUD(app.state);
    if (app.screen === "summary" && !app.replayFrames) renderSummary(app.state);
  }
  renderSolver();
}

let lastT = performance.now(), acc = 0;
function tick() {
  app.uiTick++;
  if (app.replayFrames) {
    app.replayIdx += 0.35;
    if (app.replayIdx >= app.replayFrames.length) app.replayFrames = null;
    return;
  }
  if (app.screen === "play" && app.state && !app.solverOverlay) {
    let inp = {
      left: app.keys.left || app.touch.left, right: app.keys.right || app.touch.right,
      leanL: app.keys.leanL || app.touch.leanL, leanR: app.keys.leanR || app.touch.leanR,
      steady: app.keys.steady || app.touch.steady
    };
    if (app.botWatch) {
      inp = app.botWatch.frames[app.botWatch.idx++] || {};
      if (app.botWatch.idx > app.botWatch.frames.length + 10) app.botWatch = null;
    }
    stepCake(app.state, inp);
    for (const s of app.state.soundEvents) sfx.play(s.name, s.param);
    if (app.state.tick % 240 === 0 && app.state.wobblePct > 45) app.narratorText = pickNarratorLine();
    if (app.state.won) {
      const sb = app.state.scoreBreakdown;
      progress.stars[app.state.def.id] = Math.max(progress.stars[app.state.def.id] || 0, sb.stars);
      progress.bestScores[app.state.def.id] = Math.max(progress.bestScores[app.state.def.id] || 0, sb.total);
      saveProgress(progress);
      app.screen = "summary";
    } else if (app.state.failed) {
      progress.fails[app.state.def.id] = (progress.fails[app.state.def.id] || 0) + 1;
      progress.totalFalls++;
      saveProgress(progress);
      app.narratorText = pickNarratorLine();
      app.screen = "summary";
    }
  }
}

function frame(now) {
  acc += Math.min(0.1, (now - lastT) / 1000); lastT = now;
  while (acc >= FIXED_DT) { tick(); acc -= FIXED_DT; }
  render();
  requestAnimationFrame(frame);
}

const hashM = (window.location.hash || "").match(/code=DDC-(\d+)/i);
if (hashM) { const n = parseInt(hashM[1], 10); if (n >= 1 && n <= LEVELS.length) startCakeLevel(n - 1); }
requestAnimationFrame(frame);
</script>
