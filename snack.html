================================================================================
  THE SNEAKY SNACK — README & ARCHITECTURE NOTES
================================================================================
  CONTROLS (Default — Remappable in Settings):
    Move          : WASD / Arrow Keys / Touch D-Pad
    Tiptoe        : Hold Shift (slow, 0.42x noise) / Touch TIPTOE toggle
    Crouch-Crawl  : Hold or Toggle C (slowest, 0.20x noise, passes under tables)
    Grab / Act    : E or Space (pick up clutter, grab snack at fridge, silence alarm)
    Instant Retry : R (resets level < 200ms while preserving Squeak Memory)
    Pause/Settings: Esc
    OBS Overlay   : O (clean fail counter + noise meter for stream capture)
    Clip List     : M (or Clip button in HUD/Pause; logs every 5th discovery)
    Safe Mode     : V (Streamer-Safe: disables discovery flash & screen shake)
    Color-Blind   : K (adds shape-coded plank markings & visual sound rings)
    Chat Map      : H (shows discovered Squeak Map side panel for viewers)
    Share Code    : S (sets URL hash e.g. #code=SS-014)
    Debug Solver  : F9 (runs deterministic replay verification on ALL 50 levels +
                    verifies `assertDifficultyNonDecreasing()`)
    Watch Bot     : Shift+F9 (watch the solver beat the current level live)

  HOW TO RUN THE SOLVER:
    1. Open index.html in any browser.
    2. Press F9 anywhere to execute `runAllSolvers()` across all 50 levels and
       verify the strictly non-decreasing `DIFFICULTY_INDEX` check.
    3. Press Shift+F9 during any level to watch the bot replay live.

  HOW TO ADD A LEVEL:
    1. Register a level via `addLevel({ id, house, name, score, newIdea, tell,
       solutionSummary, snack, starNoiseMax, starTimeSec, returnToBed, grid,
       start, fridge, sleepers, hazards, clutter, doors, ... })`.
       Note: `score` (1..100) MUST be >= the previous level's `score`.
    2. Add a deterministic input sequence to `LEVEL_SOLUTIONS[id]`.
    3. Press F9 to verify 100% PASS and non-decreasing Difficulty Index.

  SELF-REVIEW FAIRNESS CHECKLIST:
    [x] Zero randomness: every plank, sleeper turn, snore, dog sneeze, cat patrol,
        parrot echo, motion light, vacuum, and balloon follows fixed schedules.
    [x] 50/50 levels verified via F9 deterministic 60 Hz replay solver.
    [x] Every hazard has a pre-hit visual/audio tell (nail heads, blanket shift,
        ear/nose twitch, laser sweep cone, hiss/tick).
    [x] Strictly non-decreasing Difficulty Index (`assertDifficultyNonDecreasing()`).
    [x] Optional Ghost Route unlocks after 8 failed attempts per level.
    [x] Unique `sneakysnack_` localStorage prefix wrapped in try/catch; relative paths.
================================================================================

/* ============================================================================
 * 3. WEB AUDIO SYNTHESIZER (NO EXTERNAL ASSETS, STARTS ON FIRST USER INPUT)
 * ============================================================================ */
class SoundEngine {
  constructor() { this.ctx = null; this.muted = false; }
  unlock() {
    if (this.muted) return;
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
  }
  tone(freq, dur, type = "triangle", vol = 0.06, slideTo = null, delay = 0) {
    if (this.muted || !this.ctx || this.ctx.state !== "running") return;
    const t = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(30, freq), t);
    if (slideTo !== null) osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(t); osc.stop(t + dur + 0.01);
  }
  play(name, param = 0) {
    if (this.muted || !this.ctx || this.ctx.state !== "running") return;
    switch (name) {
      case "step":    this.tone(110, 0.03, "sine", 0.025, 80); break;
      case "creak":   this.tone(280, 0.08, "triangle", 0.045, 220); break;
      case "squeak":  this.tone(540, 0.11, "sawtooth", 0.04, 680); break;
      case "groan":   this.tone(145, 0.18, "sawtooth", 0.06, 95); break;
      case "clutter": this.tone(660, 0.08, "square", 0.05, 320); break;
      case "pickup":  this.tone(420, 0.05, "sine", 0.04, 580); break;
      case "door":    this.tone(240, 0.14, "triangle", 0.04, 185); break;
      case "snore":   this.tone(90, 0.25, "sine", 0.025, 115); break;
      case "sneeze":  this.tone(480, 0.14, "sawtooth", 0.07, 160); break;
      case "heart":   this.tone(72 + param * 30, 0.05, "sine", 0.045, 52); break;
      case "fridge":  this.tone(160, 0.12, "triangle", 0.05, 220); break;
      case "grab":    this.tone(520, 0.07, "triangle", 0.06, 780); break;
      case "busted":
        this.tone(220, 0.16, "sawtooth", 0.09, 110);
        this.tone(620, 0.12, "square", 0.05, 310, 0.04);

      case "win":

        this.tone(1046.5, 0.22, "triangle", 0.08, null, 0.24);

  }
}

function buildHouseGrid(fn) {
  const g = Array.from({ length: ROWS }, (_, r) => {
    const row = Array(COLS).fill(".");
    if (r <= 1 || r === ROWS - 1) row.fill("#");
    row[0] = "#";
    row[COLS - 1] = "#";
    return row;
  });
  const api = {
    set(c, r, ch) { if (g[r] && g[r][c] !== undefined) g[r][c] = ch; },
    row(r, c1, c2, ch) { for (let c = c1; c <= c2; c++) api.set(c, r, ch); },
    col(c, r1, r2, ch) { for (let r = r1; r <= r2; r++) api.set(c, r, ch); },
    rect(c, r, w, h, ch) {
      for (let rr = r; rr < r + h; rr++)
        for (let cc = c; cc < c + w; cc++) api.set(cc, rr, ch);
    }
  };
  if (fn) fn(api);
  return g.map(r => r.join(""));
}

const LEVELS = [];
const DIFFICULTY_INDEX = [];

function addLevel(def) {
  const full = {
    snack: SNACKS[(def.id - 1) % SNACKS.length],
    starNoiseMax: Math.max(25, 85 - def.score * 0.45),
    starTimeSec: def.starTimeSec || (16 + Math.floor(def.score * 0.25)),
    returnToBed: !!def.returnToBed,
    sleepers: def.sleepers || [],
    hazards: def.hazards || [],
    clutter: def.clutter || [],
    doors: def.doors || [],
    ...def
  };
  LEVELS.push(full);
  DIFFICULTY_INDEX.push({
    id: full.id,
    house: full.house,
    name: full.name,
    score: full.score,
    newIdea: full.newIdea,
    tell: full.tell,
    solutionSummary: full.solutionSummary
  });
}

function assertDifficultyNonDecreasing() {
  const errors = [];
  for (let i = 1; i < DIFFICULTY_INDEX.length; i++) {
    if (DIFFICULTY_INDEX[i].score < DIFFICULTY_INDEX[i - 1].score) {
      errors.push(`L${DIFFICULTY_INDEX[i].id} score (${DIFFICULTY_INDEX[i].score}) < L${DIFFICULTY_INDEX[i - 1].id} (${DIFFICULTY_INDEX[i - 1].score})`);
    }
  }
  return { ok: errors.length === 0, count: DIFFICULTY_INDEX.length, errors };
}

/* ============================================================================
 * 6. DETERMINISTIC 60 HZ SIMULATION ENGINE
 * ============================================================================ */
function createLevelState(def, squeakMemory = {}) {
  const grid = def.grid.map(r => r.split(""));
  const doors = def.doors.map(d => ({ ...d, progress: 0, open: false, creaked: false }));
  const clutter = def.clutter.map(c => ({ ...c, picked: false, x: c.col * TILE + 15, y: c.row * TILE + 15 }));
  const sleepers = def.sleepers.map(s => ({ ...s, turning: false, turnWarnActive: false, snoring: false, awake: false }));
  const hazards = def.hazards.map(h => ({
    ...h,
    x: h.x !== undefined ? h.x : (h.col || 0) * TILE + 15,
    y: h.y !== undefined ? h.y : (h.row || 0) * TILE + 15,
    curX: h.x !== undefined ? h.x : (h.col || 0) * TILE + 15,
    curY: h.y !== undefined ? h.y : (h.row || 0) * TILE + 15,
    sneezing: false, noseTwitch: false, earAlert: false,
    echoTicks: 0, echoNoise: 0, warnActive: false, popped: false
  }));
  return {
    def, grid, doors, clutter, sleepers, hazards,
    tick: 0,
    noise: 0,
    peakNoise: 0,
    closestSleeperName: sleepers[0] ? sleepers[0].name : "House",
    closestMargin: 999,
    stepTimer: 0,
    player: {
      x: def.start.col * TILE + 15,
      y: def.start.row * TILE + 15,
      facing: 1,
      mode: "walk",
      hasSnack: false,
      fridgeTicks: 0
    },
    alarmSilenced: !def.alarmSwitch,
    squeakMemory: { ...squeakMemory },
    speakerMsg: "",
    speakerTicks: 0,
    history: [],
    soundEvents: [],
    won: false,
    failed: false,
    failReason: "",
    wokeSleeper: null
  };
}

function isBlockedAt(state, px, py, crouching) {
  const pts = [
    [px - PLAYER_R, py - PLAYER_R], [px + PLAYER_R, py - PLAYER_R],
    [px - PLAYER_R, py + PLAYER_R], [px + PLAYER_R, py + PLAYER_R]
  ];
  for (const [x, y] of pts) {
    const c = Math.floor(x / TILE), r = Math.floor(y / TILE);
    if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return true;
    const ch = state.grid[r][c];
    if (ch === "#") return true;
    if (ch === "T" && !crouching) return true;
    for (const d of state.doors) {
      if (!d.open && c === d.col && r >= d.row && r < d.row + (d.h || 1)) return true;
    }
    for (const h of state.hazards) {
      if (h.kind === "vacuum" && Math.hypot(x - h.curX, y - h.curY) < 13) return true;
    }
  }
  return false;
}

function stepSim(state, input) {
  state.soundEvents.length = 0;
  if (state.won || state.failed) return;
  state.tick++;
  const def = state.def;
  const p = state.player;
  if (state.speakerTicks > 0) state.speakerTicks--;

  // Movement mode
  p.mode = input.crouch ? "crouch" : (input.tiptoe ? "tiptoe" : "walk");
  const spd = p.mode === "crouch" ? CROUCH_SPEED : (p.mode === "tiptoe" ? TIPTOE_SPEED : WALK_SPEED);
  let dx = (input.right ? 1 : 0) - (input.left ? 1 : 0);
  let dy = (input.down ? 1 : 0) - (input.up ? 1 : 0);
  if (dx !== 0 && dy !== 0) { const inv = 1 / Math.SQRT2; dx *= inv; dy *= inv; }
  if (dx !== 0) p.facing = dx > 0 ? 1 : -1;

  const moving = dx !== 0 || dy !== 0;
  if (moving) {
    const nx = p.x + dx * spd * FIXED_DT;
    if (!isBlockedAt(state, nx, p.y, p.mode === "crouch")) p.x = nx;
    const ny = p.y + dy * spd * FIXED_DT;
    if (!isBlockedAt(state, p.x, ny, p.mode === "crouch")) p.y = ny;
  }

  // Record history for instant zoom replay on failure
  if (state.tick % 2 === 0) {
    state.history.push({ x: p.x, y: p.y, mode: p.mode, noise: state.noise });
    if (state.history.length > 90) state.history.shift();
  }

  // Doors interaction
  for (const d of state.doors) {
    if (d.open) continue;
    const dcx = d.col * TILE + 15, dcy = (d.row + (d.h || 1) / 2 - 0.5) * TILE + 15;
    if (Math.hypot(p.x - dcx, p.y - dcy) < 34) {
      if (p.mode === "walk") {
        d.open = true;
        state.noise += DOOR_FAST_NOISE;
        state.soundEvents.push({ name: "door" });
      } else {
        d.progress++;
        if (d.progress >= DOOR_SLOW_TICKS) {
          d.open = true;
          state.noise += 4;
          state.soundEvents.push({ name: "door" });
        }
      }
    }
  }

  // Alarm silence switch
  if (!state.alarmSilenced && def.alarmSwitch) {
    const swx = def.alarmSwitch.col * TILE + 15, swy = def.alarmSwitch.row * TILE + 15;
    if (Math.hypot(p.x - swx, p.y - swy) < 26) {
      state.alarmSilenced = true;
      state.soundEvents.push({ name: "pickup" });
    }
  }

  // Clutter pickup or accidental step
  for (const cl of state.clutter) {
    if (cl.picked) continue;
    const dist = Math.hypot(p.x - cl.x, p.y - cl.y);
    if (input.act && dist < 30) {
      cl.picked = true;
      state.noise += CLUTTER_PICKUP_NOISE;
      state.soundEvents.push({ name: "pickup" });
    } else if (dist < 14) {
      cl.picked = true;
      state.noise += CLUTTER_STEP_NOISE;
      state.soundEvents.push({ name: "clutter" });
    }
  }

  // Update hazards & compute masking
  let masked = false;
  for (const h of state.hazards) {
    if (h.kind === "dog") {
      if (h.earPeriod) {
        const ph = state.tick % h.earPeriod;
        h.earAlert = ph >= h.earAlertFrom && ph <= h.earAlertTo;
      }
      if (h.sneezePeriod) {
        const ph = state.tick % h.sneezePeriod;
        h.noseTwitch = ph >= h.sneezeWarn && ph < h.sneezeAt;
        h.sneezing = ph >= h.sneezeAt && ph <= h.sneezeEnd;
        if (ph === h.sneezeAt) state.soundEvents.push({ name: "sneeze" });
        if (h.sneezing) masked = true;
      }
    } else if (h.kind === "cat") {
      const t = (state.tick % h.period) / h.period;
      const s = 0.5 - 0.5 * Math.cos(t * Math.PI * 2);
      h.curY = (h.minRow + (h.maxRow - h.minRow) * s) * TILE + 15;
      if (Math.hypot(p.x - h.curX, p.y - h.curY) < 24 && p.mode === "walk" && state.tick % 20 === 0) {
        state.noise += h.glassNoise;
        state.soundEvents.push({ name: "clutter" });
      }
    } else if (h.kind === "parrot") {
      if (h.echoTicks > 0) {
        h.echoTicks--;
        if (h.echoTicks === 0) {
          state.noise += h.echoNoise;
          state.soundEvents.push({ name: "squeak" });
        }
      }
    } else if (h.kind === "light") {
      const t = ((state.tick + (h.offset || 0)) % h.period) / h.period;
      const s = 0.5 - 0.5 * Math.cos(t * Math.PI * 2);
      h.curY = h.minY + (h.maxY - h.minY) * s;
      if (Math.hypot(p.x - h.curX, p.y - h.curY) < h.r * 0.48) {
        triggerDiscovery(state, "Spotted by the motion sensor!", state.sleepers[0]);
        return;
      }
    } else if (h.kind === "vacuum") {
      const t = (state.tick % h.period) / h.period;
      const s = 0.5 - 0.5 * Math.cos(t * Math.PI * 2);
      h.curX = h.minX + (h.maxX - h.minX) * s;
      if (Math.hypot(p.x - h.curX, p.y - h.curY) <= (h.maskR || 70)) masked = true;
    } else if (h.kind === "maskZone") {
      if (p.x >= h.x && p.x <= h.x + h.w && p.y >= h.y && p.y <= h.y + h.h) masked = true;
    } else if (h.kind === "speaker") {
      if (state.noise >= h.warnAt && state.speakerTicks === 0) {
        state.speakerMsg = `SMART SPEAKER: "NOISE AT ${Math.round(state.noise)}%"`;
        state.speakerTicks = 90;
        state.noise += 6;
      }
    } else if (h.kind === "balloon") {
      const t = ((state.tick + (h.offset || 0)) % h.period) / h.period;
      const s = 0.5 - 0.5 * Math.cos(t * Math.PI * 2);
      h.curY = h.minY + (h.maxY - h.minY) * s;
      if (!h.popped && Math.hypot(p.x - h.curX, p.y - h.curY) < 20) {
        h.popped = true;
        state.noise += 28;
        state.soundEvents.push({ name: "clutter" });
      }
    }
  }

  // Update sleepers & snore masking
  for (const sl of state.sleepers) {
    if (sl.turnPeriod) {
      const ph = (state.tick + (sl.offset || 0)) % sl.turnPeriod;
      sl.turnWarnActive = ph >= (sl.turnPeriod - sl.turnWarn - sl.turnDur) && ph < (sl.turnPeriod - sl.turnDur);
      sl.turning = ph >= (sl.turnPeriod - sl.turnDur);
    }
    if (sl.snorePeriod) {
      const ph = state.tick % sl.snorePeriod;
      sl.snoring = ph >= sl.snoreFrom && ph <= sl.snoreTo;
      if (ph === sl.snoreFrom) state.soundEvents.push({ name: "snore" });
      if (sl.snoring) masked = true;
    }
  }

  // Tile noise on footsteps
  const pc = Math.floor(p.x / TILE), pr = Math.floor(p.y / TILE);
  let tileCh = (state.grid[pr] && state.grid[pr][pc]) || ".";
  if (def.shiftingPlanks) {
    for (const sp of def.shiftingPlanks) {
      if (sp.cols.includes(pc) && (state.tick % sp.period) >= sp.period * 0.5) tileCh = "=";
    }
  }
  if (moving) {
    const interval = p.mode === "crouch" ? STEP_INTERVAL_CROUCH : (p.mode === "tiptoe" ? STEP_INTERVAL_TIP : STEP_INTERVAL_WALK);
    state.stepTimer++;
    if (state.stepTimer >= interval) {
      state.stepTimer = 0;
      const base = TILE_NOISE[tileCh] || 0;
      if (base > 0) state.squeakMemory[`${pc},${pr}`] = tileCh;
      const mult = p.mode === "crouch" ? 0.20 : (p.mode === "tiptoe" ? 0.42 : 1.0);
      const added = masked ? 0 : base * mult;
      state.noise += added;
      if (added > 10) {
        for (const h of state.hazards) {
          if (h.kind === "parrot" && h.echoTicks === 0) {
            h.echoTicks = h.delayTicks;
            h.echoNoise = Math.round(added * 0.8);
          }
        }
      }
      if (base >= 24) state.soundEvents.push({ name: "groan" });
      else if (base >= 12) state.soundEvents.push({ name: "squeak" });
      else if (base >= 6) state.soundEvents.push({ name: "creak" });
      else state.soundEvents.push({ name: "step" });
    }
  } else {
    state.stepTimer = 0;
  }

  // Noise decay
  const decay = moving ? NOISE_DECAY_MOVE : NOISE_DECAY_IDLE;
  state.noise = Math.max(0, state.noise - decay * FIXED_DT);
  if (state.noise > state.peakNoise) state.peakNoise = state.noise;

  // Fridge interaction (1.0s = 60 ticks)
  const fx = def.fridge.col * TILE + 15, fy = def.fridge.row * TILE + 15;
  if (!p.hasSnack && Math.hypot(p.x - fx, p.y - fy) < 34) {
    if (input.act) {
      if (!state.alarmSilenced) {
        state.noise += 30;
        state.soundEvents.push({ name: "busted" });
      } else {
        p.fridgeTicks++;
        if (!masked) state.noise += FRIDGE_INTERACT_NOISE;
        if (p.fridgeTicks % 20 === 1) state.soundEvents.push({ name: "fridge" });
        if (p.fridgeTicks >= FRIDGE_INTERACT_TICKS) {
          p.hasSnack = true;
          state.soundEvents.push({ name: "grab" });
          if (!def.returnToBed) { finalizeWin(state); return; }
        }
      }
    }
  } else if (!p.hasSnack) {
    p.fridgeTicks = Math.max(0, p.fridgeTicks - 2);
  }

  // Return to Bed (for two-trip levels)
  if (p.hasSnack && def.returnToBed) {
    const bx = def.start.col * TILE + 15, by = def.start.row * TILE + 15;
    if (Math.hypot(p.x - bx, p.y - by) < 28) { finalizeWin(state); return; }
  }

  // Check sleeper & dog wake thresholds
  for (const sl of state.sleepers) {
    const effThresh = Math.max(12, sl.threshold - (sl.turning ? (sl.turnDrop || 16) : 0));
    const margin = effThresh - state.noise;
    if (margin < state.closestMargin) {
      state.closestMargin = margin;
      state.closestSleeperName = sl.name;
    }
    if (state.noise >= effThresh) {
      triggerDiscovery(state, INCIDENT_REPORTS[def.id % INCIDENT_REPORTS.length], sl);
      return;
    }
  }
  for (const h of state.hazards) {
    if (h.kind === "dog") {
      const effThresh = h.threshold - (h.earAlert ? 12 : 0);
      if (state.noise >= effThresh) {
        triggerDiscovery(state, "The Dog Heard Your Slippers", { name: "Dog", col: h.col, row: h.row });
        return;
      }
    }
  }
}

function triggerDiscovery(state, reason, sleeper) {
  state.failed = true;
  state.failReason = reason;
  state.wokeSleeper = sleeper || state.sleepers[0] || { name: "House", col: 15, row: 4 };
  state.soundEvents.push({ name: "busted" });
}

function finalizeWin(state) {
  state.won = true;
  const elapsed = state.tick / 60;
  const underNoise = state.peakNoise <= state.def.starNoiseMax;
  const underTime = elapsed <= state.def.starTimeSec;
  const stars = 1 + (underNoise ? 1 : 0) + (underNoise && underTime ? 1 : 0);
  state.scoreBreakdown = { stars, elapsed: elapsed.toFixed(1), peakNoise: Math.round(state.peakNoise) };
  state.soundEvents.push({ name: "win" });
}

function expandSolution(segs) {
  const frames = [];
  for (const s of segs || []) {
    const n = s.ticks || 1;
    for (let i = 0; i < n; i++) {
      frames.push({
        left: !!s.left, right: !!s.right, up: !!s.up, down: !!s.down,
        tiptoe: !!s.tiptoe, crouch: !!s.crouch, act: !!s.act
      });
    }
  }
  return frames;
}

function runHeadlessSolverForLevel(levelId) {
  const def = LEVELS.find(l => l.id === levelId);
  const segs = LEVEL_SOLUTIONS[levelId];
  if (!def || !segs) return { id: levelId, name: def ? def.name : "?", pass: false, reason: "Missing solution" };
  const frames = expandSolution(segs);
  const st = createLevelState(def);
  for (let i = 0; i < frames.length; i++) {
    stepSim(st, frames[i]);
    if (st.won) return { id: levelId, name: def.name, pass: true, ticks: st.tick, seconds: (st.tick / 60).toFixed(2) };
    if (st.failed) return { id: levelId, name: def.name, pass: false, ticks: st.tick, reason: st.failReason };
  }
  return { id: levelId, name: def.name, pass: false, ticks: st.tick, reason: `Timeout @ (${Math.round(st.player.x)},${Math.round(st.player.y)})` };
}

function runAllSolvers() {
  const diffCheck = assertDifficultyNonDecreasing();
  const results = LEVELS.map(l => runHeadlessSolverForLevel(l.id));
  const passed = results.filter(r => r.pass).length;
  console.group(`THE SNEAKY SNACK F9 SOLVER: ${passed}/${results.length} PASS | DIFFICULTY: ${diffCheck.ok ? "NON-DECREASING OK" : "FAIL"}`);
  if (!diffCheck.ok) console.error(diffCheck.errors);
  for (const r of results) console.log(`L${String(r.id).padStart(2, "0")} (${r.name}): ${r.pass ? `PASS [${r.seconds}s]` : `FAIL - ${r.reason}`}`);
  console.groupEnd();
  return { results, diffCheck, passed, total: results.length };
}

  mouse: { x: 480, y: 270 },
  keys: { left: false, right: false, up: false, down: false, tiptoe: false, crouch: false, act: false },
  touch: { left: false, right: false, up: false, down: false, tiptoe: false, crouch: false, act: false }
};

function pickNarratorLine() {
  let idx;
  do { idx = Math.floor(Math.random() * NARRATOR_LINES.length); }
  while (idx === app.lastNarIdx && NARRATOR_LINES.length > 1);
  app.lastNarIdx = idx;
  return NARRATOR_LINES[idx];
}

function startLevel(idx) {
  app.currentIdx = Math.max(0, Math.min(LEVELS.length - 1, idx));
  const def = LEVELS[app.currentIdx];
  app.state = createLevelState(def, progress.squeakMaps[def.id] || {});
  app.replayFrames = null;
  app.botWatch = null;
  app.showGhost = false;
  app.screen = "play";
}

function shareCurrentLevelCode() {
  const id = LEVELS[app.currentIdx].id;
  const code = `SS-${String(id).padStart(3, "0")}`;
  try { window.history.replaceState(null, "", `#code=${code}`); } catch (e) {}
  showToast(`LEVEL CODE SET IN URL: #code=${code}`);
}

function parseHashLevel() {
  const m = (window.location.hash || "").match(/(?:code=SS-?|L=?)(\d+)/i);
  if (m) {
    const n = parseInt(m[1], 10);
    if (n >= 1 && n <= LEVELS.length) return n;
  }
  return null;
}

window.addEventListener("keydown", e => {
  sfx.unlock();
  const c = e.code;
  if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "Space", "F9"].includes(c)) e.preventDefault();
  if (c === "F9") {
    if (e.shiftKey) {
      startLevel(app.currentIdx);
      app.botWatch = { frames: expandSolution(LEVEL_SOLUTIONS[app.state.def.id] || []), index: 0 };
      app.solverOverlay = null;
      showToast(`BOT SNEAKING L${app.state.def.id}...`);
    } else {
      app.solverOverlay = app.solverOverlay ? null : runAllSolvers();
    }
    return;
  }
  if (c === "Escape") {
    if (app.solverOverlay) { app.solverOverlay = null; return; }
    if (app.screen === "play") app.screen = "pause";
    else if (app.screen === "pause" || app.screen === "clips" || app.screen === "more" || app.screen === "select") {
      app.screen = app.state ? "play" : "title";
    }
    return;
  }
  if (c === "KeyO") { progress.bigObsOverlay = !progress.bigObsOverlay; saveProgress(progress); return; }
  if (c === "KeyV") { progress.streamerSafe = !progress.streamerSafe; saveProgress(progress); showToast(`SAFE MODE: ${progress.streamerSafe ? "ON" : "OFF"}`); return; }
  if (c === "KeyK") { progress.colorBlind = !progress.colorBlind; saveProgress(progress); showToast(`COLOR-BLIND: ${progress.colorBlind ? "ON" : "OFF"}`); return; }
  if (c === "KeyH") { progress.chatMap = !progress.chatMap; saveProgress(progress); showToast(`CHAT MAP: ${progress.chatMap ? "ON" : "OFF"}`); return; }
  if (c === "KeyM") { app.screen = app.screen === "clips" ? (app.state ? "play" : "title") : "clips"; return; }
  if (c === "KeyS" && app.screen === "play") { shareCurrentLevelCode(); return; }
  if (c === "KeyR" && (app.screen === "play" || app.screen === "summary")) { startLevel(app.currentIdx); return; }

  if (c === "ArrowLeft" || c === "KeyA") app.keys.left = true;
  if (c === "ArrowRight" || c === "KeyD") app.keys.right = true;
  if (c === "ArrowUp" || c === "KeyW") app.keys.up = true;
  if (c === "ArrowDown" || c === "KeyS") app.keys.down = true;
  if (c === "ShiftLeft" || c === "ShiftRight") app.keys.tiptoe = true;
  if (c === "KeyC") app.keys.crouch = true;
  if (c === "KeyE" || c === "Space") app.keys.act = true;
});

window.addEventListener("keyup", e => {
  const c = e.code;
  if (c === "ArrowLeft" || c === "KeyA") app.keys.left = false;
  if (c === "ArrowRight" || c === "KeyD") app.keys.right = false;
  if (c === "ArrowUp" || c === "KeyW") app.keys.up = false;
  if (c === "ArrowDown" || c === "KeyS") app.keys.down = false;
  if (c === "ShiftLeft" || c === "ShiftRight") app.keys.tiptoe = false;
  if (c === "KeyC") app.keys.crouch = false;
  if (c === "KeyE" || c === "Space") app.keys.act = false;
});

// Touch & Responsive Landscape Scaling
function isTouchCapable() {
  return !!(app.hasTouch || (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) || (navigator.maxTouchPoints > 0 && Math.min(window.innerWidth, window.innerHeight) <= 900));
}
async function tryLockLandscape(withFs = false) {
  try {
    if (withFs && document.documentElement.requestFullscreen && !document.fullscreenElement) await document.documentElement.requestFullscreen();
    if (screen.orientation && screen.orientation.lock) await screen.orientation.lock("landscape");
  } catch (e) {}
  resizeCanvas();
}
function resizeCanvas() {
  const rawW = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  const rawH = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  const mobile = isTouchCapable();
  if (document.body && document.body.classList) document.body.classList.toggle("touch-device", mobile);
  const forceRotate = mobile && rawH > rawW;
  app.cssRotated90 = forceRotate;
  stageEl.classList.toggle("landscape-forced", forceRotate);
  const landW = forceRotate ? rawH : rawW, landH = forceRotate ? rawW : rawH;
  stageEl.style.width = `${Math.floor(landW)}px`; stageEl.style.height = `${Math.floor(landH)}px`;
  const pad = mobile ? 4 : 16;
  const s = Math.min(Math.max(240, landW - pad) / LOGICAL_W, Math.max(160, landH - pad) / LOGICAL_H);
  canvas.style.width = `${Math.floor(LOGICAL_W * s)}px`; canvas.style.height = `${Math.floor(LOGICAL_H * s)}px`;
  stageEl.style.setProperty("--tbtn", `${Math.round(Math.max(40, Math.min(58, landH * 0.14)))}px`);
  if (touchFsBtn && mobile && document.documentElement.requestFullscreen) touchFsBtn.style.display = document.fullscreenElement ? "none" : "flex";
}
window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 60));
document.addEventListener("fullscreenchange", () => setTimeout(resizeCanvas, 40));
if (window.visualViewport) window.visualViewport.addEventListener("resize", resizeCanvas);
resizeCanvas();

window.addEventListener("touchstart", () => { sfx.unlock(); app.hasTouch = true; resizeCanvas(); tryLockLandscape(false); }, { passive: true, once: true });
function bindHoldTouch(id, field) {
  const btn = document.getElementById(id);
  const set = v => { sfx.unlock(); app.touch[field] = v; btn.classList.toggle("pressed", v); };
  btn.addEventListener("touchstart", e => { e.preventDefault(); set(true); });
  btn.addEventListener("touchend", e => { e.preventDefault(); set(false); });
  btn.addEventListener("touchcancel", e => { e.preventDefault(); set(false); });
}
function bindToggleTouch(id, field) {
  const btn = document.getElementById(id);
  btn.addEventListener("touchstart", e => {
    e.preventDefault(); sfx.unlock();
    app.touch[field] = !app.touch[field];
    btn.classList.toggle("on", app.touch[field]);
  });
}
bindHoldTouch("btn-up", "up"); bindHoldTouch("btn-down", "down");
bindHoldTouch("btn-left", "left"); bindHoldTouch("btn-right", "right");
bindHoldTouch("btn-act", "act");
bindToggleTouch("btn-tiptoe", "tiptoe"); bindToggleTouch("btn-crouch", "crouch");
if (touchFsBtn) touchFsBtn.addEventListener("touchstart", e => { e.preventDefault(); tryLockLandscape(true); });

const uiButtons = [];
function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  if (app.cssRotated90) {
    return { x: (e.clientY - rect.top) * (LOGICAL_W / Math.max(1, rect.height)), y: (rect.right - e.clientX) * (LOGICAL_H / Math.max(1, rect.width)) };
  }
  return { x: (e.clientX - rect.left) * (LOGICAL_W / Math.max(1, rect.width)), y: (e.clientY - rect.top) * (LOGICAL_H / Math.max(1, rect.height)) };
}
canvas.addEventListener("pointermove", e => { app.mouse = getCanvasCoords(e); });
canvas.addEventListener("pointerdown", e => {
  sfx.unlock();
  if (e.pointerType === "touch") { app.hasTouch = true; resizeCanvas(); }
  const pt = getCanvasCoords(e); app.mouse = pt;
  for (let i = uiButtons.length - 1; i >= 0; i--) {
    const b = uiButtons[i];
    if (pt.x >= b.x && pt.x <= b.x + b.w && pt.y >= b.y && pt.y <= b.y + b.h) { b.onClick(); return; }
  }
});

/* ============================================================================
 * 9. RENDERING (TOP-DOWN 3 AM HOUSE, TELLS, SQUEAK MEMORY, HUD, MENUS)
 * ============================================================================ */
function addBtn(x, y, w, h, label, onClick, bg = PAL.STONE, fg = PAL.WHITE, border = PAL.BORDER) {
  const hover = app.mouse.x >= x && app.mouse.x <= x + w && app.mouse.y >= y && app.mouse.y <= y + h;
  ctx.fillStyle = hover && bg === PAL.STONE ? PAL.STONE_HOVER : bg;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = hover ? PAL.ACCENT : border; ctx.lineWidth = 1.5; ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = (fg === PAL.BG) ? PAL.ACCENT_TEXT : fg;
  ctx.font = "bold 13px ui-monospace, monospace"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(label, x + w / 2, y + h / 2, w - 12);
  uiButtons.push({ x, y, w, h, onClick });
}

function renderHouseScene(st) {
  const def = st.def;
  ctx.fillStyle = PAL.FLOOR; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

  // Draw floor tiles & plank tells
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      let ch = st.grid[r][c];
      if (def.shiftingPlanks) {
        for (const sp of def.shiftingPlanks) {
          if (sp.cols.includes(c) && (st.tick % sp.period) >= sp.period * 0.5) ch = "=";
        }
      }
      const x = c * TILE, y = r * TILE;
      if (ch === "#") {
        ctx.fillStyle = PAL.STONE; ctx.fillRect(x, y, TILE, TILE);
      } else if (ch === "T") {
        ctx.fillStyle = PAL.PLANK; ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = PAL.GOLD; ctx.fillRect(x + 2, y + 4, TILE - 4, TILE - 8);
        ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 1; ctx.strokeRect(x + 2, y + 4, TILE - 4, TILE - 8);
      } else if (ch === "R") {
        ctx.fillStyle = PAL.ACCENT; ctx.globalAlpha = 0.25; ctx.fillRect(x, y, TILE, TILE); ctx.globalAlpha = 1;
        ctx.strokeStyle = PAL.ACCENT; ctx.lineWidth = 1; ctx.strokeRect(x + 2, y + 2, TILE - 4, TILE - 4);
      } else if (ch === "~" || ch === "=" || ch === "!" || ch === "C") {
        ctx.fillStyle = PAL.PLANK; ctx.fillRect(x, y, TILE, TILE);
        // Subtle nail-head / grain tells
        ctx.fillStyle = PAL.MUTED;
        if (ch === "~") ctx.fillRect(x + 14, y + 14, 2, 2);
        if (ch === "=") { ctx.fillRect(x + 8, y + 14, 3, 3); ctx.fillRect(x + 19, y + 14, 3, 3); }
        if (ch === "!") { ctx.fillStyle = PAL.CORAL; ctx.fillRect(x + 6, y + 14, 18, 2); }
        if (ch === "C") { ctx.fillStyle = PAL.GOLD; ctx.fillRect(x + 8, y + 8, 4, 4); ctx.fillStyle = PAL.CORAL; ctx.fillRect(x + 18, y + 18, 4, 4); }
        // Squeak Memory mark (earned across retries)
        if (st.squeakMemory[`${c},${r}`] || progress.colorBlind) {
          ctx.strokeStyle = ch === "!" ? PAL.CORAL : (ch === "=" ? PAL.GOLD : PAL.MUTED);
          ctx.lineWidth = 1.5; ctx.strokeRect(x + 3, y + 3, TILE - 6, TILE - 6);
        }
      }
    }
  }

  // Doors
  for (const d of st.doors) {
    if (d.open) continue;
    ctx.fillStyle = PAL.GOLD;
    ctx.fillRect(d.col * TILE + 10, d.row * TILE, 10, (d.h || 1) * TILE);
    if (d.progress > 0) {
      ctx.fillStyle = PAL.MINT;
      ctx.fillRect(d.col * TILE + 4, d.row * TILE - 6, Math.round(22 * (d.progress / DOOR_SLOW_TICKS)), 4);
    }
  }

  // Bed (Start / Return goal)
  const bx = def.start.col * TILE, by = def.start.row * TILE;
  ctx.fillStyle = st.player.hasSnack && def.returnToBed ? PAL.GOLD : PAL.STONE;
  ctx.fillRect(bx + 2, by + 2, 26, 26);
  ctx.fillStyle = PAL.WHITE; ctx.font = "bold 10px monospace"; ctx.textAlign = "center";
  ctx.fillText("BED", bx + 15, by + 18);

  // Fridge (Goal)
  const fx = def.fridge.col * TILE, fy = def.fridge.row * TILE;
  ctx.fillStyle = st.player.hasSnack ? PAL.MUTED : PAL.ACCENT;
  ctx.fillRect(fx + 2, fy + 2, 26, 26);
  ctx.fillStyle = PAL.ACCENT_TEXT; ctx.font = "bold 9px monospace";
  ctx.fillText("FRIDGE", fx + 15, fy + 16);
  if (st.player.fridgeTicks > 0 && !st.player.hasSnack) {
    ctx.fillStyle = PAL.MINT;
    ctx.fillRect(fx, fy - 7, Math.round(30 * (st.player.fridgeTicks / FRIDGE_INTERACT_TICKS)), 4);
  }

  // Alarm switch
  if (def.alarmSwitch && !st.alarmSilenced) {
    const sx = def.alarmSwitch.col * TILE + 15, sy = def.alarmSwitch.row * TILE + 15;
    ctx.fillStyle = PAL.CORAL; ctx.beginPath(); ctx.arc(sx, sy, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = PAL.WHITE; ctx.font = "bold 9px monospace"; ctx.fillText("OFF", sx, sy + 3);
  }

  // Sign (Narrator lie level 47)
  if (def.signText) {
    ctx.fillStyle = PAL.SURFACE; ctx.fillRect(360, 62, 240, 26);
    ctx.strokeStyle = PAL.GOLD; ctx.strokeRect(360, 62, 240, 26);
    ctx.fillStyle = PAL.GOLD; ctx.font = "bold 12px monospace"; ctx.fillText(def.signText, 480, 79);
  }

  // Clutter
  for (const cl of st.clutter) {
    if (cl.picked) continue;
    ctx.fillStyle = PAL.GOLD; ctx.fillRect(cl.x - 6, cl.y - 6, 12, 12);
    ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 1; ctx.strokeRect(cl.x - 6, cl.y - 6, 12, 12);
  }

  // Hazards
  for (const h of st.hazards) {
    if (h.kind === "maskZone") {
      ctx.save(); ctx.globalAlpha = 0.16; ctx.fillStyle = PAL.MINT; ctx.fillRect(h.x, h.y, h.w, h.h); ctx.restore();
      ctx.strokeStyle = PAL.MINT; ctx.strokeRect(h.x, h.y, h.w, h.h);
      ctx.fillStyle = PAL.MINT; ctx.font = "bold 11px monospace"; ctx.fillText(h.label || "MASK", h.x + h.w / 2, h.y + 14);
    } else if (h.kind === "light") {
      ctx.save(); ctx.globalAlpha = 0.28; ctx.fillStyle = PAL.GOLD;
      ctx.beginPath(); ctx.arc(h.curX, h.curY, h.r * 0.48, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      ctx.strokeStyle = PAL.GOLD; ctx.beginPath(); ctx.arc(h.curX, h.curY, h.r * 0.48, 0, Math.PI * 2); ctx.stroke();
    } else if (h.kind === "vacuum") {
      ctx.save(); ctx.globalAlpha = 0.15; ctx.fillStyle = PAL.MINT;
      ctx.beginPath(); ctx.arc(h.curX, h.curY, h.maskR || 75, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      ctx.fillStyle = PAL.STONE; ctx.beginPath(); ctx.arc(h.curX, h.curY, 13, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = PAL.MINT; ctx.lineWidth = 2; ctx.stroke();
    } else if (h.kind === "dog") {
      ctx.fillStyle = PAL.GOLD; ctx.beginPath(); ctx.arc(h.curX, h.curY, 12, 0, Math.PI * 2); ctx.fill();
      if (h.earAlert) { ctx.fillStyle = PAL.CORAL; ctx.fillText("EAR!", h.curX, h.curY - 16); }
      if (h.noseTwitch) { ctx.fillStyle = PAL.GOLD; ctx.fillText("TWITCH...", h.curX, h.curY - 16); }
      if (h.sneezing) { ctx.fillStyle = PAL.MINT; ctx.fillText("ACHOO! (MASK)", h.curX, h.curY - 18); }
    } else if (h.kind === "cat") {
      ctx.fillStyle = PAL.WHITE; ctx.beginPath(); ctx.arc(h.curX, h.curY, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = PAL.CORAL; ctx.font = "bold 9px monospace"; ctx.fillText("CAT", h.curX, h.curY + 3);
    } else if (h.kind === "parrot") {
      ctx.fillStyle = PAL.MINT; ctx.beginPath(); ctx.arc(h.curX, h.curY, 10, 0, Math.PI * 2); ctx.fill();
      if (h.echoTicks > 0) { ctx.fillStyle = PAL.GOLD; ctx.fillText(`ECHO ${Math.ceil(h.echoTicks/60)}s`, h.curX, h.curY - 14); }
    } else if (h.kind === "speaker") {
      ctx.fillStyle = PAL.ACCENT; ctx.fillRect(h.curX - 10, h.curY - 10, 20, 20);
    } else if (h.kind === "balloon" && !h.popped) {
      ctx.fillStyle = PAL.CORAL; ctx.beginPath(); ctx.arc(h.curX, h.curY, 11, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Sleepers
  for (const sl of st.sleepers) {
    const sx = sl.col * TILE + 15, sy = sl.row * TILE + 15;
    ctx.fillStyle = sl.turning ? PAL.CORAL : PAL.STONE;
    ctx.fillRect(sx - 18, sy - 12, 36, 24);
    ctx.strokeStyle = sl.turnWarnActive ? PAL.GOLD : PAL.WHITE;
    ctx.lineWidth = 2; ctx.strokeRect(sx - 18, sy - 12, 36, 24);
    ctx.fillStyle = PAL.WHITE; ctx.font = "bold 10px monospace"; ctx.textAlign = "center";
    ctx.fillText(sl.name.slice(0, 8), sx, sy + 3);
    if (sl.snoring) {
      ctx.fillStyle = PAL.MINT;
      ctx.fillText(sl.sleepTalk ? "MUMBLE... (MASK)" : "ZZZ... (MASK)", sx, sy - 18);
    } else if (sl.turnWarnActive) {
      ctx.fillStyle = PAL.GOLD; ctx.fillText("BLANKET SHIFT!", sx, sy - 18);
    }
  }

  // Optional Ghost Route after 8 fails
  if (app.showGhost && LEVEL_SOLUTIONS[def.id]) {
    const frames = expandSolution(LEVEL_SOLUTIONS[def.id]);
    const sim = createLevelState(def);
    ctx.save(); ctx.strokeStyle = PAL.ACCENT; ctx.globalAlpha = 0.4; ctx.lineWidth = 2; ctx.beginPath();
    ctx.moveTo(sim.player.x, sim.player.y);
    for (let i = 0; i < frames.length; i += 4) {
      for (let k = 0; k < 4 && i + k < frames.length; k++) stepSim(sim, frames[i + k]);
      ctx.lineTo(sim.player.x, sim.player.y);
    }
    ctx.stroke(); ctx.restore();
  }

  // Player (pyjama-wearing sneaker)
  const p = st.player;
  const r = p.mode === "crouch" ? 7 : 10;
  ctx.fillStyle = p.mode === "crouch" ? PAL.MINT : (p.mode === "tiptoe" ? PAL.ACCENT : PAL.WHITE);
  ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = PAL.BG; ctx.lineWidth = 2; ctx.stroke();
  if (p.hasSnack) {
    ctx.fillStyle = PAL.GOLD; ctx.fillRect(p.x - 4, p.y - 16, 8, 8);
  }

  // Signature lights-on discovery flash (unless Streamer Safe)
  if (st.failed && !progress.streamerSafe) {
    ctx.save(); ctx.globalAlpha = 0.22; ctx.fillStyle = PAL.GOLD; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H); ctx.restore();
  }
}

function renderHUD(st) {
  ctx.fillStyle = PAL.PANEL; ctx.fillRect(0, 0, LOGICAL_W, 44);
  ctx.fillStyle = PAL.ACCENT; ctx.fillRect(0, 42, LOGICAL_W, 2);
  ctx.textAlign = "left"; ctx.font = "bold 14px monospace";
  ctx.fillStyle = PAL.GOLD; ctx.fillText(`N${String(st.def.id).padStart(2, "0")}: ${st.def.name}`, 12, 24);

  // Noise Meter
  ctx.fillStyle = PAL.WHITE; ctx.fillText("NOISE:", 245, 24);
  ctx.fillStyle = PAL.STONE; ctx.fillRect(305, 13, 140, 18);
  const pct = Math.min(1, st.noise / 60);
  ctx.fillStyle = pct > 0.7 ? PAL.CORAL : (pct > 0.4 ? PAL.GOLD : PAL.MINT);
  ctx.fillRect(305, 13, Math.round(140 * pct), 18);

  const sec = (st.tick / 60).toFixed(1);
  ctx.fillStyle = PAL.WHITE; ctx.fillText(`T:${sec}s`, 462, 24);
  ctx.fillStyle = PAL.ACCENT; ctx.fillText(st.player.mode.toUpperCase(), 555, 24);

  addBtn(710, 9, 76, 26, "RETRY [R]", () => startLevel(app.currentIdx), PAL.STONE, PAL.WHITE);
  addBtn(792, 9, 76, 26, "PAUSE", () => { app.screen = "pause"; }, PAL.STONE, PAL.GOLD);
  addBtn(874, 9, 74, 26, "MENU", () => { app.screen = "title"; }, PAL.STONE, PAL.CORAL);

  if ((progress.fails[st.def.id] || 0) >= 8) {
    addBtn(14, 52, 160, 26, app.showGhost ? "GHOST: ON" : "GHOST ROUTE", () => { app.showGhost = !app.showGhost; }, app.showGhost ? PAL.GOLD : PAL.STONE, app.showGhost ? PAL.BG : PAL.GOLD);
  }
  if (progress.bigObsOverlay) {
    ctx.fillStyle = PAL.PANEL; ctx.fillRect(LOGICAL_W - 178, 52, 164, 66);
    ctx.strokeStyle = PAL.CORAL; ctx.strokeRect(LOGICAL_W - 178, 52, 164, 66);
    ctx.fillStyle = PAL.WHITE; ctx.textAlign = "center"; ctx.font = "bold 12px monospace"; ctx.fillText("BUSTED", LOGICAL_W - 96, 70);
    ctx.fillStyle = PAL.CORAL; ctx.font = "bold 26px monospace"; ctx.fillText(String(progress.totalFails), LOGICAL_W - 96, 100);
  }
  if (progress.chatMap) {
    ctx.fillStyle = PAL.PANEL; ctx.fillRect(LOGICAL_W - 146, 128, 134, 84);
    ctx.strokeStyle = PAL.ACCENT; ctx.strokeRect(LOGICAL_W - 146, 128, 134, 84);
    for (let r = 0; r < ROWS; r++) {
      for (let c = 0; c < COLS; c++) {
        const mem = st.squeakMemory[`${c},${r}`];
        if (mem) {
          ctx.fillStyle = mem === "!" ? PAL.CORAL : PAL.GOLD;
          ctx.fillRect(LOGICAL_W - 142 + c * 4, 134 + r * 4, 3, 3);
        }
      }
    }
  }
  if (st.speakerTicks > 0) {
    ctx.fillStyle = PAL.PANEL; ctx.fillRect(280, 50, 400, 28);
    ctx.strokeStyle = PAL.ACCENT; ctx.strokeRect(280, 50, 400, 28);
    ctx.fillStyle = PAL.ACCENT; ctx.textAlign = "center"; ctx.font = "bold 12px monospace";
    ctx.fillText(st.speakerMsg, 480, 68);
  }

  // Narrator footer (centered for laptop + mobile)
  ctx.fillStyle = PAL.PANEL; ctx.fillRect(0, LOGICAL_H - 32, LOGICAL_W, 32);
  ctx.fillStyle = PAL.WHITE; ctx.font = "bold 13px monospace"; ctx.textAlign = "center";
  ctx.fillText(app.narratorText, LOGICAL_W / 2, LOGICAL_H - 12, isTouchCapable() ? 500 : 920);
}

function renderSummary(st) {
  ctx.fillStyle = PAL.PANEL; ctx.fillRect(140, 60, 680, 420);
  ctx.strokeStyle = st.won ? PAL.MINT : PAL.CORAL; ctx.lineWidth = 3; ctx.strokeRect(140, 60, 680, 420);
  ctx.textAlign = "center";
  if (st.won) {
    const sb = st.scoreBreakdown;
    ctx.fillStyle = PAL.MINT; ctx.font = "bold 28px monospace";
    ctx.fillText(`SNACK SECURED! ${"*".repeat(sb.stars)}`, 480, 110);
    ctx.fillStyle = PAL.GOLD; ctx.font = "bold 18px monospace";
    ctx.fillText(`SNACK OF THE NIGHT: ${st.def.snack.toUpperCase()}`, 480, 160);
    ctx.fillStyle = PAL.WHITE; ctx.font = "bold 15px monospace";
    ctx.fillText(`TIME: ${sb.elapsed}s  |  PEAK NOISE: ${sb.peakNoise}  |  CLOSEST: ${st.closestSleeperName}`, 480, 210);
  } else {
    ctx.fillStyle = PAL.CORAL; ctx.font = "bold 30px monospace";
    ctx.fillText('"...AH."  BUSTED!', 480, 110);
    ctx.fillStyle = PAL.GOLD; ctx.font = "bold 16px monospace";
    ctx.fillText(`INCIDENT REPORT: ${st.failReason}`, 480, 160);
    ctx.fillStyle = PAL.WHITE; ctx.font = "14px monospace";
    ctx.fillText(`PEAK NOISE: ${Math.round(st.peakNoise)}  |  WOKE: ${st.wokeSleeper ? st.wokeSleeper.name : "House"}`, 480, 205);
  }
  addBtn(180, 390, 175, 44, "RETRY [R]", () => startLevel(app.currentIdx), PAL.STONE, PAL.WHITE);
  if (st.history.length > 10) {
    addBtn(385, 390, 190, 44, "ZOOM REPLAY", () => { app.replayFrames = st.history.slice(-45); app.replayIdx = 0; }, PAL.STONE, PAL.CORAL, PAL.CORAL);
  }
  addBtn(605, 390, 175, 44, st.won && app.currentIdx + 1 < LEVELS.length ? "NEXT NIGHT" : "MAIN MENU", () => {
    if (st.won && app.currentIdx + 1 < LEVELS.length) startLevel(app.currentIdx + 1);
    else app.screen = "title";
  }, PAL.ACCENT, PAL.BG);
}

function renderTitleScreen() {
  ctx.fillStyle = PAL.BG; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  ctx.textAlign = "center";
  ctx.fillStyle = PAL.ACCENT; ctx.font = "bold 44px monospace"; ctx.fillText("THE SNEAKY SNACK", 480, 88);
  ctx.fillStyle = PAL.WHITE; ctx.font = "bold 15px monospace";
  ctx.fillText(`3 AM STEALTH-PUZZLE  •  STARS: ${totalStars()}/${LEVELS.length * 3}  •  BUSTED: ${progress.totalFails}`, 480, 134);

  const next = LEVELS.findIndex(l => !progress.stars[l.id]);
  const daily = getDailySnackId();
  addBtn(310, 176, 340, 48, "PLAY / CONTINUE", () => startLevel(next >= 0 ? next : 0), PAL.ACCENT, PAL.BG);
  addBtn(310, 236, 340, 40, `DAILY SNACK (#${daily})`, () => startLevel(daily - 1), PAL.STONE, PAL.GOLD);
  addBtn(310, 286, 340, 40, "50 NIGHTS (6 HOUSES)", () => { app.screen = "select"; }, PAL.STONE, PAL.WHITE);
  addBtn(310, 336, 340, 40, "SETTINGS & CLIPS", () => { app.screen = "pause"; }, PAL.STONE, PAL.WHITE);
  addBtn(310, 386, 340, 40, "MORE GAMES", () => { app.screen = "more"; }, PAL.STONE, PAL.MINT);

  ctx.fillStyle = PAL.SURFACE; ctx.fillRect(0, LOGICAL_H - 34, LOGICAL_W, 34);
  ctx.fillStyle = PAL.WHITE; ctx.font = "bold 13px monospace";
  ctx.fillText(app.narratorText, LOGICAL_W / 2, LOGICAL_H - 13, 900);
}

function renderSelect() {
  ctx.fillStyle = PAL.BG; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  ctx.fillStyle = PAL.ACCENT; ctx.textAlign = "center"; ctx.font = "bold 20px monospace";
  ctx.fillText(`SELECT HOUSE & NIGHT  •  STARS: ${totalStars()}/${LEVELS.length * 3}`, 480, 28);
  for (let i = 0; i < HOUSES.length; i++) {
    const h = HOUSES[i];
    const unlocked = isLevelUnlocked(h.levels[0]);
    const active = app.selectHouse === i;
    addBtn(24 + i * 154, 52, 146, 34, `H${h.id}${unlocked ? "" : " LOCK"} ${h.name.slice(0, 7)}`, () => {
      if (unlocked) app.selectHouse = i;
      else showToast(`COMPLETE NIGHT #${h.levels[0] - 1} FIRST!`);
    }, active ? PAL.ACCENT : PAL.STONE, active ? PAL.BG : (unlocked ? PAL.WHITE : PAL.CORAL));
  }
  const hDef = HOUSES[app.selectHouse];
  ctx.fillStyle = PAL.GOLD; ctx.font = "bold 15px monospace";
  ctx.fillText(`HOUSE ${hDef.id}: ${hDef.name}`, 480, 108);
  let idx = 0;
  for (let id = hDef.levels[0]; id <= hDef.levels[1]; id++, idx++) {
    const def = LEVELS.find(l => l.id === id);
    if (!def) continue;
    const col = idx % 5, row = Math.floor(idx / 5);
    const x = 40 + col * 178, y = 132 + row * 134;
    const st = progress.stars[id] || 0;
    const unlocked = isLevelUnlocked(id);
    addBtn(x, y, 166, 114, unlocked ? `#${id} ${def.name.slice(0, 11)}\n${st ? "*".repeat(st) : "-"}` : `#${id} LOCKED`, () => {
      if (unlocked) startLevel(LEVELS.indexOf(def));
      else showToast(`COMPLETE NIGHT #${id - 1} FIRST!`);
    }, PAL.STONE, st ? PAL.GOLD : (unlocked ? PAL.WHITE : PAL.CORAL));
  }
  addBtn(390, 476, 180, 40, "MAIN MENU", () => { app.screen = "title"; }, PAL.ACCENT, PAL.BG);
}

function renderPause() {
  ctx.fillStyle = PAL.PANEL; ctx.fillRect(180, 54, 600, 432);
  ctx.strokeStyle = PAL.ACCENT; ctx.lineWidth = 2; ctx.strokeRect(180, 54, 600, 432);
  ctx.fillStyle = PAL.ACCENT; ctx.textAlign = "center"; ctx.font = "bold 24px monospace";
  ctx.fillText("PAUSED / SETTINGS", 480, 96);
  addBtn(240, 130, 480, 38, `STREAMER SAFE (NO FLASH): ${progress.streamerSafe ? "ON" : "OFF"}`, () => { progress.streamerSafe = !progress.streamerSafe; saveProgress(progress); });
  addBtn(240, 180, 480, 38, `COLOR-BLIND PLANKS [K]: ${progress.colorBlind ? "ON" : "OFF"}`, () => { progress.colorBlind = !progress.colorBlind; saveProgress(progress); });
  addBtn(240, 230, 480, 38, `CHAT FLOOR MAP [H]: ${progress.chatMap ? "ON" : "OFF"}`, () => { progress.chatMap = !progress.chatMap; saveProgress(progress); });
  addBtn(240, 280, 232, 38, `SOUND: ${progress.muted ? "MUTED" : "ON"}`, () => { progress.muted = !progress.muted; sfx.muted = progress.muted; saveProgress(progress); });
  addBtn(488, 280, 232, 38, `OBS OVERLAY [O]: ${progress.bigObsOverlay ? "ON" : "OFF"}`, () => { progress.bigObsOverlay = !progress.bigObsOverlay; saveProgress(progress); });
  addBtn(240, 336, 232, 38, "CLIP LIST [M]", () => { app.screen = "clips"; }, PAL.STONE, PAL.CORAL);
  addBtn(488, 336, 232, 38, "SHARE CODE [S]", () => { if (app.state) shareCurrentLevelCode(); else showToast("START A NIGHT TO SHARE"); });
  addBtn(240, 396, 232, 42, app.state ? "RESUME [ESC]" : "BACK [ESC]", () => { app.screen = app.state ? "play" : "title"; }, PAL.ACCENT, PAL.BG);
  addBtn(488, 396, 232, 42, "MAIN MENU", () => { app.screen = "title"; }, PAL.STONE, PAL.GOLD);
}

function renderClips() {
  ctx.fillStyle = PAL.BG; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  ctx.fillStyle = PAL.CORAL; ctx.textAlign = "center"; ctx.font = "bold 24px monospace";
  ctx.fillText("BUSTED CLIP MARKERS (EVERY 5TH FAIL)", 480, 46);
  if (progress.rageClips.length === 0) {
    ctx.fillStyle = PAL.MUTED; ctx.font = "16px monospace"; ctx.fillText("NO CLIPS YET.", 480, 240);
  }
  for (let i = 0; i < Math.min(10, progress.rageClips.length); i++) {
    const cl = progress.rageClips[i];
    ctx.fillStyle = i === 0 ? PAL.GOLD : PAL.WHITE; ctx.font = "14px monospace";
    ctx.fillText(`${cl.timeStr} | N${cl.id} (${cl.name}) | ${cl.totalFails} FAILS`, 480, 100 + i * 32);
  }
  addBtn(390, 468, 180, 40, "BACK [ESC]", () => { app.screen = app.state ? "play" : "title"; }, PAL.ACCENT, PAL.BG);
}

function renderMoreGames() {
  ctx.fillStyle = PAL.BG; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  ctx.fillStyle = PAL.MINT; ctx.textAlign = "center"; ctx.font = "bold 26px monospace";
  ctx.fillText("MORE GAMES IN THE COLLECTION", 480, 64);
  for (let i = 0; i < MORE_GAMES.length; i++) {
    const g = MORE_GAMES[i];
    addBtn(260, 128 + i * 64, 440, 48, g.name.toUpperCase(), () => { window.location.href = g.url; }, PAL.STONE, PAL.WHITE);
  }
  addBtn(380, 430, 200, 44, "BACK TO MENU", () => { app.screen = "title"; }, PAL.ACCENT, PAL.BG);
}

function renderSolver() {
  if (!app.solverOverlay) return;
  const { results, diffCheck, passed, total } = app.solverOverlay;
  ctx.fillStyle = PAL.PANEL; ctx.fillRect(40, 28, 880, 484);
  ctx.strokeStyle = PAL.ACCENT; ctx.strokeRect(40, 28, 880, 484);
  ctx.fillStyle = PAL.ACCENT; ctx.textAlign = "center"; ctx.font = "bold 18px monospace";
  ctx.fillText(`F9 SOLVER: ${passed}/${total} PASS | DIFFICULTY: ${diffCheck.ok ? "NON-DECREASING OK" : "FAIL"}`, 480, 56);
  for (let i = 0; i < results.length; i++) {
    const r = results[i], col = i % 10, row = Math.floor(i / 10);
    const x = 68 + col * 84, y = 84 + row * 68;
    ctx.fillStyle = r.pass ? PAL.STONE : PAL.CORAL; ctx.fillRect(x, y, 76, 54);
    ctx.fillStyle = PAL.WHITE; ctx.font = "bold 11px monospace"; ctx.fillText(`N${String(r.id).padStart(2, "0")}`, x + 38, y + 20);
    ctx.fillStyle = r.pass ? PAL.MINT : PAL.WHITE; ctx.fillText(r.pass ? "PASS" : "FAIL", x + 38, y + 40);
  }
  addBtn(400, 468, 160, 34, "CLOSE [F9]", () => { app.solverOverlay = null; }, PAL.ACCENT, PAL.BG);
}

function render() {
  uiButtons.length = 0;
  const showTouch = (app.screen === "play" || app.screen === "summary") && isTouchCapable();
  if (touchEl.classList.contains("active") !== showTouch) touchEl.classList.toggle("active", showTouch);
  if (app.screen === "title") renderTitleScreen();
  else if (app.screen === "select") renderSelect();
  else if (app.screen === "pause") renderPause();
  else if (app.screen === "clips") renderClips();
  else if (app.screen === "more") renderMoreGames();
  else if (app.state) {
    ctx.fillStyle = PAL.BG; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    if (app.replayFrames) {
      const f = app.replayFrames[Math.floor(app.replayIdx)];
      ctx.save(); ctx.translate(480, 270); ctx.scale(1.5, 1.5); ctx.translate(-f.x, -f.y);
      renderHouseScene(app.state); ctx.restore();
    } else {
      renderHouseScene(app.state);
    }
    renderHUD(app.state);
    if (app.screen === "summary" && !app.replayFrames) renderSummary(app.state);
  }
  renderSolver();
}

let lastT = performance.now(), acc = 0;
function tick() {
  app.uiTick++;
  if (app.replayFrames) {
    app.replayIdx += 0.35;
    if (app.replayIdx >= app.replayFrames.length) app.replayFrames = null;
    return;
  }
  if (app.screen !== "play" || !app.state || app.solverOverlay) return;
  let inp = {
    left: app.keys.left || app.touch.left, right: app.keys.right || app.touch.right,
    up: app.keys.up || app.touch.up, down: app.keys.down || app.touch.down,
    tiptoe: app.keys.tiptoe || app.touch.tiptoe, crouch: app.keys.crouch || app.touch.crouch,
    act: app.keys.act || app.touch.act
  };
  if (app.botWatch) {
    inp = app.botWatch.frames[app.botWatch.index++] || {};
    if (app.botWatch.index > app.botWatch.frames.length + 10) app.botWatch = null;
  }
  const st = app.state;
  stepSim(st, inp);
  for (const s of st.soundEvents) sfx.play(s.name, s.param);
  if (st.noise > 30 && st.tick % Math.max(12, Math.round(40 - st.noise * 0.4)) === 0) sfx.play("heart", st.noise / 80);

  if (st.won || st.failed) {
    progress.squeakMaps[st.def.id] = { ...st.squeakMemory };
    if (st.won) {
      const prev = progress.stars[st.def.id] || 0;
      if (st.scoreBreakdown.stars > prev) progress.stars[st.def.id] = st.scoreBreakdown.stars;
      const bt = progress.bestTimes[st.def.id];
      if (bt === undefined || Number(st.scoreBreakdown.elapsed) < bt) progress.bestTimes[st.def.id] = Number(st.scoreBreakdown.elapsed);
      app.narratorText = pickNarratorLine();
    } else {
      progress.totalFails++;
      progress.fails[st.def.id] = (progress.fails[st.def.id] || 0) + 1;
      if (progress.totalFails % 5 === 0) {
        const d = new Date();
        progress.rageClips.unshift({
          timeStr: [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, "0")).join(":"),
          id: st.def.id, name: st.def.name, totalFails: progress.totalFails
        });
        if (progress.rageClips.length > 30) progress.rageClips.length = 30;
      }
      app.narratorText = pickNarratorLine();
    }
    saveProgress(progress);
    app.screen = "summary";
  }
}

function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now; acc += dt;
  while (acc >= FIXED_DT) { tick(); acc -= FIXED_DT; }
  render();
  requestAnimationFrame(frame);
}

const hashId = parseHashLevel();
if (hashId !== null && isLevelUnlocked(hashId)) startLevel(hashId - 1);
requestAnimationFrame(frame);
</script>
