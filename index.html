  ctx.fillStyle = PAL.SURFACE; ctx.fillRect(0, LOGICAL_H - 36, LOGICAL_W, 36);
  ctx.fillStyle = PAL.BORDER; ctx.fillRect(0, LOGICAL_H - 36, LOGICAL_W, 1);
  drawPixelText(ctx, app.narratorText, 480, LOGICAL_H - 26, 2, PAL.WHITE, "center", null, LOGICAL_W - 40);
}

function renderLevelSelect() {
  ctx.fillStyle = PAL.BG; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  drawAtmosphereAndEye(app.mouse.x, app.mouse.y, 280);
  drawPixelText(ctx, "SELECT WORLD & ROUND", 480, 14, 3, PAL.GOLD, "center");

  // World tabs (2 rows of 6)
  for (let i = 0; i < WORLDS.length; i++) {
    const w = WORLDS[i];
    const col = i % 6, row = Math.floor(i / 6);
    const unlocked = isWorldUnlocked(w.id);
    const active = app.selectedWorld === w.id;
    const x = 30 + col * 152, y = 48 + row * 34;
    addButton(x, y, 144, 28, `W${w.id}${unlocked ? "" : " 🔒"} ${w.name}`, () => {
      if (unlocked) app.selectedWorld = w.id;
      else showToast(`COMPLETE ROUND #${WORLDS[i-1].rounds[1]} FIRST`);
    }, active ? PAL.GOLD : PAL.SURFACE, active ? PAL.BG : (unlocked ? PAL.WHITE : PAL.CORAL), active ? PAL.GOLD : PAL.BORDER);
  }

  const wDef = WORLDS.find(w => w.id === app.selectedWorld);
  const dailyId = getDailyRoundId();
  drawPixelText(ctx, `WORLD ${wDef.id}: ${wDef.name}`, 480, 122, 2, PAL.WHITE, "center");

  const startId = wDef.rounds[0], endId = Math.min(wDef.rounds[1], LEVELS.length);
  let idx = 0;
  for (let id = startId; id <= endId; id++, idx++) {
    const def = LEVELS.find(l => l.id === id);
    if (!def) continue;
    const col = idx % 5, row = Math.floor(idx / 5);
    const x = 40 + col * 178, y = 152 + row * 126;
    const d = progress.levelDeaths[id] || 0;
    const best = progress.bestTimes[id];
    const isDaily = id === dailyId;
    const unlocked = isRoundUnlocked(id);
    const badge = !unlocked ? "LOCKED" : (progress.assistedClears[id] ? "[A]" : (progress.cleared[id] ? "✓" : ""));
    const hovered = unlocked && app.mouse.x >= x && app.mouse.x <= x + 166 && app.mouse.y >= y && app.mouse.y <= y + 112;
    ctx.fillStyle = hovered ? PAL.STONE_HOVER : PAL.SURFACE;
    ctx.fillRect(x, y, 166, 112);
    ctx.strokeStyle = hovered ? PAL.GOLD : ((unlocked && (isDaily || progress.cleared[id])) ? PAL.GOLD : PAL.BORDER);
    ctx.lineWidth = hovered ? 2 : 1.5; ctx.strokeRect(x, y, 166, 112);
    drawPixelText(ctx, `#${id} ${unlocked && isDaily ? "DAILY" : def.type}`, x + 10, y + 10, 1, unlocked ? PAL.GOLD : PAL.MUTED, "left", null, 100);
    drawPixelText(ctx, badge, x + 156, y + 10, 1, unlocked ? PAL.GOLD : PAL.CORAL, "right");
    drawPixelText(ctx, unlocked ? def.name : "LOCKED", x + 10, y + 34, 2, hovered ? PAL.GOLD : (unlocked ? PAL.WHITE : PAL.MUTED), "left", null, 146);
    drawPixelText(ctx, `Deaths: ${d}`, x + 10, y + 64, 1, unlocked ? PAL.CORAL : PAL.MUTED, "left");
    drawPixelText(ctx, best !== undefined ? `${best.toFixed(2)}s` : "—", x + 10, y + 86, 1, PAL.MUTED, "left");
    const lvIndex = LEVELS.indexOf(def);
    uiButtons.push({ x, y, w: 166, h: 112, onClick: () => {
      if (unlocked) startLevel(lvIndex, true);
      else showToast(`COMPLETE ROUND #${id - 1} FIRST`);
    } });
  }

  addButton(210, 480, 240, 38, "Main Menu", () => { app.screen = "title"; }, PAL.GOLD, PAL.BG, PAL.GOLD);
  addButton(510, 480, 240, 38, app.state ? "Resume [Esc]" : "Back [Esc]", () => { app.screen = app.state ? "play" : "title"; }, PAL.SURFACE, PAL.WHITE, PAL.BORDER);
}

function renderPauseMenu() {
  if (!app.state) {
    ctx.fillStyle = PAL.BG; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    drawAtmosphereAndEye(app.mouse.x, app.mouse.y, 260);
  }
  ctx.fillStyle = PAL.PANEL; ctx.fillRect(170, 42, 620, 456);
  ctx.strokeStyle = PAL.BORDER; ctx.lineWidth = 2; ctx.strokeRect(170, 42, 620, 456);
  drawPixelText(ctx, app.state ? "Paused" : "Settings & Controls", 480, 62, 3, PAL.GOLD, "center");

  if (app.state) {
    addButton(220, 108, 252, 38, "Resume [Esc]", () => { app.screen = "play"; }, PAL.GOLD, PAL.BG, PAL.GOLD);
    addButton(488, 108, 252, 38, "Restart [R]", () => { app.screen = "play"; startLevel(app.currentLevelIndex, false); }, PAL.STONE, PAL.CORAL, PAL.BORDER);
  } else {
    addButton(220, 108, 520, 38, "Back to Main Menu [Esc]", () => { app.screen = "title"; }, PAL.GOLD, PAL.BG, PAL.GOLD);
  }

  addButton(220, 158, 520, 34, `Streamer Safe (No Flash): ${progress.streamerSafe ? "ON" : "OFF"}`, () => { progress.streamerSafe = !progress.streamerSafe; saveProgress(progress); }, PAL.SURFACE, PAL.WHITE, PAL.BORDER);
  addButton(220, 200, 520, 34, `Color-Blind Shapes: ${progress.colorBlind ? "ON" : "OFF"}`, () => { progress.colorBlind = !progress.colorBlind; saveProgress(progress); }, PAL.SURFACE, PAL.WHITE, PAL.BORDER);
  addButton(220, 242, 252, 34, `Audio: ${progress.muted ? "Muted" : "On"}`, () => { progress.muted = !progress.muted; sfx.muted = progress.muted; saveProgress(progress); }, PAL.SURFACE, PAL.WHITE, PAL.BORDER);
  addButton(488, 242, 252, 34, `OBS Counter [O]: ${progress.bigDeathOverlay ? "ON" : "OFF"}`, () => { progress.bigDeathOverlay = !progress.bigDeathOverlay; saveProgress(progress); }, PAL.SURFACE, PAL.WHITE, PAL.BORDER);

  addButton(220, 288, 252, 32, `Left: ${progress.keys.left}`, () => { app.rebindingAction = "left"; showToast("PRESS NEW LEFT KEY"); }, PAL.SURFACE, PAL.GOLD, PAL.BORDER);
  addButton(488, 288, 252, 32, `Right: ${progress.keys.right}`, () => { app.rebindingAction = "right"; showToast("PRESS NEW RIGHT KEY"); }, PAL.SURFACE, PAL.GOLD, PAL.BORDER);
  addButton(220, 328, 252, 32, `Jump: ${progress.keys.jump}`, () => { app.rebindingAction = "jump"; showToast("PRESS NEW JUMP KEY"); }, PAL.SURFACE, PAL.GOLD, PAL.BORDER);
  addButton(488, 328, 252, 32, `Retry: ${progress.keys.restart}`, () => { app.rebindingAction = "restart"; showToast("PRESS NEW RETRY KEY"); }, PAL.SURFACE, PAL.GOLD, PAL.BORDER);

  addButton(220, 376, 166, 36, "Rage Clips [C]", () => { app.showClipPanel = !app.showClipPanel; }, PAL.SURFACE, PAL.CORAL, PAL.BORDER);
  addButton(397, 376, 166, 36, "Level Select [L]", () => { app.screen = "select"; }, PAL.SURFACE, PAL.WHITE, PAL.BORDER);
  addButton(574, 376, 166, 36, "Share Code [S]", () => { if (app.state) shareCurrentLevelCode(); else showToast("START A ROUND TO SHARE"); }, PAL.SURFACE, PAL.WHITE, PAL.BORDER);
  addButton(320, 428, 320, 42, "Main Menu", () => { app.screen = "title"; }, PAL.SURFACE, PAL.GOLD, PAL.BORDER);
}

function renderHallOfShame() {
  ctx.fillStyle = PAL.BG; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  drawAtmosphereAndEye(app.mouse.x, app.mouse.y, 260);
  drawPixelText(ctx, "HALL OF SHAME", 480, 28, 4, PAL.CORAL, "center");
  const rows = Object.entries(progress.levelDeaths)
    .map(([id, d]) => ({ id: Number(id), d, def: LEVELS.find(l => l.id === Number(id)) }))
    .filter(x => x.d > 0 && x.def)
    .sort((a, b) => b.d - a.d)
    .slice(0, 8);
  if (rows.length === 0) drawPixelText(ctx, "Zero deaths recorded yet.", 480, 240, 2, PAL.MUTED, "center");
  rows.forEach((r, i) => {
    const ry = 104 + i * 40;
    ctx.fillStyle = PAL.SURFACE; ctx.fillRect(160, ry - 8, 640, 34);
    ctx.strokeStyle = PAL.BORDER; ctx.lineWidth = 1; ctx.strokeRect(160, ry - 8, 640, 34);
    drawPixelText(ctx, `#${String(r.id).padStart(3,"0")} ${r.def.name}`, 180, ry, 2, PAL.WHITE, "left", null, 440);
    drawPixelText(ctx, `${r.d} deaths`, 780, ry, 2, PAL.CORAL, "right");
  });
  addButton(300, 466, 170, 40, "Main Menu", () => { app.screen = "title"; }, PAL.GOLD, PAL.BG, PAL.GOLD);
  addButton(490, 466, 170, 40, "Back [Esc]", () => { app.screen = app.state ? "play" : "title"; }, PAL.SURFACE, PAL.WHITE, PAL.BORDER);
}

function renderClipPanel() {
  if (!app.showClipPanel) return;
  ctx.fillStyle = PAL.PANEL; ctx.fillRect(140, 68, 680, 400);
  ctx.strokeStyle = PAL.CORAL; ctx.lineWidth = 2; ctx.strokeRect(140, 68, 680, 400);
  drawPixelText(ctx, "RAGE CLIP MARKERS (EVERY 10TH DEATH)", 480, 86, 2, PAL.CORAL, "center", null, 640);
  if (progress.rageClips.length === 0) drawPixelText(ctx, "No rage markers yet.", 480, 240, 2, PAL.MUTED, "center");
  for (let i = 0; i < Math.min(10, progress.rageClips.length); i++) {
    const c = progress.rageClips[i];
    drawPixelText(ctx, `${c.timeStr} | R${c.levelId} (${c.levelName}) | ${c.consecutiveDeaths}x`, 168, 128 + i * 28, 2, i === 0 ? PAL.GOLD : PAL.WHITE, "left", null, 624);
  }
  addButton(410, 422, 140, 34, "Close [C]", () => { app.showClipPanel = false; }, PAL.SURFACE, PAL.WHITE, PAL.BORDER);
}

function renderSolverOverlay() {
  if (!app.solverOverlay) return;
  const { results, lieCheck, passed, total } = app.solverOverlay;
  ctx.fillStyle = PAL.PANEL; ctx.fillRect(50, 28, 860, 484);
  ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 2; ctx.strokeRect(50, 28, 860, 484);
  drawPixelText(ctx, `F9 SOLVER: ${passed}/${total} PASS | LIE CHECK: ${lieCheck.ok ? "UNIQUE" : "DUPLICATE"}`, 480, 44, 2, PAL.GOLD, "center", null, 820);
  const cols = 10, cw = 78, ch = 26, sx = 86, sy = 76;
  for (let i = 0; i < results.length; i++) {
    const r = results[i];
    const col = i % cols, row = Math.floor(i / cols);
    const x = sx + col * (cw + 2), y = sy + row * (ch + 3);
    ctx.fillStyle = r.pass ? PAL.SURFACE : PAL.CORAL;
    ctx.fillRect(x, y, cw, ch);
    ctx.strokeStyle = r.pass ? PAL.GOLD : PAL.WHITE; ctx.lineWidth = 1; ctx.strokeRect(x, y, cw, ch);
    drawPixelText(ctx, `${String(r.id).padStart(3,"0")}:${r.pass?"OK":"NO"}`, x + cw / 2, y + 6, 1, r.pass ? PAL.GOLD : PAL.ACCENT_TEXT, "center", null, cw - 6);
  }
  const fails = results.filter(r => !r.pass);
  if (fails.length > 0) {
    drawPixelText(ctx, `FIRST FAIL: R${fails[0].id} ${fails[0].reason}`, 480, 422, 1, PAL.CORAL, "center", null, 820);
  } else {
    drawPixelText(ctx, "ALL ROUNDS VERIFIED DETERMINISTIC PASS!", 480, 422, 2, PAL.GOLD, "center", null, 820);
  }
  addButton(400, 464, 160, 34, "Close [F9]", () => { app.solverOverlay = null; }, PAL.SURFACE, PAL.WHITE, PAL.BORDER);
}

function renderVictoryScreen() {
  ctx.fillStyle = PAL.BG; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
  drawAtmosphereAndEye(app.mouse.x, app.mouse.y, 200);
  const secretsFound = Object.keys(progress.foundSecrets || {}).length;
  drawPixelText(ctx, "100 ROUNDS CONQUERED!", 480, 82, 4, PAL.GOLD, "center", null, 860);
  drawPixelText(ctx, `Total Deaths: ${progress.totalDeaths}  •  Secrets: ${secretsFound}/12`, 480, 152, 2, PAL.CORAL, "center", null, 860);
  if (secretsFound >= 12) {
    addButton(310, 210, 340, 46, "Enter Secret Sanctuary (101)", () => startLevel(LEVELS.length - 1, true), PAL.GOLD, PAL.BG, PAL.GOLD);
  }
  addButton(340, 282, 280, 44, "Play Again [Enter]", () => startLevel(0, true), PAL.SURFACE, PAL.GOLD, PAL.BORDER);
  addButton(340, 340, 280, 42, "Level Select [L]", () => { app.screen = "select"; }, PAL.SURFACE, PAL.WHITE, PAL.BORDER);
  addButton(340, 396, 280, 42, "Main Menu", () => { app.screen = "title"; }, PAL.GOLD, PAL.BG, PAL.GOLD);
}

function render(alpha) {
  uiButtons.length = 0;
  const showTouch = app.screen === "play" && isTouchCapable();
  if (touchEl.classList.contains("active") !== showTouch) touchEl.classList.toggle("active", showTouch);
  canvas.style.cursor = (app.screen === "g2play" && app.g2 && app.g2.invertedCursor && app.g2.failTicks === 0) ? "none" : "pointer";

  if (app.screen === "title") renderTitleScreen();
  else if (app.screen === "select") renderLevelSelect();
  else if (app.screen === "shame") renderHallOfShame();
  else if (app.screen === "victory") renderVictoryScreen();
  else if (app.screen === "g2play") renderMindGame();
  else if (app.screen === "g2select") renderMindSelect();
  else if (app.screen === "g2win") renderMindWin();
  else if (app.screen === "pause" && !app.state) renderPauseMenu();
  else if ((app.screen === "play" || app.screen === "pause") && app.state) {
    ctx.fillStyle = PAL.BG; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    ctx.save();
    if (!progress.streamerSafe && app.shakeTicks > 0) {
      ctx.translate((Math.random() - 0.5) * app.shakeIntensity * 2, (Math.random() - 0.5) * app.shakeIntensity * 2);
    }
    drawAtmosphereAndEye(app.state.player.x + 8, app.state.player.y + 12, 225);
    renderTiles(app.state);
    renderEntities(app.state, alpha);
    renderFakeUI(app.state);
    ctx.restore();
    renderHUD(app.state);
    if (app.screen === "pause") renderPauseMenu();
  }
  renderClipPanel();
  renderSolverOverlay();
}

/* ============================================================================
 * 13. 60 HZ FIXED TIMESTEP LOOP
 * ============================================================================ */
let lastTime = performance.now(), accumulator = 0;
function tickGame() {
  app.uiTick++;
  if (app.fakeAlertTicks > 0) app.fakeAlertTicks--;
  if (app.eyeMoodTicks > 0) {
    app.eyeMoodTicks--;
    if (app.eyeMoodTicks === 0) app.eyeMood = "watch";
  }
  for (let i = app.particles.length - 1; i >= 0; i--) {
    const pt = app.particles[i]; pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.22; pt.life--;
    if (pt.life <= 0) app.particles.splice(i, 1);
  }
  if (app.shakeTicks > 0) app.shakeTicks--;
  if (app.deathFlashTicks > 0) app.deathFlashTicks--;
  if (app.screen === "g2play" && !app.showClipPanel && !app.solverOverlay) {
    tickMindGame();
    return;
  }
  if (app.screen !== "play" || !app.state || app.showClipPanel || app.solverOverlay) return;

  app.prevPlayerPos = { x: app.state.player.x, y: app.state.player.y };
  let input = {
    left: app.keys.left || app.touch.left,
    right: app.keys.right || app.touch.right,
    jump: app.keys.jump || app.touch.jump
  };
  if (app.botWatch) {
    input = app.botWatch.frames[app.botWatch.index++] || { left: false, right: false, jump: false };
    if (app.botWatch.index > app.botWatch.frames.length + 10) app.botWatch = null;
  }

  const wasDead = app.state.dead;
  stepSimulation(app.state, input, app.persistStore, app.pityActive);

  for (const snd of app.state.soundEvents) sfx.play(snd);
  for (const sh of app.state.shakeEvents) {
    if (!progress.streamerSafe) { app.shakeIntensity = sh.intensity; app.shakeTicks = sh.durationTicks; }
  }
  if (app.state.fakeDeathBurst) { spawnDeathParticles(app.state.player.x, app.state.player.y); if (!progress.streamerSafe) app.deathFlashTicks = 4; }
  if (!wasDead && app.state.dead) handleDeathTransition();
  if (app.state.dead && app.state.respawnTicksLeft === 0) startLevel(app.currentLevelIndex, false);
  if (app.state.won) handleWinTransition();
}

function frame(now) {
  const dt = Math.min(0.1, (now - lastTime) / 1000);
  lastTime = now; accumulator += dt;
  while (accumulator >= FIXED_DT) { tickGame(); accumulator -= FIXED_DT; }
  render(accumulator / FIXED_DT);
  requestAnimationFrame(frame);
}

const hashLvl = parseHashLevel();
if (hashLvl !== null && isRoundUnlocked(hashLvl)) startLevel(hashLvl - 1, true);
requestAnimationFrame(frame);
</script>
