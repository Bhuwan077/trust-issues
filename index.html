================================================================================
  TRUST ISSUES — README & ARCHITECTURE NOTES
================================================================================
  CONTROLS (Default — Remappable in Pause/Settings [ESC]):
    Move         : Arrow Keys / A & D / Touch buttons
    Jump         : Space / W / Up Arrow / Touch JUMP
    Restart      : R (instant < 200ms respawn; R is 0ms)
    Pause/Settings: Esc (also interactive mechanic in Round 10!)
    Level Select : L
    OBS Overlay  : O (toggle Big Death Counter overlay)
    Clip List    : C (toggle Rage Clip Marker panel; logs every 10th death)
    Hall of Shame: H (top most-died-on rounds locally)
    Safe Mode    : V (toggle Streamer-Safe reduced motion: no flash/shake)
    Color-Blind  : K (toggle shape-coded hazards/indicators)
    Share Code   : S (copy shareable URL hash e.g. #code=TI-014)
    Debug Solver : F9 (runs deterministic replay verification on ALL rounds)
    Watch Bot    : Shift+F9 (watch the bot beat the current round live)

  HOW TO RUN THE SOLVER:
    1. Open index.html in any browser.
    2. Press F9 anywhere to execute `runAllSolvers()` across every round and
       verify the Lie Index uniqueness self-check (`assertUniqueLies()`).
    3. Press Shift+F9 during any round to watch the recorded solution live.

  HOW TO ADD A LEVEL:
    1. Register a round via `addRound({ id, world, name, type, lieKey, mechanic,
       tell, solutionSummary, grid, start, exit, ... })`.
       Note: `lieKey` MUST be unique; `assertUniqueLies()` fails on duplicates.
    2. Add a deterministic input sequence to `LEVEL_SOLUTIONS[id]`.
    3. Press F9 to verify PASS.

  5-COLOR PALETTE JUSTIFICATION:
    1. #0F0E17 (Void Ink)      - Deep obsidian canvas background; maximizes contrast
                                 for 720p stream compression and crisp silhouettes.
    2. #FFFFFE (Chalk White)   - Player, HUD text, signs, shape outlines; instant
                                 foreground readability.
    3. #2E2D40 (Slate Stone)   - Solid tiles and UI frames; subdued so traps pop.
    4. #FF3366 (Betrayal Coral)- Spikes, lasers, rage counters; high visibility
                                 without pure-red stream chroma smear.
    5. #FFB800 (Bait Gold)     - Exit doors, coins, riddles, secret letters, tells.
================================================================================
-->

function getInitialTheme() {
  try {
    const saved = localStorage.getItem(THEME_KEY);

  } catch (e) {}
  try {
    if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) return "light";
  } catch (e) {}
  return "dark";
}

    btn.setAttribute("aria-label", "Switch to light mode");
    btn.title = "Light mode";
  }
}

let currentTheme = getInitialTheme();
function applyTheme(theme, persist = false) {
  currentTheme = theme === "light" ? "light" : "dark";
  if (document.documentElement) {
    if (currentTheme === "light") document.documentElement.setAttribute("data-theme", "light");
    else document.documentElement.removeAttribute("data-theme");
  }
  Object.assign(PAL, currentTheme === "light" ? PAL_LIGHT : PAL_DARK);
  updateThemeButtonIcon(currentTheme);
  if (persist) {
    try { localStorage.setItem(THEME_KEY, currentTheme); } catch (e) {}
  }
}
applyTheme(currentTheme, false);
const themeToggleBtn = document.getElementById("theme-toggle");
if (themeToggleBtn) {
  themeToggleBtn.addEventListener("click", () => {
    applyTheme(currentTheme === "light" ? "dark" : "light", true);
  });
}
if (window.matchMedia) {
  const mq = window.matchMedia("(prefers-color-scheme: light)");
  const onMqChange = e => {
    let hasSaved = false;
    try { hasSaved = !!localStorage.getItem(THEME_KEY); } catch (err) {}
    if (!hasSaved) applyTheme(e.matches ? "light" : "dark", false);
  };
  if (mq.addEventListener) mq.addEventListener("change", onMqChange);
}

function getCanvasFontSize(scale) {
  const s = scale <= 1 ? 2 : scale;
  return 7 * s;
}

function drawPixelText(ctx, text, x, y, scale, color, align = "left", letterOffsetFn = null, maxWidth = null) {
  const str = String(text).toUpperCase();
  let s = scale <= 1 ? 2 : scale;
  let charW = 6 * s;
  let totalW = str.length * charW - s;
  if (maxWidth && maxWidth > 0 && totalW > maxWidth && s > 1.2) {
    s = Math.max(1.2, (maxWidth / Math.max(1, str.length * 6 - 1)));
    charW = 6 * s;
    totalW = str.length * charW - s;
  }
  let startX = x;
  if (align === "center") startX = Math.round(x - totalW / 2);
  else if (align === "right") startX = Math.round(x - totalW);

  ctx.fillStyle = color;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    const glyph = FONT_5X7[ch] || FONT_5X7[" "];
    const extra = letterOffsetFn ? letterOffsetFn(i, ch) : { dx: 0, dy: 0 };
    const gx = startX + i * charW + extra.dx;
    const gy = Math.round(y + extra.dy);
    for (let r = 0; r < 7; r++) {
      const bits = glyph[r];
      if (!bits) continue;
      for (let c = 0; c < 5; c++) {
        if (bits & (16 >> c)) {
          ctx.fillRect(Math.round(gx + c * s), Math.round(gy + r * s), Math.ceil(s), Math.ceil(s));
        }
      }
    }
  }
}

function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, fontSize, color, align = "left") {
  const s = fontSize >= 21 ? 3 : 2;
  const charW = 6 * s;
  const maxChars = Math.max(8, Math.floor(maxWidth / charW));
  const words = String(text).toUpperCase().split(/\s+/);
  const lines = [];
  let line = "";
  for (const w of words) {
    const test = line ? `${line} ${w}` : w;
    if (test.length > maxChars && line) {
      lines.push(line);
      line = w;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);

  for (let i = 0; i < lines.length; i++) {
    drawPixelText(ctx, lines[i], x, y + i * lineHeight, s, color, align, null, maxWidth);
  }
  return lines.length;
}

/* ============================================================================
 * 4. WEB AUDIO SYNTHESIZER (NO EXTERNAL ASSETS, STARTS ON USER INPUT)
 * ============================================================================ */
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.muted = false;
  }
  unlock() {
    if (this.muted) return;
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) this.ctx = new AC();
    }
    if (this.ctx && this.ctx.state === "suspended") {
      this.ctx.resume().catch(() => {});
    }
  }
  tone(freq, dur, type = "square", vol = 0.07, slideTo = null, delay = 0) {
    if (this.muted || !this.ctx || this.ctx.state !== "running") return;
    const t = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(Math.max(30, freq), t);
    if (slideTo !== null) {
      osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    }
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.01);
  }
  play(name) {
    if (this.muted || !this.ctx || this.ctx.state !== "running") return;
    switch (name) {
      case "jump": this.tone(240, 0.08, "square", 0.06, 490); break;
      case "bounce": this.tone(220, 0.14, "triangle", 0.08, 720); break;
      case "death":
        this.tone(180, 0.13, "sawtooth", 0.1, 55);
        this.tone(110, 0.15, "triangle", 0.08, 42, 0.02);
        break;
      case "win":
        this.tone(523.25, 0.08, "square", 0.07, null, 0.00);
        this.tone(659.25, 0.08, "square", 0.07, null, 0.07);
        this.tone(783.99, 0.08, "square", 0.07, null, 0.14);

        break;
      case "riddleWin":

      case "fakeWin":

/* ============================================================================
 * 5. ROOM BUILDER & LIE INDEX REGISTRY
 * ============================================================================
 * Every round MUST register a unique `lieKey` and `mechanic` in `LIE_INDEX`.
 * `assertUniqueLies()` fails verification if any two rounds share a mechanic.
 */
function buildRoom(fn) {
  const g = Array.from({ length: ROWS }, (_, r) => {
    const arr = Array(COLS).fill(".");
    if (r === 0 || r === ROWS - 1) arr.fill("#");
    if (r >= 14) arr.fill("#");
    arr[0] = "#";
    arr[COLS - 1] = "#";
    return arr;
  });
  const api = {
    set(c, r, ch) { if (g[r] && g[r][c] !== undefined) g[r][c] = ch; },
    row(r, c1, c2, ch) { for (let c = c1; c <= c2; c++) api.set(c, r, ch); },
    col(c, r1, r2, ch) { for (let r = r1; r <= r2; r++) api.set(c, r, ch); },
    rect(c, r, w, h, ch) {
      for (let rr = r; rr < r + h; rr++)
        for (let cc = c; cc < c + w; cc++) api.set(cc, rr, ch);
    },
    plat(c, r, w, ch = "#") { api.row(r, c, c + w - 1, ch); },
    pit(c1, c2, spikeCh = "^") {
      api.row(14, c1, c2, ".");
      api.row(15, c1, c2, spikeCh);
    },
    clearFloor(c1, c2) {
      api.row(14, c1, c2, ".");
      api.row(15, c1, c2, ".");
      api.row(16, c1, c2, ".");
    }
  };
  if (fn) fn(api);
  return g.map(r => r.join(""));
}

const LEVELS = [];
const LIE_INDEX = [];

function addRound(def) {
  LEVELS.push(def);
  LIE_INDEX.push({
    id: def.id,
    world: def.world,
    name: def.name,
    type: def.type,
    lieKey: def.lieKey,
    mechanic: def.mechanic,
    tell: def.tell,
    solutionSummary: def.solutionSummary
  });
}

function assertUniqueLies() {
  const keys = new Set();
  const mechs = new Set();
  const errors = [];
  for (const item of LIE_INDEX) {
    if (!item.lieKey) errors.push(`Round ${item.id} missing lieKey`);
    if (keys.has(item.lieKey)) errors.push(`Duplicate lieKey "${item.lieKey}" at Round ${item.id}`);
    keys.add(item.lieKey);
    if (mechs.has(item.mechanic)) errors.push(`Duplicate mechanic "${item.mechanic}" at Round ${item.id}`);
    mechs.add(item.mechanic);
  }
  return { ok: errors.length === 0, count: LIE_INDEX.length, errors };
}

/* ============================================================================
 * 6. RIDDLE NORMALIZATION & HELPER
 * ============================================================================ */
function normalizeRiddleAnswer(str) {
  let s = String(str || "").trim().toLowerCase().replace(/[^a-z0-9]/g, "");
  if (s.length > 3 && s.endsWith("ies")) s = s.slice(0, -3) + "y";
  else if (s.length > 3 && s.endsWith("es")) s = s.slice(0, -2);
  else if (s.length > 2 && s.endsWith("s")) s = s.slice(0, -1);
  return s;
}

function expandSolution(segs) {
  const frames = [];
  for (const s of segs || []) {
    const n = s.ticks || 1;
    for (let i = 0; i < n; i++) {
      frames.push({
        left: !!s.left,
        right: !!s.right,
        jump: !!s.jump,
        pause: !!(s.pause && i === 0),
        typed: (i === 0 && s.typed) ? s.typed : null,
        click: (i === 0 && s.click) ? s.click : null
      });
    }
  }
  return frames;
}

function cloneGrid(gridStrings) { return gridStrings.map(r => r.split("")); }
function rectsOverlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

function createLevelState(levelDef, persistentLevelDeaths = 0, persistState = null) {
  const grid = cloneGrid(levelDef.grid);
  const scale = levelDef.playerScale || 1;
  const pw = Math.round(PLAYER_W * scale);
  const ph = Math.round(PLAYER_H * scale);
  const startX = levelDef.start.col * TILE + (TILE - pw) / 2;
  const startY = levelDef.start.row * TILE + (TILE - ph);

  const platforms = (levelDef.platforms || []).map(p => ({
    id: p.id,
    baseX: p.col * TILE, baseY: p.row * TILE,
    x: p.col * TILE, y: p.row * TILE,
    prevX: p.col * TILE, prevY: p.row * TILE,
    dx: 0, dy: 0,
    w: p.wTiles * TILE, h: p.hTiles * TILE,
    moveX: p.moveX || 0, moveY: p.moveY || 0,
    periodTicks: p.periodTicks || 120,
    solid: p.hologram ? false : (p.solid !== false),
    hologram: !!p.hologram,
    hiddenBox: !!p.hiddenBox,
    uiStyle: p.uiStyle || null,
    label: p.label || null
  }));

  const coins = (levelDef.coins || []).map(c => ({
    id: c.id, x: c.col * TILE + TILE / 2, y: c.row * TILE + TILE / 2, collected: false
  }));
  const flags = (levelDef.flags || []).map(f => ({
    id: f.id, x: f.col * TILE + TILE / 2, y: (f.row + 1) * TILE, dir: f.dir || 1, arrows: !!f.arrows, activated: false
  }));
  const signs = (levelDef.signs || []).map(s => ({ ...s }));
  for (const s of signs) {
    if (s.solid) {
      platforms.push({
        id: "sign_" + s.id,
        baseX: s.col * TILE - 4, baseY: s.row * TILE - 4,
        x: s.col * TILE - 4, y: s.row * TILE - 4,
        prevX: s.col * TILE - 4, prevY: s.row * TILE - 4,
        dx: 0, dy: 0, w: s.w || 132, h: s.h || 28,
        moveX: 0, moveY: 0, periodTicks: 120,
        solid: true, hologram: false, hiddenBox: true
      });
    }
  }

  const exit = {
    id: "exit",
    x: levelDef.exit.col * TILE + 3, y: levelDef.exit.row * TILE,
    w: 24, h: 30,
    label: levelDef.exitLabel || levelDef.exit.label || null,
    hiddenBehindHud: !!levelDef.exit.hiddenBehindHud,
    shyState: levelDef.exit.shy ? "idle" : null,
    moveAnim: null
  };

  const riddleState = levelDef.riddle ? {
    ...JSON.parse(JSON.stringify(levelDef.riddle)),
    solved: false,
    typedText: "",
    padIndex: 0,
    idleTicks: 0,
    lastPadId: null
  } : null;

  const triggers = (levelDef.triggers || []).map(t => ({
    ...JSON.parse(JSON.stringify(t)),
    fired: (persistState && t.persist && persistState[t.id]) ? true : false,
    wasInside: false,
    seqIndex: 0
  }));

  if (levelDef.echoPlatform && persistState && persistState.lastDeathPos) {
    const ey = Math.max(60, Math.min(410, persistState.lastDeathPos.y));
    const ex = Math.max(30, Math.min(860, persistState.lastDeathPos.x - 16));
    platforms.push({
      id: "echo_plat",
      baseX: ex, baseY: ey, x: ex, y: ey, prevX: ex, prevY: ey,
      dx: 0, dy: 0, w: 60, h: 16, moveX: 0, moveY: 0, periodTicks: 120,
      solid: true, hologram: false, hiddenBox: false, uiStyle: "echo"
    });
  }

  const hazards = (levelDef.hazards || []).map(h => ({ ...h, baseX: h.x, baseY: h.y }));
  const npcs = (levelDef.npcs || []).map(n => ({ ...n, alive: true }));

  return {
    levelDef,
    tick: 0,
    simTick: 0,
    grid,
    revealedHidden: new Set(),
    fallingTiles: [],
    emergingSpikes: [],
    pulsingTiles: [],
    platforms,
    coins,
    flags,
    signs,
    hazards,
    npcs,
    exit,
    riddle: riddleState,
    secretCollected: false,
    triggers,
    player: {
      x: startX, y: startY, vx: 0, vy: 0,
      w: pw, h: ph, scale,
      facing: 1, onGround: false,
      coyoteTicks: 0, jumpBufferTicks: 0, prevJumpInput: false,
      squashX: 1, squashY: 1, standingPlatId: null
    },
    twin: levelDef.dualControl ? {
      x: levelDef.dualControl.col * TILE + 7,
      y: levelDef.dualControl.row * TILE + 6,
      vx: 0, vy: 0, w: pw, h: ph, onGround: false
    } : null,
    gravityDir: levelDef.gravityDir || 1,
    rot90: 0,
    jumpScale: 1,
    jumpCount: 0,
    justJumpedThisTick: false,
    reversedControls: false,
    pauseOpenedThisLevel: false,
    wrapCount: 0,
    lavaY: levelDef.lavaStartY || 9999,
    windForce: 0,
    sonarTimer: 0,
    sonarUses: levelDef.sonarUses || 0,
    blackoutActive: !!levelDef.blackout,
    portalCooldown: 0,
    inputQueue: [],
    rewindStack: [],
    rewindCooldown: 0,
    recordedPos: [],
    posHistory: [],
    clickSolved: false,
    fakeUI: null,
    fakeDeathBurst: false,
    deathDisplayOverride: null,
    narratorOverride: null,
    won: false,
    dead: false,
    deathReason: null,
    respawnTicksLeft: 0,
    levelDeaths: persistentLevelDeaths,
    soundEvents: [],
    shakeEvents: []
  };
}

function isSolidChar(ch, insideOut = false, row = 0) {
  if (insideOut && row === 14) return ch === ".";
  return ch === "#" || ch === "C" || ch === "F" || ch === "H" || ch === "I" || ch === "B" || ch === "R";
}
function isSpikeChar(ch) {
  return ch === "^" || ch === "v" || ch === "<" || ch === ">";
}

function getSpikeHitbox(col, row, dir, emergeRatio = 1) {
  const tx = col * TILE, ty = row * TILE;
  const h = Math.round(11 * emergeRatio);
  if (h <= 1) return null;
  switch (dir) {
    case "^": return { x: tx + 6, y: ty + TILE - h, w: 18, h };
    case "v": return { x: tx + 6, y: ty, w: 18, h };
    case "<": return { x: tx + TILE - h, y: ty + 6, w: h, h: 18 };
    case ">": return { x: tx, y: ty + 6, w: h, h: 18 };
  }
  return null;
}

function evaluateCondition(cond, state) {
  const p = state.player;
  const pRect = { x: p.x, y: p.y, w: p.w, h: p.h };
  switch (cond.type) {
    case "zoneEnter": return rectsOverlap(pRect, cond.rect);
    case "zoneExit": return !rectsOverlap(pRect, cond.rect);
    case "timer": return state.tick >= cond.ticks;
    case "collectItem": {
      const c = state.coins.find(i => i.id === cond.itemId);
      return !!(c && c.collected);
    }
    case "jumpCount": return cond.op === "==" ? state.jumpCount === cond.count : state.jumpCount >= cond.count;
    case "everyJump": return !!state.justJumpedThisTick;
    case "always": return true;
    case "playerX": return cond.op === "<=" ? p.x <= cond.x : p.x >= cond.x;
    case "deathCount": return cond.op === "==" ? state.levelDeaths === cond.count : (cond.op === "<=" ? state.levelDeaths <= cond.count : state.levelDeaths >= cond.count);
    case "cycle": return (state.tick % cond.periodTicks) === cond.onTick;
    case "pauseOpened": return !!state.pauseOpenedThisLevel;
    case "riddleSolved": return !!(state.riddle && state.riddle.solved);
    case "idleSeconds": return !!(state.riddle && state.riddle.idleTicks >= (cond.seconds || 4) * 60);
    case "wrapCount": return state.wrapCount >= (cond.count || 1);
    default: return false;
  }
}

function executeAction(act, state, persistStore, rawInput) {
  switch (act.type) {
    case "moveEntity":
      if (act.targetId === "exit") {
        state.exit.moveAnim = {
          fromX: state.exit.x, fromY: state.exit.y,
          toX: act.toX, toY: act.toY,
          elapsed: 0, duration: Math.max(1, act.durationTicks || 20)
        };
      }
      break;
    case "shyFloorToggle": {
      const moving = !!(rawInput.left || rawInput.right);
      for (const t of act.tiles) {
        if (state.grid[t.row] && state.grid[t.row][t.col] !== undefined) {
          state.grid[t.row][t.col] = moving ? "N" : "#";
        }
      }
      break;
    }
    case "fallTile":
      for (const t of act.tiles) {
        const ch = state.grid[t.row] && state.grid[t.row][t.col];
        if (ch && ch !== ".") {
          state.grid[t.row][t.col] = ".";
          state.fallingTiles.push({ col: t.col, row: t.row, ch, yOffset: 0, vy: 0, delay: act.delayTicks || 0, fallSpeed: act.fallSpeed || 8 });
        }
      }
      break;
    case "toggleTile":
      for (const t of act.tiles) {
        if (state.grid[t.row] && state.grid[t.row][t.col] !== undefined) state.grid[t.row][t.col] = t.to;
      }
      break;
    case "pulseTile":
      for (const t of act.tiles) state.pulsingTiles.push({ col: t.col, row: t.row, ticksLeft: act.durationTicks || 20 });
      break;
    case "spawnSpike":
      state.emergingSpikes.push({ col: act.col, row: act.row, dir: act.dir || "^", progress: 0, emergeTicks: Math.max(1, act.emergeTicks || 6) });
      break;
    case "reverseControls":
      state.reversedControls = !!act.enabled;
      for (const f of state.flags) f.activated = true;
      break;
    case "toggleReverseControls": state.reversedControls = !state.reversedControls; break;
    case "flipGravity": state.gravityDir *= -1; break;
    case "scaleJump": state.jumpScale = act.value; break;
    case "scalePlayer": {
      const oldH = state.player.h;
      state.player.scale = act.scale;
      state.player.w = Math.round(PLAYER_W * act.scale);
      state.player.h = Math.round(PLAYER_H * act.scale);
      state.player.y += (oldH - state.player.h);
      break;
    }
    case "teleportExit": state.exit.moveAnim = null; state.exit.x = act.x; state.exit.y = act.y; break;
    case "spawnPlatform":
      state.platforms.push({
        id: act.id || ("dyn_" + state.platforms.length),
        baseX: act.x, baseY: act.y, x: act.x, y: act.y, prevX: act.x, prevY: act.y,
        dx: 0, dy: 0, w: act.w, h: act.h, moveX: 0, moveY: 0, periodTicks: 120,
        solid: true, hologram: false, hiddenBox: !!act.hiddenBox, uiStyle: act.uiStyle || null
      });
      break;
    case "showFakeUI":
      state.fakeUI = { variant: act.variant, ticksLeft: act.durationTicks || 120, totalTicks: act.durationTicks || 120, blocksInput: !!act.blocksInput };
      if (act.variant === "fakeDeath") state.fakeDeathBurst = true;
      break;
    case "setCounterDisplay":
      state.deathDisplayOverride = { value: act.value, ticksLeft: act.durationTicks || 90 };
      break;
    case "setBlackout": state.blackoutActive = !!act.enabled; break;
    case "setCoinPos": {
      const c = state.coins.find(i => i.id === act.itemId);
      if (c && !c.collected) { c.x = act.x; c.y = act.y; }
      break;
    }
    case "narratorLine": state.narratorOverride = act.text; break;
    case "playSound": state.soundEvents.push(act.sound); break;
    case "shake": state.shakeEvents.push({ intensity: act.intensity || 4, durationTicks: act.durationTicks || 6 }); break;
    case "kill": killPlayer(state, act.reason || "trap"); break;
  }
}

function submitTypedRiddle(state, rawText) {
  if (!state.riddle || state.riddle.mode !== "typed" || state.riddle.solved) return false;
  const norm = normalizeRiddleAnswer(rawText);
  const ok = state.riddle.answers.some(a => normalizeRiddleAnswer(a) === norm);
  if (ok) {
    state.riddle.solved = true;
    state.soundEvents.push("riddleWin");
    if (state.riddle.unlockTiles) {
      for (const t of state.riddle.unlockTiles) state.grid[t.row][t.col] = t.to;
    }
    return true;
  }
  state.soundEvents.push("trap");
  return false;
}

function stepSimulation(state, rawInput, persistStore = null, assistSlow = false) {
  state.soundEvents.length = 0;
  state.shakeEvents.length = 0;
  state.fakeDeathBurst = false;
  if (state.won) return;
  if (state.dead) {
    if (state.respawnTicksLeft > 0) state.respawnTicksLeft--;
    return;
  }

  const subSteps = state.levelDef.speedMult || 1;
  for (let sub = 0; sub < subSteps; sub++) {
    stepSingleTick(state, rawInput, persistStore, assistSlow);
    if (state.dead || state.won) break;
  }
}

function stepSingleTick(state, rawInput, persistStore, assistSlow) {
  state.tick++;
  const def = state.levelDef;
  const p = state.player;

  // Input delay queue (#53)
  let effInput = rawInput;
  if (def.inputDelay) {
    state.inputQueue.push({ left: !!rawInput.left, right: !!rawInput.right, jump: !!rawInput.jump });
    if (state.inputQueue.length <= def.inputDelay) {
      effInput = { left: false, right: false, jump: false };
    } else {
      effInput = state.inputQueue.shift();
    }
  }
  if (def.autoRun) {
    effInput = { left: false, right: true, jump: !!effInput.jump };
  }

  // Superhot time-only-on-move (#52)
  const worldAdvances = !def.superhotTime || !!(effInput.left || effInput.right || effInput.jump);
  if (worldAdvances) state.simTick++;

  if (rawInput.pause) state.pauseOpenedThisLevel = true;
  if (rawInput.typed) submitTypedRiddle(state, rawInput.typed);
  if (rawInput.click && def.microButtons) {
    for (const btn of def.microButtons) {
      if (rawInput.click.id === btn.id) {
        if (btn.win) { state.clickSolved = true; state.won = true; state.soundEvents.push("win"); return; }
        else { killPlayer(state, "wrongButton"); return; }
      }
    }
  }

  if (state.fakeUI) { state.fakeUI.ticksLeft--; if (state.fakeUI.ticksLeft <= 0) state.fakeUI = null; }
  if (state.deathDisplayOverride) { state.deathDisplayOverride.ticksLeft--; if (state.deathDisplayOverride.ticksLeft <= 0) state.deathDisplayOverride = null; }
  if (state.portalCooldown > 0) state.portalCooldown--;
  if (state.rewindCooldown > 0) state.rewindCooldown--;

  // Record history for clones / replay / rewind
  state.recordedPos.push({ x: p.x, y: p.y });
  state.posHistory.push({ x: p.x, y: p.y });
  if (state.posHistory.length > 60) state.posHistory.shift();

  if (def.rewindEnabled && state.tick % 2 === 0) {
    state.rewindStack.push({ x: p.x, y: p.y, vx: p.vx, vy: p.vy, tick: state.tick });
    if (state.rewindStack.length > 100) state.rewindStack.shift();
  }

  // Rotating gravity (#64)
  if (def.rotatePeriod && (state.tick % def.rotatePeriod) === 0) {
    state.rot90 = (state.rot90 + 1) % 4;
    state.soundEvents.push("flip");
  }

  // Rising lava (#65)
  if (def.lavaRiseSpeed && worldAdvances) {
    state.lavaY -= assistSlow ? def.lavaRiseSpeed * 0.65 : def.lavaRiseSpeed;
    if (p.y + p.h > state.lavaY) { killPlayer(state, "lava"); return; }
  }

  // Wind gusts (#68)
  if (def.windCycle) {
    const ph = state.simTick % def.windCycle.period;
    state.windForce = ph >= def.windCycle.onTick ? def.windCycle.force : 0;
  }

  for (let i = state.pulsingTiles.length - 1; i >= 0; i--) {
    state.pulsingTiles[i].ticksLeft--;
    if (state.pulsingTiles[i].ticksLeft <= 0) state.pulsingTiles.splice(i, 1);
  }
  for (let i = state.fallingTiles.length - 1; i >= 0; i--) {
    const ft = state.fallingTiles[i];
    if (ft.delay > 0) ft.delay--;
    else {
      ft.vy = Math.min(ft.fallSpeed, ft.vy + 0.9);
      ft.yOffset += ft.vy;
      if (ft.row * TILE + ft.yOffset > LOGICAL_H + 40) state.fallingTiles.splice(i, 1);
    }
  }
  for (const sp of state.emergingSpikes) {
    if (sp.progress < sp.emergeTicks) {
      sp.progress++;
      if (sp.progress === sp.emergeTicks) state.grid[sp.row][sp.col] = sp.dir;
    }
  }
  if (state.exit.moveAnim) {
    const a = state.exit.moveAnim;
    a.elapsed++;
    const t = Math.min(1, a.elapsed / a.duration);
    const ease = 1 - Math.pow(1 - t, 3);
    state.exit.x = a.fromX + (a.toX - a.fromX) * ease;
    state.exit.y = a.fromY + (a.toY - a.fromY) * ease;
    if (t >= 1) state.exit.moveAnim = null;
  }

  for (const plat of state.platforms) {
    plat.prevX = plat.x; plat.prevY = plat.y;
    if (worldAdvances) {
      if (plat.scrollY) {
        plat.y -= (assistSlow ? plat.scrollY * 0.65 : plat.scrollY);
        if (plat.y + plat.h < 40) plat.y = LOGICAL_H - 30;
      } else if (plat.moveX || plat.moveY) {
        const period = assistSlow ? Math.round(plat.periodTicks * 1.4) : plat.periodTicks;
        const phase = (state.simTick % period) / period;
        const s = 0.5 - 0.5 * Math.cos(phase * Math.PI * 2);
        plat.x = plat.baseX + plat.moveX * s;
        plat.y = plat.baseY + plat.moveY * s;
      }
    }
    plat.dx = plat.x - plat.prevX;
    plat.dy = plat.y - plat.prevY;
  }

  if (p.standingPlatId) {
    const plat = state.platforms.find(pl => pl.id === p.standingPlatId);
    if (plat) { p.x += plat.dx; p.y += plat.dy; }
  }
  p.standingPlatId = null;

  let moveLeft = !!effInput.left;
  let moveRight = !!effInput.right;
  if (def.mirrorX !== undefined) state.reversedControls = p.x >= def.mirrorX;
  if (state.reversedControls) { const tmp = moveLeft; moveLeft = moveRight; moveRight = tmp; }
  const jumpHeld = !!effInput.jump;
  const jumpPressed = jumpHeld && !p.prevJumpInput;
  p.prevJumpInput = jumpHeld;

  if (jumpPressed) p.jumpBufferTicks = JUMP_BUFFER_TICKS;
  else if (p.jumpBufferTicks > 0) p.jumpBufferTicks--;

  if (p.onGround) p.coyoteTicks = COYOTE_TICKS;
  else if (p.coyoteTicks > 0) p.coyoteTicks--;

  const dir = (moveRight ? 1 : 0) - (moveLeft ? 1 : 0);
  if (dir !== 0) p.facing = dir;

  const footCol = Math.floor((p.x + p.w / 2) / TILE);
  const footRow = Math.floor((p.y + p.h + 2) / TILE);
  const footCh = state.grid[footRow] && state.grid[footRow][footCol];
  if (p.onGround && footCh === "R") state.jumpScale = 1.0;

  const onIce = p.onGround && (def.allIce || footCh === "I");
  const accel = p.onGround ? GROUND_ACCEL : AIR_ACCEL;
  const decel = p.onGround ? (onIce ? ICE_DECEL : GROUND_DECEL) : AIR_DECEL;
  const targetVx = dir * MOVE_SPEED + state.windForce;

  if (dir !== 0 || state.windForce !== 0) {
    const dv = accel * FIXED_DT;
    if (p.vx < targetVx) p.vx = Math.min(targetVx, p.vx + dv);
    else if (p.vx > targetVx) p.vx = Math.max(targetVx, p.vx - dv);
  } else {
    const dv = decel * FIXED_DT;
    if (p.vx > 0) p.vx = Math.max(0, p.vx - dv);
    else if (p.vx < 0) p.vx = Math.min(0, p.vx + dv);
  }

  // Magnets (#67)
  if (def.magnets) {
    for (const mag of def.magnets) {
      const dx = mag.x - (p.x + p.w / 2), dy = mag.y - (p.y + p.h / 2);
      const dist = Math.hypot(dx, dy);
      if (dist < mag.range && dist > 4) {
        p.vx += (dx / dist) * mag.pull * FIXED_DT;
        p.vy += (dy / dist) * mag.pull * FIXED_DT;
      }
    }
  }

  state.justJumpedThisTick = false;
  if (p.jumpBufferTicks > 0 && p.coyoteTicks > 0) {
    p.vy = JUMP_VELOCITY * state.jumpScale * state.gravityDir;
    p.onGround = false;
    p.coyoteTicks = 0; p.jumpBufferTicks = 0;
    p.squashX = 0.78; p.squashY = 1.24;
    state.jumpCount++;
    state.justJumpedThisTick = true;
    if (def.shrinkJump) state.jumpScale = Math.max(0.42, state.jumpScale - 0.16);
    if (def.sonarOnJump && state.sonarUses > 0) { state.sonarUses--; state.sonarTimer = 90; }
    state.soundEvents.push("jump");
  }
  if (state.sonarTimer > 0) state.sonarTimer--;

  let g = GRAVITY * state.gravityDir;
  if ((state.gravityDir > 0 && p.vy < 0 && !jumpHeld) || (state.gravityDir < 0 && p.vy > 0 && !jumpHeld)) {
    g *= JUMP_CUT_MULT;
  }
  p.vy = Math.max(-MAX_FALL_SPEED, Math.min(MAX_FALL_SPEED, p.vy + g * FIXED_DT));
  p.squashX += (1 - p.squashX) * 0.25;
  p.squashY += (1 - p.squashY) * 0.25;

  p.x += p.vx * FIXED_DT;
  if (def.wrapEdges) {
    if (p.x < 16) { p.x = LOGICAL_W - 44; state.wrapCount++; }
    else if (p.x > LOGICAL_W - 32) { p.x = 24; state.wrapCount++; }
  }
  resolveAxisX(state);

  const wasGrounded = p.onGround;
  p.onGround = false;
  p.y += p.vy * FIXED_DT;
  resolveAxisY(state);
  if (p.onGround && !wasGrounded) { p.squashX = 1.22; p.squashY = 0.80; }

  // Dual control twin (#77)
  if (state.twin) {
    const tw = state.twin;
    const tDir = -dir;
    tw.vx = tDir * MOVE_SPEED;
    if (state.justJumpedThisTick && tw.onGround) { tw.vy = JUMP_VELOCITY; tw.onGround = false; }
    tw.vy = Math.min(MAX_FALL_SPEED, tw.vy + GRAVITY * FIXED_DT);
    tw.x = Math.max(30, Math.min(LOGICAL_W - 30 - tw.w, tw.x + tw.vx * FIXED_DT));
    tw.y += tw.vy * FIXED_DT;
    tw.onGround = false;
    const tr = Math.floor((tw.y + tw.h) / TILE);
    const tc = Math.floor((tw.x + tw.w / 2) / TILE);
    if (state.grid[tr] && isSolidChar(state.grid[tr][tc])) { tw.y = tr * TILE - tw.h; tw.vy = 0; tw.onGround = true; }
    if (state.grid[tr] && isSpikeChar(state.grid[tr][tc])) { killPlayer(state, "twin"); return; }
    if (tw.y > LOGICAL_H) { killPlayer(state, "twin"); return; }
  }

  const pRect = { x: p.x, y: p.y, w: p.w, h: p.h };

  // Update hazards (chasers, fists, dodging coins, rideable enemies)
  for (const h of state.hazards) {
    if (worldAdvances) {
      if (h.kind === "sweep") {
        const span = h.maxX - h.minX;
        const t = (state.simTick % h.period) / h.period;
        h.x = h.minX + (0.5 - 0.5 * Math.cos(t * Math.PI * 2)) * span;
      } else if (h.kind === "fist") {
        const cycle = (state.simTick + (h.offset || 0)) % h.period;
        if (cycle < h.warnTicks) { h.y = h.baseY; h.warning = true; }
        else if (cycle < h.warnTicks + h.slamTicks) { h.warning = false; h.y = h.slamY; }
        else { h.warning = false; h.y = h.baseY; }
      } else if (h.kind === "ride") {
        const t = (state.simTick % h.period) / h.period;
        const prevX = h.x;
        h.x = h.baseX + (0.5 - 0.5 * Math.cos(t * Math.PI * 2)) * h.moveX;
        h.dx = h.x - prevX;
      }
    }
    if (h.solidTop && rectsOverlap(pRect, h)) {
      if (p.vy >= 0 && (p.y + p.h - p.vy * FIXED_DT) <= h.y + 12) {
        p.y = h.y - p.h; p.vy = 0; p.onGround = true; p.x += (h.dx || 0);
      } else { killPlayer(state, "hazard"); return; }
    } else if (!h.solidTop && rectsOverlap(pRect, h)) {
      killPlayer(state, "hazard"); return;
    }
  }

  // Update NPCs (#71 escort, #72 decoy, #80 helper)
  for (const npc of state.npcs) {
    if (!npc.alive) continue;
    if (npc.kind === "escort") {
      npc.x += npc.vx;
      const nc = Math.floor((npc.x + 10) / TILE), nr = Math.floor((npc.y + 22) / TILE);
      if (state.grid[nr] && isSpikeChar(state.grid[nr][nc])) { killPlayer(state, "escortDied"); return; }
      if (state.grid[nr] && state.grid[nr][nc] === ".") { killPlayer(state, "escortFell"); return; }
    } else if (npc.kind === "decoy") {
      npc.x += npc.vx;
      const nc = Math.floor((npc.x + 26) / TILE);
      if (state.grid[15] && isSpikeChar(state.grid[15][nc]) && npc.vy === 0) npc.vy = -460;
      npc.vy += GRAVITY * FIXED_DT; npc.y += npc.vy * FIXED_DT;
      if (npc.y >= 13 * TILE + 6) { npc.y = 13 * TILE + 6; npc.vy = 0; }
    }
  }

  // Past-self replay hazard (#27) & past-self trigger ghost (#55)
  if (def.replayGhostHazard && persistStore && persistStore.lastReplay && persistStore.lastReplay.length > 0) {
    const revIdx = Math.max(0, persistStore.lastReplay.length - 1 - (state.tick % persistStore.lastReplay.length));
    const gp = persistStore.lastReplay[revIdx];
    state.ghostPos = gp;
    if (state.tick > 25 && rectsOverlap(pRect, { x: gp.x + 2, y: gp.y + 2, w: p.w - 4, h: p.h - 4 })) {
      killPlayer(state, "pastSelf"); return;
    }
  }
  if (def.pastSelfSwitch && persistStore && persistStore.lastReplay && persistStore.lastReplay.length > 0) {
    const gp = persistStore.lastReplay[Math.min(persistStore.lastReplay.length - 1, state.tick)];
    state.ghostPos = gp;
    if (rectsOverlap({ x: gp.x, y: gp.y, w: p.w, h: p.h }, def.pastSelfSwitch.rect)) {
      for (const t of def.pastSelfSwitch.unlockTiles) state.grid[t.row][t.col] = t.to;
    }
  }

  // Portals (#66)
  if (def.portals && state.portalCooldown === 0) {
    for (const pt of def.portals) {
      if (rectsOverlap(pRect, { x: pt.x, y: pt.y, w: 24, h: 30 })) {
        p.x = pt.toX; p.y = pt.toY; p.vx = 0; p.vy = 0;
        state.portalCooldown = 30;
        state.soundEvents.push("flip");
        break;
      }
    }
  }

  // Rewind Pad (#51)
  if (def.rewindPad && state.rewindCooldown === 0 && rectsOverlap(pRect, def.rewindPad)) {
    const snap = state.rewindStack[0];
    if (snap) {
      p.x = snap.x; p.y = snap.y; p.vx = 0; p.vy = 0;
      state.rewindCooldown = 40;
      state.soundEvents.push("glitch");
    }
  }

  // Collect coins
  for (const c of state.coins) {
    if (!c.collected && rectsOverlap(pRect, { x: c.x - 10, y: c.y - 10, w: 20, h: 20 })) {
      c.collected = true;
      state.soundEvents.push("coin");
    }
  }

  // Secret letter pickup
  if (def.secretLetter && !state.secretCollected) {
    const sl = def.secretLetter;
    if (rectsOverlap(pRect, { x: sl.col * TILE + 4, y: sl.row * TILE + 4, w: 22, h: 22 })) {
      state.secretCollected = true;
      state.soundEvents.push("riddleWin");
    }
  }

  // Riddle pads & idle detection
  if (state.riddle && !state.riddle.solved) {
    if (state.riddle.mode === "idle") {
      if (!effInput.left && !effInput.right && !effInput.jump && Math.abs(p.vx) < 1 && p.onGround) {
        state.riddle.idleTicks++;
        if (state.riddle.idleTicks >= (state.riddle.idleTicksRequired || 240)) {
          state.riddle.solved = true;
          state.soundEvents.push("riddleWin");
          if (state.riddle.unlockTiles) for (const t of state.riddle.unlockTiles) state.grid[t.row][t.col] = t.to;
        }
      } else state.riddle.idleTicks = 0;
    } else if (state.riddle.mode === "pads") {
      let touchingPad = null;
      for (const pad of state.riddle.pads) {
        if (rectsOverlap(pRect, { x: pad.col * TILE + 2, y: (pad.row - 1) * TILE + 12, w: TILE - 4, h: 20 })) { touchingPad = pad.id; break; }
      }
      if (touchingPad && touchingPad !== state.riddle.lastPadId) {
        if (touchingPad === state.riddle.sequence[state.riddle.padIndex]) {
          state.riddle.padIndex++;
          state.soundEvents.push("coin");
          if (state.riddle.padIndex >= state.riddle.sequence.length) {
            state.riddle.solved = true;
            state.soundEvents.push("riddleWin");
            if (state.riddle.unlockTiles) for (const t of state.riddle.unlockTiles) state.grid[t.row][t.col] = t.to;
          }
        } else { state.riddle.padIndex = 0; state.soundEvents.push("trap"); }
      }
      state.riddle.lastPadId = touchingPad;
    }
  }

  // Evaluate triggers
  for (const trig of state.triggers) {
    if (trig.once && trig.fired) continue;
    let shouldFire = false;
    const cond = trig.condition;
    if (cond.type === "sequence") {
      if (trig.seqIndex < cond.steps.length && evaluateCondition(cond.steps[trig.seqIndex], state)) {
        trig.seqIndex++;
        if (trig.seqIndex >= cond.steps.length) shouldFire = true;
      }
    } else if (cond.type === "zoneEnter") {
      const inside = evaluateCondition(cond, state);
      if (inside && !trig.wasInside) shouldFire = true;
      trig.wasInside = inside;
    } else if (cond.type === "zoneExit") {
      const outside = evaluateCondition(cond, state);
      if (outside && !trig.wasInside) shouldFire = true;
      trig.wasInside = outside;
    } else {
      shouldFire = evaluateCondition(cond, state);
    }
    if (shouldFire) {
      if (trig.once) trig.fired = true;
      if (persistStore && trig.persist) persistStore[trig.id] = true;
      for (const act of trig.actions) executeAction(act, state, persistStore, effInput);
      if (state.dead) return;
    }
  }

  // Hazard checks
  if (p.y + p.h > LOGICAL_H + 8 || p.y < -30) { killPlayer(state, "pit"); return; }
  const minC = Math.max(0, Math.floor(p.x / TILE) - 1), maxC = Math.min(COLS - 1, Math.floor((p.x + p.w) / TILE) + 1);
  const minR = Math.max(0, Math.floor(p.y / TILE) - 1), maxR = Math.min(ROWS - 1, Math.floor((p.y + p.h) / TILE) + 1);
  for (let r = minR; r <= maxR; r++) {
    for (let c = minC; c <= maxC; c++) {
      const ch = state.grid[r][c];
      if (isSpikeChar(ch)) {
        const hb = getSpikeHitbox(c, r, ch, 1);
        if (hb && rectsOverlap(pRect, hb)) { killPlayer(state, "spike"); return; }
      } else if (ch === "L") {
        if (rectsOverlap(pRect, { x: c * TILE + 8, y: r * TILE, w: 14, h: TILE })) { killPlayer(state, "laser"); return; }
      }
    }
  }
  for (const sp of state.emergingSpikes) {
    if (sp.progress < sp.emergeTicks) {
      const hb = getSpikeHitbox(sp.col, sp.row, sp.dir, sp.progress / sp.emergeTicks);
      if (hb && rectsOverlap(pRect, hb)) { killPlayer(state, "spike"); return; }
    }
  }

  // Exit check (normal or death-counter HUD exit #28)
  const exRect = def.exitIsDeathCounter
    ? { x: 348, y: 6, w: 96, h: 48 }
    : { x: state.exit.x + 2, y: state.exit.y + 2, w: state.exit.w - 4, h: state.exit.h - 2 };
  if ((!def.exitDisabled || def.exitIsDeathCounter) && rectsOverlap(pRect, exRect)) {
    state.won = true;
    state.soundEvents.push("win");
  }
}

function resolveAxisX(state) {
  const p = state.player, io = !!state.levelDef.insideOut;
  const minR = Math.max(0, Math.floor(p.y / TILE)), maxR = Math.min(ROWS - 1, Math.floor((p.y + p.h - 0.001) / TILE));
  const minC = Math.max(0, Math.floor(p.x / TILE)), maxC = Math.min(COLS - 1, Math.floor((p.x + p.w - 0.001) / TILE));
  for (let r = minR; r <= maxR; r++) {
    for (let c = minC; c <= maxC; c++) {
      const ch = state.grid[r][c];
      if (!isSolidChar(ch, io, r)) continue;
      const tr = { x: c * TILE, y: r * TILE, w: TILE, h: TILE };
      if (rectsOverlap({ x: p.x, y: p.y, w: p.w, h: p.h }, tr)) {
        if (ch === "H") state.revealedHidden.add(`${c},${r}`);
        if (p.vx > 0) p.x = tr.x - p.w;
        else if (p.vx < 0) p.x = tr.x + tr.w;
        p.vx = 0;
      }
    }
  }
  for (const plat of state.platforms) {
    if (!plat.solid) continue;
    if (rectsOverlap({ x: p.x, y: p.y, w: p.w, h: p.h }, plat)) {
      if (p.vx > 0) p.x = plat.x - p.w;
      else if (p.vx < 0) p.x = plat.x + plat.w;
      p.vx = 0;
    }
  }
  if (!state.levelDef.wrapEdges) {
    if (p.x < 0) { p.x = 0; p.vx = 0; }
    if (p.x + p.w > LOGICAL_W) { p.x = LOGICAL_W - p.w; p.vx = 0; }
  }
}

function resolveAxisY(state) {
  const p = state.player, io = !!state.levelDef.insideOut;
  const minR = Math.max(0, Math.floor(p.y / TILE)), maxR = Math.min(ROWS - 1, Math.floor((p.y + p.h - 0.001) / TILE));
  const minC = Math.max(0, Math.floor(p.x / TILE)), maxC = Math.min(COLS - 1, Math.floor((p.x + p.w - 0.001) / TILE));
  for (let r = minR; r <= maxR; r++) {
    for (let c = minC; c <= maxC; c++) {
      const ch = state.grid[r][c];
      if (!isSolidChar(ch, io, r)) continue;
      const tr = { x: c * TILE, y: r * TILE, w: TILE, h: TILE };
      if (rectsOverlap({ x: p.x, y: p.y, w: p.w, h: p.h }, tr)) {
        if (ch === "H" && !state.revealedHidden.has(`${c},${r}`)) {
          state.revealedHidden.add(`${c},${r}`);
          state.soundEvents.push("bonk");
        }
        if (p.vy > 0) {
          p.y = tr.y - p.h;
          if (ch === "B") { p.vy = -740; state.soundEvents.push("bounce"); }
          else { p.vy = 0; if (state.gravityDir > 0) p.onGround = true; }
        } else if (p.vy < 0) {
          p.y = tr.y + tr.h;
          p.vy = 0;
          if (state.gravityDir < 0) p.onGround = true;
        }
      }
    }
  }
  for (const plat of state.platforms) {
    if (!plat.solid) continue;
    if (rectsOverlap({ x: p.x, y: p.y, w: p.w, h: p.h }, plat)) {
      if (p.vy >= 0 && (p.y + p.h - p.vy * FIXED_DT) <= plat.y + 10) {
        p.y = plat.y - p.h; p.vy = 0; p.onGround = true; p.standingPlatId = plat.id;
      } else if (p.vy < 0) {
        p.y = plat.y + plat.h; p.vy = 0;
      }
    }
  }
}

function killPlayer(state, reason, persistStore = null) {
  if (state.dead || state.won) return;
  state.dead = true;
  state.deathReason = reason;
  state.respawnTicksLeft = RESPAWN_TICKS;
  state.soundEvents.push("death");
  state.shakeEvents.push({ intensity: 6, durationTicks: 8 });
}

/* ============================================================================
 * 9. DETERMINISTIC F9 SOLVER & LIE INDEX SELF-CHECK
 * ============================================================================ */
function runHeadlessSolverForLevel(levelId) {
  const def = LEVELS.find(l => l.id === levelId);
  if (!def) return { id: levelId, pass: false, reason: "Missing level" };
  const sol = LEVEL_SOLUTIONS[levelId];
  if (!sol) return { id: levelId, pass: false, reason: "Missing solution" };

  const persistStore = { deathSpots: [], deaths: 0 };
  const setupRuns = Array.isArray(sol) ? [] : (sol.setupRuns || []);
  const solveSegs = Array.isArray(sol) ? sol : sol.solve;

  for (const sRun of setupRuns) {
    const frames = expandSolution(sRun);
    const st = createLevelState(def, persistStore.deaths || 0, persistStore);
    for (let i = 0; i < frames.length; i++) {
      stepSimulation(st, frames[i], persistStore);
      if (st.dead) {
        persistStore.deaths = (persistStore.deaths || 0) + 1;
        persistStore.lastDeathPos = { x: st.player.x, y: st.player.y };
        persistStore.deathSpots.push({ x: st.player.x, y: st.player.y });
        persistStore.lastReplay = st.recordedPos.slice();
        break;
      }
    }
    if (!st.dead && st.recordedPos.length) persistStore.lastReplay = st.recordedPos.slice();
  }

  const frames = expandSolution(solveSegs);
  const state = createLevelState(def, persistStore.deaths || 0, persistStore);
  const maxTicks = frames.length + 30;
  for (let i = 0; i < maxTicks; i++) {
    const inp = frames[i] || { left: false, right: false, jump: false };
    stepSimulation(state, inp, persistStore);
    if (state.dead) {
      return { id: levelId, name: def.name, pass: false, ticks: state.tick, reason: `Died (${state.deathReason}) @ t=${state.tick}` };
    }
    if (state.won) {
      return { id: levelId, name: def.name, pass: true, ticks: state.tick, seconds: (state.tick / 60).toFixed(2) };
    }
  }
  return { id: levelId, name: def.name, pass: false, ticks: state.tick, reason: `Timeout @ (${Math.round(state.player.x)},${Math.round(state.player.y)})` };
}

function runAllSolvers() {
  const lieCheck = assertUniqueLies();
  const results = LEVELS.map(l => runHeadlessSolverForLevel(l.id));
  const passed = results.filter(r => r.pass).length;
  console.group(`TRUST ISSUES F9 SOLVER: ${passed}/${results.length} PASS | LIE INDEX: ${lieCheck.ok ? "UNIQUE OK" : "FAIL"}`);
  if (!lieCheck.ok) console.error(lieCheck.errors);
  for (const r of results) {
    console.log(`R${String(r.id).padStart(3,"0")} (${r.name}): ${r.pass ? `PASS [${r.seconds}s / ${r.ticks}t]` : `FAIL - ${r.reason}`}`);
  }
  console.groupEnd();
  return { results, lieCheck, passed, total: results.length };
}

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const toastEl = document.getElementById("toast");

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove("show"), 2000);
}

function getDailyRoundId() {
  const d = new Date();
  const key = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  return ((key * 2654435761) >>> 0) % Math.min(100, LEVELS.length) + 1;
}

const defaultProgress = () => ({
  cleared: {},
  assistedClears: {},
  totalDeaths: 0,
  levelDeaths: {},
  bestTimes: {},
  foundSecrets: {},
  rageClips: [],
  g2Cleared: {},
  g2Fails: {},
  g2TotalFails: 0,
  streamerSafe: false,
  colorBlind: false,
  muted: false,
  bigDeathOverlay: false,
  sandboxUnlock: false,
  keys: { left: "ArrowLeft", right: "ArrowRight", jump: "Space", restart: "KeyR" }
});

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultProgress();
    const p = JSON.parse(raw);
    return { ...defaultProgress(), ...p, keys: { ...defaultProgress().keys, ...(p.keys || {}) } };
  } catch (e) { return defaultProgress(); }
}

function saveProgress(prog) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(prog)); } catch (e) {}
}

const progress = loadProgress();
sfx.muted = !!progress.muted;

function isWorldUnlocked(worldId) {
  if (worldId === 1) return true;
  const prev = WORLDS.find(w => w.id === worldId - 1);
  if (!prev) return true;
  return !!progress.cleared[prev.rounds[1]];
}

function isRoundUnlocked(id) {
  if (id === 1) return true;
  if (id === 101) return Object.keys(progress.foundSecrets || {}).length >= 12;
  return !!progress.cleared[id] || !!progress.cleared[id - 1];
}

function isMindStageUnlocked(idx) {
  if (idx <= 0) return true;
  const prev = MIND_LEVELS[idx - 1];
  return !!(progress.g2Cleared && (progress.g2Cleared[MIND_LEVELS[idx].id] || (prev && progress.g2Cleared[prev.id])));
}

window.addEventListener("pagehide", () => saveProgress(progress));
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") saveProgress(progress);
});
