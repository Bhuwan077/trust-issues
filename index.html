function startLevel(index, resetConsecutive = false) {
  app.currentLevelIndex = Math.max(0, Math.min(LEVELS.length - 1, index));
  const def = LEVELS[app.currentLevelIndex];
  if (resetConsecutive) {
    app.consecutiveDeaths = 0;
    app.persistStore = {};
    app.pityActive = false;
    app.riddleRevealed = false;
  }
  app.state = createLevelState(def, progress.levelDeaths[def.id] || 0, app.persistStore);
  app.prevPlayerPos = { x: app.state.player.x, y: app.state.player.y };
  app.particles = [];
  app.botWatch = null;
  app.screen = "play";
}

function pickNarratorLine() {
  let idx;
  do { idx = Math.floor(Math.random() * NARRATOR_LINES.length); }
  while (idx === app.lastNarratorIdx && NARRATOR_LINES.length > 1);
  app.lastNarratorIdx = idx;
  return NARRATOR_LINES[idx];
}

function spawnDeathParticles(x, y) {
  for (let i = 0; i < 16; i++) {
    const ang = (Math.PI * 2 * i) / 16 + (Math.random() - 0.5) * 0.3;
    const spd = 2.2 + Math.random() * 4.5;
    app.particles.push({
      x: x + PLAYER_W / 2, y: y + PLAYER_H / 2,
      vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 1.2,
      life: 16 + Math.floor(Math.random() * 10), maxLife: 26, size: 3 + (i % 3),
      color: i % 3 === 0 ? PAL.WHITE : PAL.CORAL
    });
  }
}

function handleDeathTransition() {
  const def = app.state.levelDef;
  const p = app.state.player;
  app.persistStore.deaths = (app.persistStore.deaths || 0) + 1;
  app.persistStore.lastDeathPos = { x: p.x, y: p.y };
  app.persistStore.deathSpots = app.persistStore.deathSpots || [];
  app.persistStore.deathSpots.push({ x: p.x, y: p.y });
  app.persistStore.lastReplay = app.state.recordedPos.slice();
  progress.totalDeaths++;
  progress.levelDeaths[def.id] = (progress.levelDeaths[def.id] || 0) + 1;
  app.consecutiveDeaths++;
  app.state.levelDeaths = progress.levelDeaths[def.id];
  if (app.consecutiveDeaths > 0 && app.consecutiveDeaths % 10 === 0) {
    const d = new Date();
    const ts = [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, "0")).join(":");
    progress.rageClips.unshift({ timeStr: ts, levelId: def.id, levelName: def.name, consecutiveDeaths: app.consecutiveDeaths, totalDeaths: progress.totalDeaths });
    if (progress.rageClips.length > 30) progress.rageClips.length = 30;
    showToast(`RAGE CLIP MARKER: ${app.consecutiveDeaths} DEATHS ON R${def.id}`);
  }
  saveProgress(progress);
  app.trustScore = Math.max(-999, app.trustScore - 7);
  app.narratorText = pickNarratorLine();
  app.eyeMood = "laugh";
  app.eyeMoodTicks = 45;
  if (!progress.streamerSafe && (progress.totalDeaths === 1 || progress.totalDeaths % 6 === 0)) {
    const alerts = [
      "SYSTEM ALERT: SAVE DATA CORRUPTED (0/100)",
      "WARNING: CONTROLS PERMANENTLY INVERTED",
      "PATCHING OUT YOUR SKILL... 99% COMPLETE",
      "DELETING GAME.EXE ... FAILED (TRY AGAIN)"
    ];
    app.fakeAlertText = alerts[progress.totalDeaths % alerts.length];
    app.fakeAlertTicks = 46;
  }
  spawnDeathParticles(app.state.player.x, app.state.player.y);
  if (!progress.streamerSafe) app.deathFlashTicks = 5;
}

function handleWinTransition() {
  const def = app.state.levelDef;
  const elapsed = app.state.tick / 60;
  progress.cleared[def.id] = true;
  if (app.pityActive) progress.assistedClears[def.id] = true;
  const prev = progress.bestTimes[def.id];
  if (prev === undefined || elapsed < prev) progress.bestTimes[def.id] = Number(elapsed.toFixed(2));
  if (app.state.secretCollected) progress.foundSecrets[def.world] = def.secretLetter.char;
  saveProgress(progress);

  if (def.id < 100 && app.currentLevelIndex + 1 < LEVELS.length) {
    app.narratorText = `CLEARED "${def.name}" IN ${elapsed.toFixed(2)}S.`;
    startLevel(app.currentLevelIndex + 1, true);
  } else {
    app.screen = "victory";
  }
}

function openPauseMenu() {
  if (app.screen === "play" && app.state) {
    app.state.pauseOpenedThisLevel = true;
    stepSimulation(app.state, { left: false, right: false, jump: false, pause: true }, app.persistStore);
  }
  app.screen = "pause";
}
function shareCurrentLevelCode() {
  const lvl = LEVELS[app.currentLevelIndex].id;
  const code = `TI-${String(lvl).padStart(3, "0")}`;
  window.history.replaceState(null, "", `#code=${code}`);
  showToast(`LEVEL CODE SET IN URL: #code=${code}`);
}

function parseHashLevel() {
  const m = (window.location.hash || "").match(/(?:code=TI-?|L=?)(\d+)/i);
  if (m) {
    const num = parseInt(m[1], 10);
    if (num >= 1 && num <= LEVELS.length) return num;
  }
  return null;
}

/* ============================================================================
 * 11. INPUT HANDLING (REMAPPABLE KEYS + TYPED RIDDLES + TOUCH)
 * ============================================================================ */
function matchesAction(code, action) {
  const bound = progress.keys[action];
  if (code === bound) return true;
  if (action === "left" && (code === "ArrowLeft" || code === "KeyA")) return true;
  if (action === "right" && (code === "ArrowRight" || code === "KeyD")) return true;
  if (action === "jump" && (code === "Space" || code === "ArrowUp" || code === "KeyW")) return true;
  return false;
}

const mobileTypeInput = document.getElementById("mobile-type-input");
function submitTypedRiddleFromUI() {
  if (!(app.screen === "play" && app.state && app.state.riddle && app.state.riddle.mode === "typed" && !app.state.riddle.solved)) return;
  const ok = submitTypedRiddle(app.state, app.state.riddle.typedText);
  if (ok) {
    sfx.play("riddleWin");
    app.narratorText = "FINE. YOU CAN READ.";
    if (mobileTypeInput) { mobileTypeInput.value = ""; mobileTypeInput.blur(); }
  } else {
    sfx.play("trap");
    app.narratorText = "WRONG WORD. NICE GUESS THOUGH.";
    app.state.riddle.typedText = "";
    if (mobileTypeInput) mobileTypeInput.value = "";
  }
}
if (mobileTypeInput) {
  mobileTypeInput.addEventListener("input", () => {
    if (!(app.screen === "play" && app.state && app.state.riddle && app.state.riddle.mode === "typed" && !app.state.riddle.solved)) return;
    const cleaned = mobileTypeInput.value.toUpperCase().replace(/[^A-Z0-9 ]/g, "").slice(0, 18);
    if (mobileTypeInput.value !== cleaned) mobileTypeInput.value = cleaned;
    app.state.riddle.typedText = cleaned;
    sfx.play("blip");
  });
  mobileTypeInput.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.keyCode === 13) {
      e.preventDefault();
      submitTypedRiddleFromUI();
    }
  });
  mobileTypeInput.addEventListener("blur", () => setTimeout(resizeCanvas, 60));
}

window.addEventListener("keydown", e => {
  sfx.unlock();
  const code = e.code;

  if (mobileTypeInput && document.activeElement === mobileTypeInput) {
    if (code === "Escape") mobileTypeInput.blur();
    return;
  }

  if (app.rebindingAction) {
    e.preventDefault();
    progress.keys[app.rebindingAction] = code;
    saveProgress(progress);
    showToast(`REBOUND ${app.rebindingAction.toUpperCase()} -> ${code}`);
    app.rebindingAction = null;
    return;
  }

  // Typed riddle input capture on Play screen
  if (app.screen === "play" && app.state && app.state.riddle && app.state.riddle.mode === "typed" && !app.state.riddle.solved) {
    if (code === "Backspace") {
      e.preventDefault();
      app.state.riddle.typedText = app.state.riddle.typedText.slice(0, -1);
      return;
    }
    if (code === "Enter") {
      e.preventDefault();
      submitTypedRiddleFromUI();
      return;
    }
    if (e.key && e.key.length === 1 && /^[a-zA-Z0-9 ]$/.test(e.key)) {
      if (app.state.riddle.typedText.length < 18) {
        app.state.riddle.typedText += e.key.toUpperCase();
        sfx.play("blip");
      }
      return;
    }
  }

  if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown","Space","F9"].includes(code)) e.preventDefault();

  if (code === "F9") {
    if (e.shiftKey) {
      startLevel(app.currentLevelIndex, false);
      app.botWatch = { frames: expandSolution(LEVEL_SOLUTIONS[app.state.levelDef.id] || []), index: 0 };
      app.solverOverlay = null;
      showToast(`BOT PLAYING R${app.state.levelDef.id}...`);
    } else {
      app.solverOverlay = app.solverOverlay ? null : runAllSolvers();
    }
    return;
  }

  if (code === "Escape") {
    if (app.solverOverlay) { app.solverOverlay = null; return; }
    if (app.showClipPanel) { app.showClipPanel = false; return; }
    if (app.screen === "play") {
      openPauseMenu();
    } else if (app.screen === "pause") {
      app.screen = app.state ? "play" : "title";
    } else if (app.screen === "select" || app.screen === "shame") {
      app.screen = app.state ? "play" : "title";
    } else if (app.screen === "g2play" || app.screen === "g2select" || app.screen === "g2win") {
      app.screen = "title";
    }
    return;
  }

  if (app.screen === "g2play") {
    handleMindKeyDown(code, e.key);
    return;
  }

  if (code === "KeyO") { progress.bigDeathOverlay = !progress.bigDeathOverlay; saveProgress(progress); return; }
  if (code === "KeyC") { app.showClipPanel = !app.showClipPanel; return; }
  if (code === "KeyH") { app.screen = app.screen === "shame" ? (app.state ? "play" : "title") : "shame"; return; }
  if (code === "KeyV") { progress.streamerSafe = !progress.streamerSafe; saveProgress(progress); showToast(`SAFE MODE: ${progress.streamerSafe ? "ON" : "OFF"}`); return; }
  if (code === "KeyK") { progress.colorBlind = !progress.colorBlind; saveProgress(progress); showToast(`COLOR-BLIND SHAPES: ${progress.colorBlind ? "ON" : "OFF"}`); return; }
  if (code === "KeyL") { app.screen = app.screen === "select" ? (app.state ? "play" : "title") : "select"; return; }
  if (code === "KeyS" && app.screen === "play") { shareCurrentLevelCode(); return; }

  if (app.screen === "play") {
    if (matchesAction(code, "left")) app.keys.left = true;
    if (matchesAction(code, "right")) app.keys.right = true;
    if (matchesAction(code, "jump")) app.keys.jump = true;
    if (code === progress.keys.restart) { startLevel(app.currentLevelIndex, false); return; }
  }

  if (app.screen === "title" && (code === "Enter" || code === "Space")) startLevel(0, true);
  else if (app.screen === "victory" && (code === "Enter" || code === "Space" || code === "KeyR")) startLevel(0, true);
  else if (app.screen === "g2win" && (code === "Enter" || code === "Space" || code === "KeyR")) startMindLevel(0);
});

window.addEventListener("keyup", e => {
  if (matchesAction(e.code, "left")) app.keys.left = false;
  if (matchesAction(e.code, "right")) app.keys.right = false;
  if (matchesAction(e.code, "jump")) app.keys.jump = false;
});

// Touch & Mobile Landscape Orientation Engine
const stageEl = document.getElementById("stage");
const touchEl = document.getElementById("touch-controls");
const touchFsBtn = document.getElementById("btn-touch-fs");
function isTouchCapable() {
  return !!(app.hasTouch || (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) || (navigator.maxTouchPoints > 0 && Math.min(window.innerWidth, window.innerHeight) <= 900));
}
async function tryLockLandscape(withFullscreen = false) {
  try {
    if (withFullscreen && document.documentElement.requestFullscreen && !document.fullscreenElement) {
      await document.documentElement.requestFullscreen();
    }
    if (screen.orientation && screen.orientation.lock) {
      await screen.orientation.lock("landscape");
    }
  } catch (e) {}
  resizeCanvas();
}
window.addEventListener("touchstart", () => {
  sfx.unlock();
  app.hasTouch = true;
  if (touchFsBtn && document.documentElement.requestFullscreen) touchFsBtn.style.display = "flex";
  tryLockLandscape(false);
  resizeCanvas();
}, { passive: true, once: true });
function bindTouch(id, field) {
  const btn = document.getElementById(id);
  const set = v => { sfx.unlock(); app.touch[field] = v; btn.classList.toggle("pressed", v); };
  btn.addEventListener("touchstart", e => { e.preventDefault(); set(true); });
  btn.addEventListener("touchend", e => { e.preventDefault(); set(false); });
  btn.addEventListener("touchcancel", e => { e.preventDefault(); set(false); });
}
bindTouch("btn-left", "left"); bindTouch("btn-right", "right"); bindTouch("btn-jump", "jump");
const touchRestartBtn = document.getElementById("btn-touch-restart");
if (touchRestartBtn) touchRestartBtn.addEventListener("touchstart", e => { e.preventDefault(); if (app.screen === "play") startLevel(app.currentLevelIndex, false); });
if (touchFsBtn) {
  touchFsBtn.addEventListener("touchstart", e => { e.preventDefault(); tryLockLandscape(true); });
  touchFsBtn.addEventListener("click", () => tryLockLandscape(true));
}

const uiButtons = [];
function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  if (app.cssRotated90) {
    return {
      x: (e.clientY - rect.top) * (LOGICAL_W / Math.max(1, rect.height)),
      y: (rect.right - e.clientX) * (LOGICAL_H / Math.max(1, rect.width))
    };
  }
  return {
    x: (e.clientX - rect.left) * (LOGICAL_W / Math.max(1, rect.width)),
    y: (e.clientY - rect.top) * (LOGICAL_H / Math.max(1, rect.height))
  };
}
canvas.addEventListener("pointermove", e => {
  app.mouse = getCanvasCoords(e);
  if (app.screen === "g2play") handleMindPointerMove(app.mouse);
});
canvas.addEventListener("pointerdown", e => {
  sfx.unlock();
  if (e.pointerType === "touch") { app.hasTouch = true; resizeCanvas(); }
  const pt = getCanvasCoords(e);
  app.mouse = pt;
  for (let i = uiButtons.length - 1; i >= 0; i--) {
    const b = uiButtons[i];
    if (pt.x >= b.x && pt.x <= b.x + b.w && pt.y >= b.y && pt.y <= b.h + b.y) { b.onClick(); return; }
  }
  if (app.screen === "play" && app.state && app.state.riddle && app.state.riddle.mode === "typed" && !app.state.riddle.solved) {
    if (pt.x >= 50 && pt.x <= 910 && pt.y >= 46 && pt.y <= 134 && mobileTypeInput) {
      mobileTypeInput.value = app.state.riddle.typedText || "";
      mobileTypeInput.focus();
      return;
    }
  }
  if (app.screen === "g2play") handleMindPointerDown(pt);
});

function resizeCanvas() {
  if (mobileTypeInput && document.activeElement === mobileTypeInput) return;
  const rawW = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  const rawH = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  const mobile = isTouchCapable();
  if (document.body && document.body.classList) document.body.classList.toggle("touch-device", mobile);
  const forceRotate = mobile && rawH > rawW;
  app.cssRotated90 = forceRotate;
  stageEl.classList.toggle("landscape-forced", forceRotate);

  const landW = forceRotate ? rawH : rawW;
  const landH = forceRotate ? rawW : rawH;
  stageEl.style.width = `${Math.floor(landW)}px`;
  stageEl.style.height = `${Math.floor(landH)}px`;

  const pad = mobile ? 4 : 16;
  const vw = Math.max(240, landW - pad);
  const vh = Math.max(160, landH - pad);
  const s = Math.min(vw / LOGICAL_W, vh / LOGICAL_H);
  canvas.style.width = `${Math.floor(LOGICAL_W * s)}px`;
  canvas.style.height = `${Math.floor(LOGICAL_H * s)}px`;

  const tSize = Math.round(Math.max(44, Math.min(68, landH * 0.17)));
  stageEl.style.setProperty("--tbtn", `${tSize}px`);
  if (touchFsBtn && mobile && document.documentElement.requestFullscreen) {
    touchFsBtn.style.display = document.fullscreenElement ? "none" : "flex";
  }
}
window.addEventListener("resize", resizeCanvas);
window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 60));
document.addEventListener("fullscreenchange", () => setTimeout(resizeCanvas, 40));
if (window.visualViewport) window.visualViewport.addEventListener("resize", resizeCanvas);
resizeCanvas();

/* ============================================================================
 * 12. RENDERING (ATMOSPHERIC WATCHFUL EYE, JUICE, RESPONSIVE SCREENS)
 * ============================================================================ */
function addButton(x, y, w, h, label, onClick, bg = PAL.STONE, fg = PAL.WHITE, border = null, subLabel = null) {
  const hover = app.mouse.x >= x && app.mouse.x <= x + w && app.mouse.y >= y && app.mouse.y <= y + h;
  const fill = hover && bg === PAL.STONE ? PAL.STONE_HOVER : bg;
  ctx.save();
  ctx.fillStyle = fill;
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = hover ? PAL.GOLD : (border || PAL.BORDER);
  ctx.lineWidth = hover ? 2 : 1.5;
  ctx.strokeRect(x, y, w, h);
  ctx.restore();

  const textColor = (fg === PAL.BG) ? PAL.ACCENT_TEXT : (hover && fg === PAL.WHITE ? PAL.GOLD : fg);
  const subColor = (fg === PAL.BG) ? PAL.ACCENT_TEXT : PAL.MUTED;
  if (subLabel) {
    drawPixelText(ctx, label, x + w / 2, y + Math.floor(h * 0.2), 2, textColor, "center", null, w - 16);
    drawPixelText(ctx, subLabel, x + w / 2, y + Math.floor(h * 0.58), 1, subColor, "center", null, w - 16);
  } else {
    const scale = h >= 32 ? 2 : 1;
    const px = getCanvasFontSize(scale);
    const textY = y + Math.floor((h - px) / 2);
    drawPixelText(ctx, label, x + w / 2, textY, scale, textColor, "center", null, w - 12);
  }
  uiButtons.push({ x, y, w, h, onClick });
}

function drawAtmosphereAndEye(focusX, focusY, centerY = 235) {
  // Subtle perspective grid
  ctx.save();
  ctx.strokeStyle = PAL.STONE;
  ctx.globalAlpha = 0.16;
  ctx.lineWidth = 1;
  const off = progress.streamerSafe ? 0 : (app.uiTick * 0.35) % 40;
  for (let x = -40 + off; x < LOGICAL_W + 40; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, LOGICAL_H); ctx.stroke();
  }
  for (let y = 0; y < LOGICAL_H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(LOGICAL_W, y); ctx.stroke();
  }
  ctx.restore();

  // The Watchful Narrator Eye
  const ex = 480, ey = centerY;
  const dx = focusX - ex, dy = focusY - ey;
  const dist = Math.max(1, Math.hypot(dx, dy));
  const px = (dx / dist) * Math.min(18, dist * 0.06);
  const py = (dy / dist) * Math.min(10, dist * 0.06);
  const laughing = app.eyeMood === "laugh" && app.eyeMoodTicks > 0;
  const openH = laughing ? 12 : 34;

  ctx.save();
  ctx.globalAlpha = 0.22;
  ctx.strokeStyle = laughing ? PAL.CORAL : PAL.WHITE;
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(ex - 76, ey);
  ctx.quadraticCurveTo(ex, ey - openH * 1.4, ex + 76, ey);
  ctx.quadraticCurveTo(ex, ey + openH * 1.4, ex - 76, ey);
  ctx.closePath();
  ctx.fillStyle = PAL.STONE;
  ctx.fill();
  ctx.stroke();

  // Iris & Pupil tracking player/cursor
  ctx.fillStyle = laughing ? PAL.CORAL : PAL.GOLD;
  ctx.beginPath();
  ctx.arc(ex + px, ey + py, laughing ? 13 : 16, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = PAL.BG;
  ctx.beginPath();
  ctx.arc(ex + px * 1.15, ey + py * 1.15, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawSpike(x, y, dir, ratio) {
  const h = Math.round(16 * ratio);
  if (h <= 0) return;
  ctx.fillStyle = PAL.CORAL;
  ctx.beginPath();
  for (let i = 0; i < 2; i++) {
    if (dir === "^") { const bx = x + i * 15; ctx.moveTo(bx+1, y+TILE); ctx.lineTo(bx+7.5, y+TILE-h); ctx.lineTo(bx+14, y+TILE); }
    else if (dir === "v") { const bx = x + i * 15; ctx.moveTo(bx+1, y); ctx.lineTo(bx+7.5, y+h); ctx.lineTo(bx+14, y); }
    else if (dir === "<") { const by = y + i * 15; ctx.moveTo(x+TILE, by+1); ctx.lineTo(x+TILE-h, by+7.5); ctx.lineTo(x+TILE, by+14); }
    else if (dir === ">") { const by = y + i * 15; ctx.moveTo(x, by+1); ctx.lineTo(x+h, by+7.5); ctx.lineTo(x, by+14); }
  }
  ctx.closePath(); ctx.fill();
  if (progress.colorBlind) {
    ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 1; ctx.stroke();
  }
}

function drawDoor(x, y, w, h, isFake = false, label = null, hasShadow = false) {
  if (hasShadow) {
    ctx.save(); ctx.globalAlpha = 0.55; ctx.fillStyle = PAL.BG;
    ctx.fillRect(x - 2, y + h, w + 4, 6); ctx.restore();
  }
  ctx.fillStyle = isFake ? PAL.STONE : PAL.GOLD;
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = PAL.BG;
  ctx.fillRect(x + 4, y + 4, w - 8, h - 4);
  ctx.fillStyle = isFake ? PAL.CORAL : PAL.GOLD;
  ctx.fillRect(x + w - 8, y + Math.floor(h / 2), 3, 4);
  if (label) drawPixelText(ctx, label, x + w / 2, y - 14, 1, PAL.WHITE, "center");
}

function renderTiles(state) {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ch = state.grid[r][c];
      const x = c * TILE, y = r * TILE;
      if (ch === "#" || ch === "C" || ch === "F" || ch === "I" || ch === "B" || ch === "R") {
        const yOff = ch === "F" ? 1 : 0;
        if (state.levelDef.insideOut && r === 14) {
          ctx.save(); ctx.globalAlpha = 0.25; ctx.strokeStyle = PAL.STONE; ctx.strokeRect(x + 2, y + 2, TILE - 4, TILE - 4); ctx.restore();
          continue;
        }
        ctx.fillStyle = ch === "I" ? PAL.WHITE : PAL.STONE;
        if (ch === "I") { ctx.save(); ctx.globalAlpha = 0.35; ctx.fillRect(x, y, TILE, TILE); ctx.restore(); }
        else ctx.fillRect(x, y + yOff, TILE, TILE - yOff);

        if (ch === "B") {
          ctx.fillStyle = PAL.GOLD; ctx.fillRect(x + 2, y, TILE - 4, 5);
        } else if (ch === "R") {
          ctx.fillStyle = PAL.GOLD; ctx.fillRect(x + 4, y + 4, TILE - 8, 4);
        } else if (ch === "C") {
          ctx.fillStyle = PAL.BG; ctx.fillRect(x + 2, y + TILE - 2, TILE - 4, 2);
        } else if (ch === "F") {
          ctx.fillStyle = PAL.BG;
          ctx.fillRect(x + 11, y + 6, 2, 7); ctx.fillRect(x + 13, y + 13, 2, 6); ctx.fillRect(x + 15, y + 19, 2, 7);
          ctx.save(); ctx.globalAlpha = 0.3; ctx.fillStyle = PAL.GOLD; ctx.fillRect(x + 12, y + 12, 2, 2); ctx.restore();
        }
      } else if (ch === "G") {
        ctx.save(); ctx.globalAlpha = 0.35; ctx.strokeStyle = PAL.STONE; ctx.setLineDash([4,4]); ctx.lineWidth = 2; ctx.strokeRect(x+2,y+2,TILE-4,TILE-4); ctx.restore();
      } else if (ch === "N") {
        ctx.fillStyle = PAL.STONE;
        ctx.fillRect(x, y, TILE, 14); ctx.fillRect(x, y + 15, TILE, 15);
      } else if (ch === "H") {
        if (state.revealedHidden.has(`${c},${r}`) || app.pityActive) {
          ctx.fillStyle = PAL.STONE; ctx.fillRect(x, y, TILE, TILE);
          ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, TILE - 2, TILE - 2);
        } else {
          ctx.save(); ctx.globalAlpha = 0.22; ctx.fillStyle = PAL.WHITE;
          ctx.fillRect(x + 6, y + TILE - 2, TILE - 12, 2); ctx.restore();
        }
      } else if (ch === "L") {
        ctx.fillStyle = PAL.CORAL; ctx.fillRect(x + 11, y, 8, TILE);
      } else if (isSpikeChar(ch)) {
        drawSpike(x, y, ch, 1);
        if (app.pityActive) {
          const hb = getSpikeHitbox(c, r, ch, 1);
          if (hb) { ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 1; ctx.strokeRect(hb.x, hb.y, hb.w, hb.h); }
        }
      }
    }
  }
  if (state.levelDef.spikeSeamTells) {
    for (const t of state.levelDef.spikeSeamTells) {
      if (state.grid[t.row][t.col] === ".") {
        ctx.save(); ctx.globalAlpha = 0.6; ctx.fillStyle = PAL.CORAL;
        ctx.fillRect(t.col * TILE + 8, (t.row + 1) * TILE - 2, 3, 2);
        ctx.fillRect(t.col * TILE + 19, (t.row + 1) * TILE - 2, 3, 2);
        ctx.restore();
      }
    }
  }
  for (const ft of state.fallingTiles) {
    ctx.fillStyle = PAL.STONE; ctx.fillRect(ft.col * TILE, ft.row * TILE + ft.yOffset, TILE, TILE);
  }
  for (const sp of state.emergingSpikes) {
    if (sp.progress < sp.emergeTicks) drawSpike(sp.col * TILE, sp.row * TILE, sp.dir, sp.progress / sp.emergeTicks);
  }
}

function renderEntities(state, alpha) {
  // Fake UI background panels (World 2 #11, #12)
  if (state.levelDef.fakePanel) {
    const fp = state.levelDef.fakePanel;
    ctx.fillStyle = PAL.BG; ctx.fillRect(fp.x, fp.y, fp.w, fp.h);
    ctx.strokeStyle = fp.variant === "stacktrace" ? PAL.CORAL : PAL.WHITE;
    ctx.lineWidth = 2; ctx.strokeRect(fp.x, fp.y, fp.w, fp.h);
    if (fp.variant === "settings") {
      drawPixelText(ctx, "SETTINGS", fp.x + fp.w / 2, fp.y + 18, 3, PAL.GOLD, "center");
      drawPixelText(ctx, "MASTER VOLUME", fp.x + fp.w / 2, fp.y + 82, 2, PAL.WHITE, "center");
      ctx.fillStyle = PAL.STONE; ctx.fillRect(fp.x + 40, fp.y + 226, fp.w - 80, 6);
    } else if (fp.variant === "stacktrace") {
      drawPixelText(ctx, "UNCAUGHT TRUST_ERROR", fp.x + fp.w / 2, fp.y + 18, 2, PAL.CORAL, "center");
    }
  }

  if (state.levelDef.skidMarks) {
    ctx.save(); ctx.globalAlpha = 0.28; ctx.fillStyle = PAL.GOLD;
    for (const sm of state.levelDef.skidMarks) {
      ctx.fillRect(Math.min(sm.x1, sm.x2), sm.y, Math.max(4, Math.abs(sm.x2 - sm.x1)), 2);
    }
    ctx.restore();
  }

  for (const s of state.signs) {
    const sx = s.col * TILE, sy = s.row * TILE;
    const measuredW = String(s.text).length * 12 + 20;
    const sw = Math.max(s.w || 88, measuredW);
    const sh = Math.max(s.h || 28, 30);
    ctx.fillStyle = PAL.SURFACE; ctx.fillRect(sx - 4, sy - 4, sw, sh);
    ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 1.5; ctx.strokeRect(sx - 4, sy - 4, sw, sh);
    drawPixelText(ctx, s.text, sx - 4 + sw / 2, sy + 3, 2, PAL.WHITE, "center", (idx) => {
      if (s.crookedLast && idx === s.text.length - 1) return { dx: 0, dy: 2 };
      return { dx: 0, dy: 0 };
    });
    if (s.arrowDown) {
      ctx.fillStyle = PAL.WHITE;
      ctx.fillRect(sx + sw / 2 - 6, sy + sh - 2, 4, 12);
      ctx.fillRect(sx + sw / 2 - 10, sy + sh + 6, 12, 3);
      ctx.fillRect(sx + sw / 2 - 8, sy + sh + 9, 8, 3);
    }
  }

  for (const plat of state.platforms) {
    if (plat.hiddenBox) continue;
    const rx = plat.prevX + (plat.x - plat.prevX) * alpha;
    const ry = plat.prevY + (plat.y - plat.prevY) * alpha;
    if (plat.uiStyle === "loading") {
      ctx.fillStyle = PAL.STONE; ctx.fillRect(rx, ry, plat.w, plat.h);
      ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 1.5; ctx.strokeRect(rx, ry, plat.w, plat.h);
      ctx.fillStyle = PAL.GOLD; ctx.fillRect(rx, ry, plat.w, 3);
      const pct = Math.min(99, Math.floor((state.tick % 180) / 1.8));
      drawPixelText(ctx, `LOAD ${pct}%`, rx + plat.w / 2, ry + 5, 1, PAL.WHITE, "center", null, plat.w - 8);
    } else if (plat.uiStyle === "paused") {
      ctx.fillStyle = PAL.GOLD; ctx.fillRect(rx, ry, plat.w, plat.h);
      drawPixelText(ctx, "PAUSED BRIDGE", rx + plat.w / 2, ry + 3, 2, PAL.ACCENT_TEXT, "center", null, plat.w - 8);
    } else if (plat.uiStyle === "trace") {
      ctx.fillStyle = PAL.SURFACE; ctx.fillRect(rx, ry, plat.w, plat.h);
      ctx.fillStyle = PAL.GOLD; ctx.fillRect(rx, ry, plat.w, 3);
      drawPixelText(ctx, plat.label || "AT LINE", rx + plat.w / 2, ry + 4, 1, PAL.WHITE, "center", null, plat.w - 8);
    } else if (plat.uiStyle === "slider") {
      ctx.fillStyle = PAL.GOLD; ctx.fillRect(rx, ry, plat.w, plat.h);
      ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 1.5; ctx.strokeRect(rx, ry, plat.w, plat.h);
      drawPixelText(ctx, "VOL", rx + plat.w / 2, ry + 6, 2, PAL.ACCENT_TEXT, "center", null, plat.w - 8);
    } else {
      ctx.fillStyle = PAL.STONE; ctx.fillRect(rx, ry, plat.w, plat.h);
      ctx.fillStyle = PAL.GOLD; ctx.fillRect(rx, ry, plat.w, 3);
    }
  }

  for (const c of state.coins) {
    if (c.collected) continue;
    const bob = Math.sin(state.tick * 0.12) * 2.5;
    ctx.fillStyle = PAL.GOLD; ctx.beginPath(); ctx.arc(c.x, c.y + bob, 8, 0, Math.PI * 2); ctx.fill();
  }

  // Secret collectible (clean golden diamond)
  if (state.levelDef.secretLetter && !state.secretCollected) {
    const sl = state.levelDef.secretLetter;
    const cx = sl.col * TILE + 15;
    const cy = sl.row * TILE + 15 + Math.sin(state.tick * 0.1) * 2;
    ctx.save();
    ctx.fillStyle = PAL.GOLD;
    ctx.beginPath();
    ctx.moveTo(cx, cy - 8);
    ctx.lineTo(cx + 8, cy);
    ctx.lineTo(cx, cy + 8);
    ctx.lineTo(cx - 8, cy);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = PAL.WHITE;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }

  // Riddle UI & Pads
  if (state.riddle) {
    const rid = state.riddle;
    ctx.fillStyle = PAL.PANEL; ctx.fillRect(50, 48, 860, 74);
    ctx.strokeStyle = rid.solved ? PAL.GOLD : PAL.BORDER; ctx.lineWidth = 1.5; ctx.strokeRect(50, 48, 860, 74);
    const promptLines = drawWrappedText(ctx, rid.prompt, 480, 56, 828, 20, 16, PAL.GOLD, "center", "700");
    const subY = 56 + promptLines * 20 + 6;

    if (rid.mode === "typed") {
      const box = rid.solved ? "OPEN!" : ((rid.typedText || (isTouchCapable() ? "TAP TO TYPE" : "")) + (Math.floor(state.tick / 20) % 2 ? "_" : ""));
      drawPixelText(ctx, `TYPE ANSWER: [${box}]`, 480, subY, 2, PAL.WHITE, "center", null, 828);
    } else if (rid.mode === "idle") {
      const pct = Math.min(100, Math.floor((rid.idleTicks / (rid.idleTicksRequired || 240)) * 100));
      drawPixelText(ctx, rid.solved ? "DOOR OPEN!" : `STILLNESS: ${pct}%`, 480, subY, 2, PAL.WHITE, "center", null, 828);
    } else if (rid.mode === "pads") {
      if (rid.sequence.length === 4 && rid.pads[0].id === "1") {
        // Simon beacons at top
        const step = Math.floor(state.tick / 32) % 6;
        const activeId = step < 4 ? rid.sequence[step] : null;
        for (let i = 0; i < 4; i++) {
          const id = String(i + 1);
          const bx = 360 + i * 68;
          ctx.fillStyle = activeId === id ? PAL.GOLD : PAL.STONE;
          ctx.fillRect(bx, subY, 44, 24);
          drawPixelText(ctx, id, bx + 22, subY + 4, 2, activeId === id ? PAL.ACCENT_TEXT : PAL.WHITE, "center");
        }
      } else {
        drawPixelText(ctx, `PROGRESS: ${rid.padIndex}/${rid.sequence.length}`, 480, subY, 2, PAL.WHITE, "center");
      }
      for (let i = 0; i < rid.pads.length; i++) {
        const pad = rid.pads[i];
        const done = i < rid.padIndex && rid.sequence[i] === pad.id;
        ctx.fillStyle = done ? PAL.GOLD : PAL.STONE;
        ctx.fillRect(pad.col * TILE + 2, pad.row * TILE, TILE - 4, 8);
        ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 2;
        ctx.strokeRect(pad.col * TILE + 2, pad.row * TILE - 18, TILE - 4, 18);
        drawPixelText(ctx, pad.id, pad.col * TILE + TILE / 2, pad.row * TILE - 16, 1, PAL.GOLD, "center");
      }
    }
  }

  if (state.levelDef.mirrorX !== undefined) {
    ctx.save(); ctx.strokeStyle = PAL.GOLD; ctx.setLineDash([6, 6]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(state.levelDef.mirrorX, 40); ctx.lineTo(state.levelDef.mirrorX, LOGICAL_H - 30); ctx.stroke();
    ctx.restore();
  }
  for (const f of state.flags) {
    ctx.fillStyle = PAL.WHITE; ctx.fillRect(f.x - 1, f.y - 34, 3, 34);
    ctx.fillStyle = f.activated ? PAL.CORAL : PAL.GOLD;
    ctx.beginPath(); ctx.moveTo(f.x + 2, f.y - 34); ctx.lineTo(f.x + f.dir * 18, f.y - 26); ctx.lineTo(f.x + 2, f.y - 18); ctx.closePath(); ctx.fill();
  }
  if (state.levelDef.portals) {
    for (const pt of state.levelDef.portals) {
      const pColor = pt.color === "#FF3366" ? PAL.CORAL : (pt.color === "#FFB800" ? PAL.GOLD : (pt.color || PAL.GOLD));
      ctx.strokeStyle = pColor; ctx.lineWidth = 3;
      ctx.strokeRect(pt.x, pt.y, 24, 30);
    }
  }
  if (state.levelDef.magnets) {
    for (const mag of state.levelDef.magnets) {
      ctx.fillStyle = PAL.CORAL; ctx.fillRect(mag.x - 12, mag.y - 12, 24, 24);
      drawPixelText(ctx, "M", mag.x, mag.y - 8, 2, PAL.ACCENT_TEXT, "center");
    }
  }
  if (state.levelDef.rewindPad) {
    const rw = state.levelDef.rewindPad;
    ctx.fillStyle = PAL.GOLD; ctx.fillRect(rw.x, rw.y, rw.w, rw.h);
    drawPixelText(ctx, "<<", rw.x + rw.w / 2, rw.y + 7, 1, PAL.ACCENT_TEXT, "center");
  }
  if (state.windForce !== 0) {
    ctx.save(); ctx.globalAlpha = 0.4; ctx.fillStyle = PAL.WHITE;
    for (let i = 0; i < 6; i++) {
      const wx = ((i * 170 + state.tick * (state.windForce > 0 ? 4 : -4)) % LOGICAL_W + LOGICAL_W) % LOGICAL_W;
      ctx.fillRect(wx, 80 + i * 60, 26, 2);
    }
    ctx.restore();
  }
  if (state.levelDef.microButtons) {
    for (const b of state.levelDef.microButtons) {
      addButton(b.x, b.y, b.w, b.h, b.label, () => {
        stepSimulation(state, { left: false, right: false, jump: false, click: { id: b.id } }, app.persistStore);
      }, b.bg || PAL.STONE, b.fg || PAL.WHITE, PAL.GOLD);
    }
  }
  for (const h of state.hazards) {
    ctx.fillStyle = h.warning ? PAL.GOLD : (h.solidTop ? PAL.GOLD : PAL.CORAL);
    ctx.fillRect(Math.round(h.x), Math.round(h.y), h.w, h.h);
    if (h.label) drawPixelText(ctx, h.label, h.x + h.w / 2, h.y + 4, 1, PAL.ACCENT_TEXT, "center");
  }
  for (const npc of state.npcs) {
    if (!npc.alive) continue;
    ctx.fillStyle = npc.kind === "escort" ? PAL.GOLD : PAL.WHITE;
    ctx.fillRect(Math.round(npc.x), Math.round(npc.y), 18, 22);
  }
  if (state.ghostPos) {
    ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = state.levelDef.replayGhostHazard ? PAL.CORAL : PAL.GOLD;
    ctx.fillRect(Math.round(state.ghostPos.x), Math.round(state.ghostPos.y), state.player.w, state.player.h); ctx.restore();
  }

  if (state.levelDef.decoyDoors) {
    for (const d of state.levelDef.decoyDoors) {
      drawDoor(d.col * TILE + 3, d.row * TILE, 24, 30, false, d.label, d.shadow);
    }
  }
  if (state.levelDef.fakeExit) {
    drawDoor(state.levelDef.fakeExit.col * TILE + 3, state.levelDef.fakeExit.row * TILE, 24, 30, true);
  }
  if (!state.levelDef.exitDisabled) {
    ctx.save();
    if (state.levelDef.dimExit) ctx.globalAlpha = 0.35;
    // Subtle pulsing gold aura around real exit
    if (!state.exit.hiddenBehindHud && !progress.streamerSafe) {
      const pulse = 3 + Math.sin(state.tick * 0.12) * 2;
      ctx.save(); ctx.globalAlpha = 0.18; ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 2;
      ctx.strokeRect(state.exit.x - pulse, state.exit.y - pulse, state.exit.w + pulse * 2, state.exit.h + pulse * 2);
      ctx.restore();
    }
    drawDoor(state.exit.x, state.exit.y, state.exit.w, state.exit.h, false, state.exit.label, false);
    ctx.restore();
  }
  if (state.exit.hiddenBehindHud) {
    ctx.save(); ctx.globalAlpha = 0.65; ctx.fillStyle = PAL.GOLD; ctx.fillRect(state.exit.x + 4, 38, 16, 2); ctx.restore();
  }

  if (state.twin) {
    ctx.fillStyle = PAL.GOLD;
    ctx.fillRect(Math.round(state.twin.x), Math.round(state.twin.y), state.twin.w, state.twin.h);
  }
  if (state.levelDef.clones && state.posHistory.length >= 16) {
    ctx.save(); ctx.globalAlpha = 0.4; ctx.fillStyle = PAL.WHITE;
    const c1 = state.posHistory[Math.max(0, state.posHistory.length - 8)];
    const c2 = state.posHistory[Math.max(0, state.posHistory.length - 16)];
    ctx.fillRect(Math.round(c1.x), Math.round(c1.y), state.player.w, state.player.h);
    ctx.fillRect(Math.round(c2.x), Math.round(c2.y), state.player.w, state.player.h);
    ctx.restore();
  }

  if (!state.dead) {
    const p = state.player;
    // Subtle 2-frame motion trail
    if (!progress.streamerSafe && state.posHistory.length >= 6 && (Math.abs(p.vx) > 60 || Math.abs(p.vy) > 60)) {
      for (let t = 1; t <= 2; t++) {
        const tp = state.posHistory[state.posHistory.length - 1 - t * 2];
        if (tp) {
          ctx.save(); ctx.globalAlpha = 0.14 / t;
          ctx.fillStyle = state.reversedControls ? PAL.GOLD : PAL.WHITE;
          ctx.fillRect(Math.round(tp.x - 3), Math.round(tp.y - 2), Math.round(SPRITE_W * p.scale), Math.round(SPRITE_H * p.scale));
          ctx.restore();
        }
      }
    }
    const px = app.prevPlayerPos ? app.prevPlayerPos.x + (p.x - app.prevPlayerPos.x) * alpha : p.x;
    const py = app.prevPlayerPos ? app.prevPlayerPos.y + (p.y - app.prevPlayerPos.y) * alpha : p.y;
    const cx = px + p.w / 2, by = py + p.h;
    const dw = SPRITE_W * p.scale * p.squashX, dh = SPRITE_H * p.scale * p.squashY;
    ctx.fillStyle = state.reversedControls ? PAL.GOLD : PAL.WHITE;
    ctx.fillRect(Math.round(cx - dw / 2), Math.round(by - dh), Math.round(dw), Math.round(dh));
    ctx.fillStyle = PAL.BG;
    const eyeOff = p.facing * 3;
    ctx.fillRect(Math.round(cx + eyeOff - 4), Math.round(by - dh + 7), 3, 4);
    ctx.fillRect(Math.round(cx + eyeOff + 2), Math.round(by - dh + 7), 3, 4);
  }

  if (state.lavaY < LOGICAL_H) {
    ctx.fillStyle = PAL.CORAL; ctx.fillRect(0, state.lavaY, LOGICAL_W, LOGICAL_H - state.lavaY);
  }
  if (state.blackoutActive && state.sonarTimer === 0) {
    ctx.save();
    ctx.fillStyle = "rgba(15,14,23,0.96)";
    ctx.fillRect(0, 40, LOGICAL_W, LOGICAL_H - 68);
    // Light around player & past death spots
    ctx.globalCompositeOperation = "destination-out";
    ctx.fillStyle = "#000";
    ctx.beginPath(); ctx.arc(state.player.x + 8, state.player.y + 12, 54, 0, Math.PI * 2); ctx.fill();
    for (const ds of (app.persistStore.deathSpots || [])) {
      ctx.beginPath(); ctx.arc(ds.x + 8, ds.y + 12, 48, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
  if (state.levelDef.pityFog) {
    const fog = Math.max(0.1, 0.92 - (state.levelDeaths || 0) * 0.28);
    ctx.save(); ctx.globalAlpha = fog; ctx.fillStyle = PAL.BG; ctx.fillRect(0, 40, LOGICAL_W, LOGICAL_H - 68); ctx.restore();
  }

  for (const pt of app.particles) {
    ctx.save(); ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
    ctx.fillStyle = pt.color; ctx.fillRect(Math.round(pt.x), Math.round(pt.y), pt.size, pt.size); ctx.restore();
  }
}

function renderFakeUI(state) {
  if (!state.fakeUI) return;
  const f = state.fakeUI;
  ctx.save();
  if (f.variant === "complete") {
    ctx.globalAlpha = 0.92; ctx.fillStyle = PAL.PANEL; ctx.fillRect(210, 120, 540, 140);
    ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 3; ctx.strokeRect(210, 120, 540, 140);
    drawPixelText(ctx, "LEVEL COMPLETE!", 480, 148, 4, PAL.GOLD, "center", null, 500);
    drawPixelText(ctx, "TIME: 00.00S   ...OR IS IT?", 480, 198, 2, PAL.WHITE, "center", null, 500);
  } else if (f.variant === "fakeDeath") {
    ctx.globalAlpha = 0.9; ctx.fillStyle = PAL.PANEL; ctx.fillRect(220, 134, 520, 124);
    ctx.strokeStyle = PAL.CORAL; ctx.lineWidth = 3; ctx.strokeRect(220, 134, 520, 124);
    drawPixelText(ctx, "YOU DIED!", 480, 156, 5, PAL.CORAL, "center", null, 480);
    drawWrappedText(ctx, "RESPAWNING... WAIT WHY ARE YOU STILL MOVING?", 480, 212, 480, 18, 14, PAL.WHITE, "center");
  } else if (f.variant === "crash") {
    ctx.globalAlpha = 0.94; ctx.fillStyle = PAL.PANEL; ctx.fillRect(190, 118, 580, 150);
    ctx.strokeStyle = PAL.CORAL; ctx.lineWidth = 3; ctx.strokeRect(190, 118, 580, 150);
    drawPixelText(ctx, "FATAL EXCEPTION 0xDEAD", 480, 148, 3, PAL.CORAL, "center", null, 540);
    drawWrappedText(ctx, "PLAYER_SKILLS.DLL FAILED TO RESPOND", 480, 196, 540, 20, 16, PAL.WHITE, "center");
  }
  ctx.restore();
}

function renderHUD(state) {
  const def = state.levelDef;
  const dOverride = state.deathDisplayOverride;
  const shownLvlD = dOverride ? dOverride.value : state.levelDeaths;
  const shownTotD = dOverride ? dOverride.value : progress.totalDeaths;

  ctx.save();
  ctx.globalAlpha = dOverride ? 0.55 : 0.95;
  ctx.fillStyle = PAL.SURFACE; ctx.fillRect(8, 6, 304, 34);
  ctx.strokeStyle = PAL.BORDER; ctx.lineWidth = 1.5; ctx.strokeRect(8, 6, 304, 34);
  drawPixelText(ctx, `#${String(def.id).padStart(3,"0")} ${def.name}`, 20, 15, 2, PAL.GOLD, "left", null, 282);
  ctx.restore();

  ctx.fillStyle = PAL.SURFACE; ctx.fillRect(320, 6, 632, 34);
  ctx.strokeStyle = PAL.BORDER; ctx.lineWidth = 1.5; ctx.strokeRect(320, 6, 632, 34);
  drawPixelText(ctx, `Deaths: ${shownLvlD}`, 352, 15, 2, PAL.CORAL, "left", null, 130);

  addButton(786, 10, 76, 26, "RETRY", () => startLevel(app.currentLevelIndex, false), PAL.STONE, PAL.WHITE, PAL.BORDER);
  addButton(868, 10, 76, 26, "PAUSE", openPauseMenu, PAL.STONE, PAL.WHITE, PAL.BORDER);

  if (app.fakeAlertTicks > 0) {
    ctx.fillStyle = PAL.CORAL; ctx.fillRect(180, 48, 600, 36);
    ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 1.5; ctx.strokeRect(180, 48, 600, 36);
    drawPixelText(ctx, app.fakeAlertText, 480, 58, 2, PAL.ACCENT_TEXT, "center", null, 576);
  }

  ctx.fillStyle = PAL.SURFACE; ctx.fillRect(0, LOGICAL_H - 34, LOGICAL_W, 34);
  ctx.fillStyle = PAL.BORDER; ctx.fillRect(0, LOGICAL_H - 34, LOGICAL_W, 1);
  drawPixelText(ctx, state.narratorOverride || app.narratorText, 480, LOGICAL_H - 24, 2, PAL.WHITE, "center", null, isTouchCapable() ? 600 : 910);

  if (progress.bigDeathOverlay) {
    ctx.fillStyle = PAL.PANEL; ctx.fillRect(LOGICAL_W - 220, 48, 206, 84);
    ctx.strokeStyle = PAL.CORAL; ctx.lineWidth = 2; ctx.strokeRect(LOGICAL_W - 220, 48, 206, 84);
    drawPixelText(ctx, "DEATHS", LOGICAL_W - 117, 56, 2, PAL.WHITE, "center");
    drawPixelText(ctx, String(shownTotD), LOGICAL_W - 117, 84, 5, PAL.CORAL, "center");
  }
}

/* ============================================================================

const G2_ROASTS = [
  "ZERO HESITATION, ZERO THOUGHT.",

];

function startMindLevel(idx) {
  app.g2CurrentIdx = Math.max(0, Math.min(MIND_LEVELS.length - 1, idx));
  const def = MIND_LEVELS[app.g2CurrentIdx];
  const failsOnId = progress.g2Fails[def.id] || 0;
  app.g2 = {
    def,
    tick: 0,
    failTicks: 0,
    dodges: 0,
    decoyPos: { x: 340, y: 262, w: 280, h: 68 },
    targets: def.id === 4
      ? [
          { x: 190, y: 180, r: 28, gold: true, hit: false },
          { x: 770, y: 180, r: 28, gold: true, hit: false },
          { x: 210, y: 405, r: 28, gold: true, hit: false },
          { x: 740, y: 400, r: 28, gold: false, hit: false },
          { x: 480, y: 300, r: 28, gold: false, hit: false }
        ]
      : [
          { x: 200, y: 185, r: 28, gold: true, hit: false },
          { x: 760, y: 395, r: 28, gold: true, hit: false },
          { x: 740, y: 190, r: 28, gold: false, hit: false },
          { x: 220, y: 395, r: 28, gold: false, hit: false }
        ],
    simonSeq: [2, 0, 3, 1],
    simonInput: [],
    vol: 72,
    mutedIcon: false,
    clicks: 0,
    mashTrapActive: false,
    mashTrapPos: { x: 480, y: 350 },
    typedIdx: 0,
    oddIdx: (failsOnId * 5 + 6) % 16,
    phase: 0,
    phaseTick: 0,
    eyeHits: 0,
    invertedCursor: def.id === 4
  };
  app.screen = "g2play";
}

function failMindLevel(msg) {
  const g2 = app.g2;
  if (!g2 || g2.failTicks > 0) return;
  sfx.play("death");
  progress.g2TotalFails = (progress.g2TotalFails || 0) + 1;
  progress.g2Fails[g2.def.id] = (progress.g2Fails[g2.def.id] || 0) + 1;
  saveProgress(progress);
  app.trustScore = Math.max(-999, app.trustScore - 9);
  app.eyeMood = "laugh";
  app.eyeMoodTicks = 45;
  app.narratorText = msg || G2_ROASTS[progress.g2TotalFails % G2_ROASTS.length];
  if (!progress.streamerSafe) app.deathFlashTicks = 5;
  g2.failTicks = 14;
}

function winMindLevel() {
  const g2 = app.g2;
  if (!g2 || g2.failTicks > 0) return;
  sfx.play("riddleWin");
  progress.g2Cleared[g2.def.id] = true;
  saveProgress(progress);
  app.narratorText = `M${String(g2.def.id).padStart(2,"0")} CLEARED. DON'T GET COMFORTABLE.`;
  if (app.g2CurrentIdx + 1 < MIND_LEVELS.length) {
    startMindLevel(app.g2CurrentIdx + 1);
  } else {
    app.screen = "g2win";
  }
}

function tickMindGame() {
  const g2 = app.g2;
  if (!g2) return;
  if (g2.failTicks > 0) {
    g2.failTicks--;
    if (g2.failTicks === 0) startMindLevel(app.g2CurrentIdx);
    return;
  }
  g2.tick++;
  const id = g2.def.id;
  if (id === 2 && g2.tick >= 360) failMindLevel("TOO SLOW. STROOP FROZE YOUR BRAIN.");
  else if (id === 3 && g2.tick >= 240) winMindLevel();
  else if (id === 7 && g2.tick > 360) failMindLevel("YOU WATCHED THE WHOLE BAR EXPIRE.");
  else if (id === 10 && g2.tick >= 360) failMindLevel("OUT OF TIME. FINGERS TOO SLOW.");
  else if (id === 12 && g2.tick >= 270) failMindLevel("TIME EXPIRED. DATA IMAGINARY-WIPED.");
  else if (id === 16) {
    g2.phaseTick++;
    if (g2.phase === 1 && g2.phaseTick >= 120) {
      g2.phase = 2; g2.phaseTick = 0; g2.invertedCursor = true; sfx.play("flip");
    }
  }
}

function getInvertedMindPt(pt) {
  return {
    x: Math.max(18, Math.min(LOGICAL_W - 18, LOGICAL_W - pt.x)),
    y: Math.max(54, Math.min(LOGICAL_H - 42, LOGICAL_H - pt.y))
  };
}

function handleMindPointerMove(pt) {
  const g2 = app.g2;
  if (!g2 || g2.failTicks > 0) return;
  if (g2.def.id === 1 && g2.dodges < 3) {
    const b = g2.decoyPos;
    if (pt.x >= b.x && pt.x <= b.x + b.w && pt.y >= b.y && pt.y <= b.y + b.h) {
      const spots = [
        { x: 90, y: 220 },
        { x: 580, y: 345 },
        { x: 340, y: 262 }
      ];
      const next = spots[g2.dodges];
      g2.dodges++;
      g2.decoyPos = { x: next.x, y: next.y, w: 280, h: 68 };
      sfx.play("flip");
    }
  }
}

function handleMindKeyDown(code, key) {
  const g2 = app.g2;
  if (!g2 || g2.failTicks > 0) return;
  if (g2.def.id === 11 && key && key.length === 1 && /^[a-zA-Z]$/.test(key)) {
    const targetWord = "TRICK";
    const ch = key.toUpperCase();
    if (ch === targetWord[g2.typedIdx]) {
      g2.typedIdx++; sfx.play("blip");
      if (g2.typedIdx >= targetWord.length) winMindLevel();
    } else {
      failMindLevel("WRONG LETTER. ZERO MERCY.");
    }
    return;
  }
  if (code === "KeyR") { startMindLevel(app.g2CurrentIdx); return; }
  if (g2.def.id === 3 || (g2.def.id === 16 && g2.phase === 1)) {
    failMindLevel("EVEN THE KEYBOARD COUNTS AS TOUCHING.");
  }
}

function handleMindPointerDown(pt) {
  const g2 = app.g2;
  if (!g2 || g2.failTicks > 0) return;
  const id = g2.def.id;

  if (id === 1) {
    // True hitbox is the word "START" inside the prompt banner
    if (pt.x >= 244 && pt.x <= 338 && pt.y >= 56 && pt.y <= 104) {
      winMindLevel(); return;
    }
    const b = g2.decoyPos;
    if (pt.x >= b.x && pt.x <= b.x + b.w && pt.y >= b.y && pt.y <= b.y + b.h) {
      failMindLevel("YOU REALLY BELIEVED A FLEEING BUTTON.");
    }
    return;
  }

  if (id === 2) {
    const shift = Math.floor(g2.tick / 50) % 4;
    for (let slot = 0; slot < 4; slot++) {
      const cardIdx = (slot + shift) % 4;
      const col = slot % 2, row = Math.floor(slot / 2);
      const bx = 220 + col * 270, by = 186 + row * 124;
      if (pt.x >= bx && pt.x <= bx + 240 && pt.y >= by && pt.y <= by + 98) {
        if (cardIdx === 0) winMindLevel();
        else failMindLevel("READ THE INK COLOR, NOT THE TEXT.");
        return;
      }
    }
    return;
  }

  if (id === 3) {
    failMindLevel("YOU CLICKED. I LITERALLY SAID DON'T TOUCH.");
    return;
  }

  if (id === 4) {
    const ip = getInvertedMindPt(pt);
    for (const t of g2.targets) {
      if (t.hit) continue;
      if (Math.hypot(ip.x - t.x, ip.y - t.y) <= t.r + 8) {
        if (!t.gold) { failMindLevel("THAT WAS A CORAL BOMB ON THE INVERTED SIDE."); return; }
        t.hit = true; sfx.play("bounce");
        if (g2.targets.filter(x => x.gold && !x.hit).length === 0) winMindLevel();
        return;
      }
    }
    return;
  }

  if (id === 5) {
    const choices = [4, 5, 6, 7];
    for (let i = 0; i < 4; i++) {
      const bx = 170 + i * 160, by = 365;
      if (pt.x >= bx && pt.x <= bx + 130 && pt.y >= by && pt.y <= by + 62) {
        if (choices[i] === 7) winMindLevel();
        else failMindLevel("CHECK THE BORDERS. NEVER ASSUME IT'S SIMPLE.");
        return;
      }
    }
    return;
  }

  if (id === 6) {
    if (g2.tick < 140) { failMindLevel("WAIT UNTIL THE FLASHES FINISH."); return; }
    for (let i = 0; i < 4; i++) {
      const bx = 140 + i * 175, by = 220;
      if (pt.x >= bx && pt.x <= bx + 145 && pt.y >= by && pt.y <= by + 135) {
        const expected = g2.simonSeq[3 - g2.simonInput.length];
        if (i === expected) {
          g2.simonInput.push(i); sfx.play("blip");
          if (g2.simonInput.length === 4) winMindLevel();
        } else {
          failMindLevel("REVERSE ORDER! WHY DID YOU LISTEN TO THE BANNER?");
        }
        return;
      }
    }
    return;
  }

  if (id === 7) {
    if (pt.x >= 330 && pt.x <= 630 && pt.y >= 324 && pt.y <= 394) {
      if (g2.tick >= 240 && g2.tick <= 300) winMindLevel();
      else failMindLevel(`STOPPED AT ${(g2.tick / 60).toFixed(2)}S REAL TIME. TRICKED BY THE DIGITS.`);
    }
    return;
  }

  if (id === 8) {
    for (let i = 0; i < 3; i++) {
      const bx = 100 + i * 265, by = 205;
      if (pt.x >= bx && pt.x <= bx + 230 && pt.y >= by && pt.y <= by + 185) {
        if (i === 0) winMindLevel();
        else failMindLevel("PURE LOGIC CHECK FAILED.");
        return;
      }
    }
    return;
  }

  if (id === 9) {
    // Speaker mute icon
    if (pt.x >= 205 && pt.x <= 265 && pt.y >= 225 && pt.y <= 285) {
      g2.vol = 0; g2.mutedIcon = true; sfx.play("blip"); return;
    }
    // Slider track refuses to drop below 1%
    if (pt.x >= 280 && pt.x <= 720 && pt.y >= 225 && pt.y <= 285) {
      const pct = Math.round(((pt.x - 280) / 440) * 100);
      g2.vol = Math.max(1, Math.min(100, pct));
      g2.mutedIcon = false;
      sfx.play("trap");
      return;
    }
    if (pt.x >= 335 && pt.x <= 625 && pt.y >= 346 && pt.y <= 410) {
      if (g2.vol === 0 && g2.mutedIcon) winMindLevel();
      else failMindLevel(`${g2.vol}% IS STILL NOT ZERO. TRY HARDER.`);
    }
    return;
  }

  if (id === 10) {
    const spots = [
      { x: 480, y: 270 }, { x: 480, y: 270 }, { x: 480, y: 270 }, { x: 480, y: 270 },
      { x: 220, y: 220 }, { x: 740, y: 220 }, { x: 480, y: 350 }, { x: 195, y: 175 }
    ];
    if (g2.mashTrapActive && Math.hypot(pt.x - g2.mashTrapPos.x, pt.y - g2.mashTrapPos.y) <= 52) {
      failMindLevel("CLASSIC CLICK-MASHER. SPAWNED RIGHT UNDER YOUR FINGER.");
      return;
    }
    const cur = spots[Math.min(7, g2.clicks)];
    if (Math.hypot(pt.x - cur.x, pt.y - cur.y) <= 50) {
      g2.clicks++; sfx.play("blip");
      if (g2.clicks === 7) {
        g2.mashTrapActive = true;
        g2.mashTrapPos = { x: cur.x, y: cur.y };
      } else if (g2.clicks >= 8) {
        winMindLevel();
      }
    }
    return;
  }

  if (id === 11) {
    const perms = [
      [0,1,2,3,4,5],
      [4,2,5,0,3,1],
      [3,5,1,4,0,2],
      [2,0,4,5,1,3],
      [5,3,0,2,4,1]
    ];
    const letters = ["T", "R", "I", "C", "K", "X"];
    const p = perms[g2.typedIdx % perms.length];
    for (let slot = 0; slot < 6; slot++) {
      const col = slot % 3, row = Math.floor(slot / 3);
      const bx = 264 + col * 150, by = 230 + row * 94;
      if (pt.x >= bx && pt.x <= bx + 132 && pt.y >= by && pt.y <= by + 74) {
        const letter = letters[p[slot]];
        if (letter === "TRICK"[g2.typedIdx]) {
          g2.typedIdx++; sfx.play("blip");
          if (g2.typedIdx >= 5) winMindLevel();
        } else {
          failMindLevel("MUSCLE MEMORY BETRAYED YOU.");
        }
        return;
      }
    }
    return;
  }

  if (id === 12) {
    // Top-right [X] close button
    if (pt.x >= 722 && pt.x <= 764 && pt.y >= 124 && pt.y <= 166) {
      winMindLevel(); return;
    }
    if ((pt.x >= 220 && pt.x <= 460 && pt.y >= 336 && pt.y <= 394) ||
        (pt.x >= 500 && pt.x <= 740 && pt.y >= 336 && pt.y <= 394)) {
      failMindLevel("BOTH BOTTOM BUTTONS WERE RIGGED FROM THE START.");
    }
    return;
  }

  if (id === 13) {
    const circles = [
      { x: 250, y: 285, r: 42, win: true },
      { x: 515, y: 285, r: 34, win: false },
      { x: 745, y: 225, r: 31, win: false },
      { x: 745, y: 385, r: 26, win: false }
    ];
    for (const c of circles) {
      if (Math.hypot(pt.x - c.x, pt.y - c.y) <= c.r + 6) {
        if (c.win) winMindLevel();
        else failMindLevel("SCAMMED BY AN OPTICAL ILLUSION.");
        return;
      }
    }
    return;
  }

  if (id === 14) {
    // Right 4x4 grid
    for (let idx = 0; idx < 16; idx++) {
      const col = idx % 4, row = Math.floor(idx / 4);
      const bx = 576 + col * 62, by = 180 + row * 62;
      if (pt.x >= bx && pt.x <= bx + 54 && pt.y >= by && pt.y <= by + 54) {
        if (idx === g2.oddIdx) winMindLevel();
        else failMindLevel("THAT TILE MATCHED. LOOK CLOSER AT THE RIGHT GRID.");
        return;
      }
    }
    return;
  }

  if (id === 15) {
    if (Math.hypot(pt.x - 480, pt.y - 210) <= 38) {
      winMindLevel(); return;
    }
    if ((pt.x >= 165 && pt.x <= 445 && pt.y >= 330 && pt.y <= 406) ||
        (pt.x >= 515 && pt.x <= 795 && pt.y >= 330 && pt.y <= 406)) {
      failMindLevel("I SAID DO NOT CLICK EITHER BUTTON.");
    }
    return;
  }

  if (id === 16) {
    if (g2.phase === 0) {
      const opts = [
        { text: "CORAL", color: PAL.WHITE, win: false },
        { text: "GOLD", color: PAL.CORAL, win: true },
        { text: "WHITE", color: PAL.GOLD, win: false }
      ];
      for (let i = 0; i < 3; i++) {
        const bx = 175 + i * 210, by = 250;
        if (pt.x >= bx && pt.x <= bx + 185 && pt.y >= by && pt.y <= by + 84) {
          if (opts[i].win) { g2.phase = 1; g2.phaseTick = 0; sfx.play("blip"); }
          else failMindLevel("PHASE 1 FAILED: CLICK CORAL INK.");
          return;
        }
      }
    } else if (g2.phase === 1) {
      failMindLevel("PHASE 2 FAILED: DO NOT TOUCH!");
    } else if (g2.phase === 2) {
      const ip = getInvertedMindPt(pt);
      for (const t of g2.targets) {
        if (t.hit) continue;
        if (Math.hypot(ip.x - t.x, ip.y - t.y) <= t.r + 8) {
          if (!t.gold) { failMindLevel("PHASE 3 FAILED: HIT INVERTED BOMB."); return; }
          t.hit = true; sfx.play("bounce");
          if (g2.targets.filter(x => x.gold && !x.hit).length === 0) {
            g2.phase = 3; g2.phaseTick = 0; g2.invertedCursor = false; sfx.play("flip");
          }
          return;
        }
      }
    } else if (g2.phase === 3) {
      const ex = 480 + Math.sin(g2.phaseTick * 0.065) * 210;
      const ey = 265 + Math.cos(g2.phaseTick * 0.085) * 70;
      if (Math.hypot(pt.x - ex, pt.y - ey) <= 44) {
        g2.eyeHits++; sfx.play("bounce");
        if (g2.eyeHits >= 3) winMindLevel();
      }
    }
  }
}

function renderMindGame() {
  const g2 = app.g2;
  if (!g2) return;
  const id = g2.def.id;
  ctx.fillStyle = PAL.BG; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);

  // Subtle background + Watchful Eye (hidden on M15/M16p3 so dedicated playable Eye shines)
  if (id !== 15 && !(id === 16 && g2.phase === 3)) {
    drawAtmosphereAndEye(app.mouse.x, app.mouse.y, 295);
  }

  // Top HUD Bar (minimal)
  ctx.fillStyle = PAL.SURFACE; ctx.fillRect(8, 6, 330, 34);
  ctx.strokeStyle = PAL.BORDER; ctx.lineWidth = 1.5; ctx.strokeRect(8, 6, 330, 34);
  drawPixelText(ctx, `M${String(id).padStart(2,"0")} ${g2.def.name}`, 20, 15, 2, PAL.GOLD, "left", null, 306);

  ctx.fillStyle = PAL.SURFACE; ctx.fillRect(346, 6, 606, 34);
  ctx.strokeStyle = PAL.BORDER; ctx.lineWidth = 1.5; ctx.strokeRect(346, 6, 606, 34);
  drawPixelText(ctx, `Fails: ${progress.g2Fails[id] || 0}`, 362, 15, 2, PAL.CORAL, "left");

  addButton(786, 10, 76, 26, "RETRY", () => startMindLevel(app.g2CurrentIdx), PAL.STONE, PAL.WHITE, PAL.BORDER);
  addButton(868, 10, 76, 26, "MENU", () => { app.screen = "title"; }, PAL.STONE, PAL.WHITE, PAL.BORDER);

  // Prompt Banner (M01 embeds clickable "START" inside the sentence itself)
  ctx.fillStyle = PAL.SURFACE; ctx.fillRect(60, 56, 840, 46);
  ctx.strokeStyle = PAL.BORDER; ctx.lineWidth = 1.5; ctx.strokeRect(60, 56, 840, 46);
  if (id === 1) {
    const startW = 58;
    drawPixelText(ctx, 'CLICK "', 254, 71, 2, PAL.WHITE, "right");
    drawPixelText(ctx, "START", 258, 71, 2, PAL.GOLD, "left");
    drawPixelText(ctx, '" TO PROVE YOU ARE HUMAN', 258 + startW + 4, 71, 2, PAL.WHITE, "left");
  } else {
    drawPixelText(ctx, g2.def.prompt, 480, 71, 2, PAL.WHITE, "center", null, 816);
  }

  // Stage-specific rendering
  if (id === 1) {
    const b = g2.decoyPos;
    const lbl = g2.dodges >= 3 ? "OK FINE, CLICK ME" : (g2.dodges > 0 ? "TOO SLOW LOL" : "START");
    ctx.fillStyle = g2.dodges >= 3 ? PAL.CORAL : PAL.GOLD;
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 2; ctx.strokeRect(b.x, b.y, b.w, b.h);
    drawPixelText(ctx, lbl, b.x + b.w / 2, b.y + 26, 2, PAL.ACCENT_TEXT, "center", null, b.w - 16);
  } else if (id === 2) {
    const pct = Math.max(0, 1 - g2.tick / 360);
    ctx.fillStyle = PAL.STONE; ctx.fillRect(220, 126, 520, 14);
    ctx.fillStyle = pct < 0.3 ? PAL.CORAL : PAL.GOLD; ctx.fillRect(220, 126, Math.round(520 * pct), 14);
    const cards = [
      { word: "WHITE", ink: PAL.GOLD },
      { word: "GOLD",  ink: PAL.CORAL },
      { word: "CORAL", ink: PAL.WHITE },
      { word: "STONE", ink: PAL.MUTED }
    ];
    const shift = Math.floor(g2.tick / 50) % 4;
    for (let slot = 0; slot < 4; slot++) {
      const c = cards[(slot + shift) % 4];
      const col = slot % 2, row = Math.floor(slot / 2);
      const bx = 220 + col * 270, by = 186 + row * 124;
      ctx.fillStyle = PAL.STONE; ctx.fillRect(bx, by, 240, 98);
      ctx.strokeStyle = PAL.BORDER; ctx.lineWidth = 2; ctx.strokeRect(bx, by, 240, 98);
      drawPixelText(ctx, c.word, bx + 120, by + 35, 4, c.ink, "center");
    }
  } else if (id === 3) {
    const pct = Math.min(1, g2.tick / 240);
    ctx.fillStyle = PAL.STONE; ctx.fillRect(220, 132, 520, 14);
    ctx.fillStyle = PAL.GOLD; ctx.fillRect(220, 132, Math.round(520 * pct), 14);
    if (g2.tick >= 45) {
      ctx.fillStyle = PAL.CORAL; ctx.fillRect(290, 210, 380, 96);
      ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 2; ctx.strokeRect(290, 210, 380, 96);
      drawPixelText(ctx, "AFK TIMEOUT! CLICK TO ABORT!", 480, 232, 2, PAL.ACCENT_TEXT, "center", null, 360);
      drawPixelText(ctx, "[ ABORT WIPE ]", 480, 264, 3, PAL.ACCENT_TEXT, "center");
    }
    if (g2.tick >= 120) {
      const bx = 120 + ((g2.tick * 4) % 520);
      ctx.fillStyle = PAL.GOLD; ctx.fillRect(bx, 355, 220, 46);
      drawPixelText(ctx, "FREE SKIP ->", bx + 110, 370, 2, PAL.ACCENT_TEXT, "center");
    }
  } else if (id === 4) {
    for (const t of g2.targets) {
      if (t.hit) continue;
      ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
      ctx.fillStyle = t.gold ? PAL.GOLD : PAL.CORAL; ctx.fill();
      ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 2.5; ctx.stroke();
      drawPixelText(ctx, t.gold ? "HIT" : "BOMB", t.x, t.y - 7, 1, PAL.ACCENT_TEXT, "center");
    }
    const ip = getInvertedMindPt(app.mouse);
    ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ip.x, ip.y, 12, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ip.x - 18, ip.y); ctx.lineTo(ip.x + 18, ip.y);
    ctx.moveTo(ip.x, ip.y - 18); ctx.lineTo(ip.x, ip.y + 18); ctx.stroke();
  } else if (id === 5) {
    // Exact 7 Coral spikes across screen: 4 center, 1 badge-left, 2 border-right
    ctx.fillStyle = PAL.STONE; ctx.fillRect(300, 165, 360, 140);
    ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 2; ctx.strokeRect(300, 165, 360, 140);
    for (let i = 0; i < 4; i++) drawSpike(355 + i * 70, 225, "^", 1.1);
    drawSpike(80, 128, "^", 0.9);
    drawSpike(820, 130, "^", 0.9);
    drawSpike(852, 130, "^", 0.9);
    const choices = [4, 5, 6, 7];
    for (let i = 0; i < 4; i++) {
      const bx = 170 + i * 160, by = 365;
      ctx.fillStyle = PAL.STONE; ctx.fillRect(bx, by, 130, 62);
      ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 2; ctx.strokeRect(bx, by, 130, 62);
      drawPixelText(ctx, String(choices[i]), bx + 65, by + 19, 3, PAL.WHITE, "center");
    }
  } else if (id === 6) {
    let activePad = -1;
    if (g2.tick >= 15 && g2.tick < 40) activePad = g2.simonSeq[0];
    else if (g2.tick >= 45 && g2.tick < 70) activePad = g2.simonSeq[1];
    else if (g2.tick >= 75 && g2.tick < 100) activePad = g2.simonSeq[2];
    else if (g2.tick >= 105 && g2.tick < 130) activePad = g2.simonSeq[3];
    if (g2.tick >= 140) {
      drawPixelText(ctx, "QUICK! CLICK PAD #3 FIRST!", 480, 142, 2, PAL.CORAL, "center");
    } else {
      drawPixelText(ctx, "MEMORIZE...", 480, 142, 2, PAL.GOLD, "center");
    }
    for (let i = 0; i < 4; i++) {
      const bx = 140 + i * 175, by = 220;
      const lit = activePad === i;
      ctx.fillStyle = lit ? PAL.GOLD : PAL.STONE;
      ctx.fillRect(bx, by, 145, 135);
      ctx.strokeStyle = lit ? PAL.WHITE : PAL.GOLD; ctx.lineWidth = 3; ctx.strokeRect(bx, by, 145, 135);
      drawPixelText(ctx, `#${i + 1}`, bx + 72, by + 50, 4, lit ? PAL.ACCENT_TEXT : PAL.WHITE, "center");
    }
    drawPixelText(ctx, `ENTERED: ${g2.simonInput.length}/4`, 480, 392, 2, PAL.WHITE, "center");
  } else if (id === 7) {
    // Lying digital readout vs honest bar
    let fakeStr = (g2.tick / 60).toFixed(2) + "S";
    if (g2.tick >= 95 && g2.tick < 140) fakeStr = "4.42S";
    else if (g2.tick >= 155 && g2.tick < 200) fakeStr = "4.91S";
    drawPixelText(ctx, fakeStr, 480, 142, 6, PAL.CORAL, "center");
    const pct = Math.min(1, g2.tick / 360);
    ctx.fillStyle = PAL.STONE; ctx.fillRect(180, 232, 600, 34);
    ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 2; ctx.strokeRect(180, 232, 600, 34);
    ctx.fillStyle = PAL.GOLD; ctx.fillRect(182, 234, Math.round(596 * pct), 30);
    for (let s = 1; s < 6; s++) {
      const mx = 180 + (600 * s) / 6;
      ctx.fillStyle = PAL.WHITE; ctx.fillRect(mx - 1, 266, 2, 10);
    }
    ctx.fillStyle = PAL.GOLD; ctx.fillRect(330, 324, 300, 70);
    ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 3; ctx.strokeRect(330, 324, 300, 70);
    drawPixelText(ctx, "STOP CLOCK", 480, 347, 3, PAL.ACCENT_TEXT, "center");
  } else if (id === 8) {
    const boxes = [
      { title: "BOX A", line: "SAFE IS A OR C" },
      { title: "BOX B", line: "A IS A BOMB" },
      { title: "BOX C", line: "BOX B IS SAFE" }
    ];
    for (let i = 0; i < 3; i++) {
      const bx = 100 + i * 265, by = 205;
      ctx.fillStyle = PAL.STONE; ctx.fillRect(bx, by, 230, 185);
      ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 3; ctx.strokeRect(bx, by, 230, 185);
      drawPixelText(ctx, boxes[i].title, bx + 115, by + 32, 3, PAL.GOLD, "center");
      drawPixelText(ctx, boxes[i].line, bx + 115, by + 102, 2, PAL.WHITE, "center", null, 210);
    }
  } else if (id === 9) {
    // Speaker icon + slider stuck at 1%
    ctx.fillStyle = g2.mutedIcon ? PAL.GOLD : PAL.STONE;
    ctx.fillRect(205, 225, 60, 60);
    ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 2; ctx.strokeRect(205, 225, 60, 60);
    drawPixelText(ctx, g2.mutedIcon ? "X" : "VOL", 235, 247, 2, g2.mutedIcon ? PAL.ACCENT_TEXT : PAL.CORAL, "center");
    ctx.fillStyle = PAL.STONE; ctx.fillRect(280, 246, 440, 18);
    ctx.fillStyle = g2.vol === 0 ? PAL.GOLD : PAL.CORAL;
    ctx.fillRect(280, 246, Math.round(440 * (g2.vol / 100)), 18);
    const kx = 280 + Math.round(440 * (g2.vol / 100));
    ctx.fillStyle = PAL.WHITE; ctx.fillRect(kx - 8, 234, 16, 42);
    drawPixelText(ctx, `${g2.vol}%`, 755, 245, 3, g2.vol === 0 ? PAL.GOLD : PAL.CORAL, "left");
    ctx.fillStyle = g2.mutedIcon ? PAL.GOLD : PAL.STONE;
    ctx.fillRect(335, 346, 290, 64);
    ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 2; ctx.strokeRect(335, 346, 290, 64);
    drawPixelText(ctx, "CONFIRM MUTE", 480, 368, 2, g2.mutedIcon ? PAL.ACCENT_TEXT : PAL.WHITE, "center");
  } else if (id === 10) {
    const pct = Math.max(0, 1 - g2.tick / 360);
    ctx.fillStyle = PAL.STONE; ctx.fillRect(220, 120, 520, 14);
    ctx.fillStyle = PAL.GOLD; ctx.fillRect(220, 120, Math.round(520 * pct), 14);
    const spots = [
      { x: 480, y: 270 }, { x: 480, y: 270 }, { x: 480, y: 270 }, { x: 480, y: 270 },
      { x: 220, y: 220 }, { x: 740, y: 220 }, { x: 480, y: 350 }, { x: 195, y: 175 }
    ];
    const cur = spots[Math.min(7, g2.clicks)];
    ctx.beginPath(); ctx.arc(cur.x, cur.y, 44, 0, Math.PI * 2);
    ctx.fillStyle = PAL.GOLD; ctx.fill();
    ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 3; ctx.stroke();
    drawPixelText(ctx, `${g2.clicks}/8`, cur.x, cur.y - 10, 3, PAL.ACCENT_TEXT, "center");
    if (g2.mashTrapActive) {
      ctx.beginPath(); ctx.arc(g2.mashTrapPos.x, g2.mashTrapPos.y, 46, 0, Math.PI * 2);
      ctx.fillStyle = PAL.CORAL; ctx.fill();
      ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 3; ctx.stroke();
      drawPixelText(ctx, "8/8 DONE!", g2.mashTrapPos.x, g2.mashTrapPos.y - 8, 2, PAL.ACCENT_TEXT, "center");
    }
  } else if (id === 11) {
    const shown = "TRICK".split("").map((ch, idx) => idx < g2.typedIdx ? ch : "_").join(" ");
    drawPixelText(ctx, shown, 480, 146, 5, PAL.GOLD, "center");
    const perms = [
      [0,1,2,3,4,5], [4,2,5,0,3,1], [3,5,1,4,0,2], [2,0,4,5,1,3], [5,3,0,2,4,1]
    ];
    const letters = ["T", "R", "I", "C", "K", "X"];
    const p = perms[g2.typedIdx % perms.length];
    for (let slot = 0; slot < 6; slot++) {
      const col = slot % 3, row = Math.floor(slot / 3);
      const bx = 264 + col * 150, by = 230 + row * 94;
      ctx.fillStyle = PAL.STONE; ctx.fillRect(bx, by, 132, 74);
      ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 2; ctx.strokeRect(bx, by, 132, 74);
      drawPixelText(ctx, letters[p[slot]], bx + 66, by + 23, 4, PAL.GOLD, "center");
    }
  } else if (id === 12) {
    ctx.fillStyle = PAL.STONE; ctx.fillRect(190, 118, 580, 300);
    ctx.strokeStyle = PAL.CORAL; ctx.lineWidth = 4; ctx.strokeRect(190, 118, 580, 300);
    ctx.fillStyle = PAL.CORAL; ctx.fillRect(722, 124, 38, 38);
    drawPixelText(ctx, "X", 741, 134, 2, PAL.ACCENT_TEXT, "center");
    drawPixelText(ctx, `WIPING SAVE DATA IN ${Math.max(0, (270 - g2.tick) / 60).toFixed(1)}S`, 480, 196, 3, PAL.CORAL, "center", null, 540);
    const swapped = g2.tick >= 75;
    ctx.fillStyle = swapped ? PAL.CORAL : PAL.GOLD; ctx.fillRect(220, 336, 240, 58);
    drawPixelText(ctx, swapped ? "DELETE ALL" : "CANCEL WIPE", 340, 356, 2, PAL.ACCENT_TEXT, "center");
    ctx.fillStyle = swapped ? PAL.GOLD : PAL.CORAL; ctx.fillRect(500, 336, 240, 58);
    drawPixelText(ctx, swapped ? "CANCEL WIPE" : "DELETE ALL", 620, 356, 2, PAL.ACCENT_TEXT, "center");
  } else if (id === 13) {
    // Ebbinghaus illusion
    for (let a = 0; a < 6; a++) {
      const ang = (Math.PI * 2 * a) / 6;
      ctx.beginPath(); ctx.arc(250 + Math.cos(ang) * 84, 285 + Math.sin(ang) * 84, 28, 0, Math.PI * 2);
      ctx.fillStyle = PAL.STONE; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(250, 285, 42, 0, Math.PI * 2); ctx.fillStyle = PAL.GOLD; ctx.fill();

    for (let a = 0; a < 8; a++) {
      const ang = (Math.PI * 2 * a) / 8;
      ctx.beginPath(); ctx.arc(515 + Math.cos(ang) * 52, 285 + Math.sin(ang) * 52, 6, 0, Math.PI * 2);
      ctx.fillStyle = PAL.WHITE; ctx.fill();
    }
    ctx.beginPath(); ctx.arc(515, 285, 34, 0, Math.PI * 2); ctx.fillStyle = PAL.CORAL; ctx.fill();

    ctx.beginPath(); ctx.arc(745, 225, 56, 0, Math.PI * 2); ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 3; ctx.stroke();
    ctx.beginPath(); ctx.arc(745, 225, 31, 0, Math.PI * 2); ctx.fillStyle = PAL.WHITE; ctx.fill();

    ctx.beginPath(); ctx.arc(745, 385, 26, 0, Math.PI * 2); ctx.fillStyle = PAL.STONE; ctx.fill();
  } else if (id === 14) {
    drawPixelText(ctx, "LEFT", 252, 146, 2, PAL.STONE, "center");
    drawPixelText(ctx, "RIGHT", 688, 146, 2, PAL.GOLD, "center");
    for (let idx = 0; idx < 16; idx++) {
      const col = idx % 4, row = Math.floor(idx / 4);
      const lx = 140 + col * 62, ly = 180 + row * 62;
      const rx = 576 + col * 62, ry = 180 + row * 62;
      for (const [x, y, odd] of [[lx, ly, false], [rx, ry, idx === g2.oddIdx]]) {
        ctx.fillStyle = PAL.STONE; ctx.fillRect(x, y, 54, 54);
        ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 2; ctx.strokeRect(x, y, 54, 54);
        ctx.fillStyle = PAL.WHITE; ctx.fillRect(x + 15, y + 15, 24, 24);
        ctx.fillStyle = PAL.CORAL;
        ctx.fillRect(x + (odd ? 30 : 18), y + 18, 6, 6);
      }
    }
  } else if (id === 15) {
    // Big centered interactive Eye + 2 giant fake trap buttons
    const dx = app.mouse.x - 480, dy = app.mouse.y - 210, d = Math.max(1, Math.hypot(dx, dy));
    const px = (dx / d) * Math.min(18, d * 0.08), py = (dy / d) * Math.min(10, d * 0.08);
    ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(385, 210); ctx.quadraticCurveTo(480, 150, 575, 210);
    ctx.quadraticCurveTo(480, 270, 385, 210); ctx.closePath();
    ctx.fillStyle = PAL.STONE; ctx.fill(); ctx.stroke();
    ctx.fillStyle = PAL.GOLD; ctx.beginPath(); ctx.arc(480 + px, 210 + py, 20, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = PAL.BG; ctx.beginPath(); ctx.arc(480 + px * 1.15, 210 + py * 1.15, 8, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = PAL.GOLD; ctx.fillRect(165, 330, 280, 76);
    drawPixelText(ctx, "SAFE BUTTON (WIN)", 305, 358, 2, PAL.ACCENT_TEXT, "center", null, 260);
    ctx.fillStyle = PAL.CORAL; ctx.fillRect(515, 330, 280, 76);
    drawPixelText(ctx, "NO CLICK ME INSTEAD!", 655, 358, 2, PAL.ACCENT_TEXT, "center", null, 260);
  } else if (id === 16) {
    drawPixelText(ctx, `STAGE ${g2.phase + 1}/4`, 480, 124, 2, PAL.GOLD, "center");
    if (g2.phase === 0) {
      drawPixelText(ctx, "CLICK CORAL INK!", 480, 174, 3, PAL.WHITE, "center");
      const opts = [
        { text: "CORAL", color: PAL.WHITE },
        { text: "GOLD", color: PAL.CORAL },
        { text: "WHITE", color: PAL.GOLD }
      ];
      for (let i = 0; i < 3; i++) {
        const bx = 175 + i * 210, by = 250;
        ctx.fillStyle = PAL.STONE; ctx.fillRect(bx, by, 185, 84);
        ctx.strokeStyle = PAL.WHITE; ctx.lineWidth = 2; ctx.strokeRect(bx, by, 185, 84);
        drawPixelText(ctx, opts[i].text, bx + 92, by + 30, 3, opts[i].color, "center");
      }
    } else if (g2.phase === 1) {
      drawPixelText(ctx, "FREEZE FOR 2 SECONDS!", 480, 190, 3, PAL.GOLD, "center");
      ctx.fillStyle = PAL.CORAL; ctx.fillRect(320, 260, 320, 72);
      drawPixelText(ctx, "CLICK FAST TO WIN!", 480, 286, 2, PAL.WHITE, "center");
    } else if (g2.phase === 2) {
      drawPixelText(ctx, "INVERTED: HIT BOTH GOLD CORES", 480, 128, 2, PAL.GOLD, "center");
      for (const t of g2.targets) {
        if (t.hit) continue;
        ctx.beginPath(); ctx.arc(t.x, t.y, t.r, 0, Math.PI * 2);
        ctx.fillStyle = t.gold ? PAL.GOLD : PAL.CORAL; ctx.fill();
      }
      const ip = getInvertedMindPt(app.mouse);
      ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ip.x, ip.y, 12, 0, Math.PI * 2); ctx.stroke();
    } else if (g2.phase === 3) {
      drawPixelText(ctx, `POKE THE EYE (${g2.eyeHits}/3)`, 480, 146, 3, PAL.CORAL, "center");
      const ex = 480 + Math.sin(g2.phaseTick * 0.065) * 210;
      const ey = 265 + Math.cos(g2.phaseTick * 0.085) * 70;
      ctx.fillStyle = PAL.STONE; ctx.beginPath(); ctx.arc(ex, ey, 36, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = PAL.CORAL; ctx.beginPath(); ctx.arc(ex, ey, 18, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = PAL.BG; ctx.beginPath(); ctx.arc(ex, ey, 7, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Narrator footer
  ctx.fillStyle = PAL.SURFACE; ctx.fillRect(0, LOGICAL_H - 34, LOGICAL_W, 34);
  ctx.fillStyle = PAL.BORDER; ctx.fillRect(0, LOGICAL_H - 34, LOGICAL_W, 1);
  drawPixelText(ctx, app.narratorText, 480, LOGICAL_H - 24, 2, PAL.WHITE, "center", null, isTouchCapable() ? 600 : 910);

  if (g2.failTicks > 0) {
    ctx.save(); ctx.globalAlpha = 0.28; ctx.fillStyle = PAL.CORAL; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H); ctx.restore();
  }
}

function readExtGameStats(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return { stars: 0, fails: 0 };
    const d = JSON.parse(raw);
    const stars = Object.values(d.stars || {}).reduce((a, b) => a + b, 0);
    return { stars, fails: d.totalFails || d.totalFalls || 0 };
  } catch (e) { return { stars: 0, fails: 0 }; }
}
