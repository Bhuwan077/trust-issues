}

function drawPixelText(ctx, text, x, y, scale, color, align = "left", bg = null, maxWidth = 0) {
  const s = String(text);
  const pxSize = scale >= 3 ? Math.round(scale * 7.2) : (scale >= 2 ? 15 : 12);
  ctx.save();
  ctx.font = `${scale >= 2.5 ? 700 : 600} ${pxSize}px ${UI_FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = "top";
  if (bg) {
    const m = Math.min(maxWidth || 900, ctx.measureText(s).width);
    const bx = align === "center" ? x - m / 2 - 4 : (align === "right" ? x - m - 4 : x - 4);
    ctx.fillStyle = bg; ctx.fillRect(bx, y - 2, m + 8, pxSize + 5);
  }
  ctx.fillStyle = color;
  if (maxWidth > 0) ctx.fillText(s, x, y, maxWidth);
  else ctx.fillText(s, x, y);
  ctx.restore();
}

/* ============================================================================
 * 3. WEB AUDIO SYNTHESIZER (Reused)
 * ============================================================================ */
class SoundEngine {
  constructor() { this.ctx = null; this.muted = false; this.unlocked = false; }
  unlock() {
    if (this.unlocked) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = this.ctx || new AC();
      if (this.ctx.state === "suspended") this.ctx.resume();
      this.unlocked = true;
    } catch (e) {}
  }
  play(name) {
    if (this.muted || !this.ctx) return;
    try {
      const now = this.ctx.currentTime, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.connect(g); g.connect(this.ctx.destination);
      if (name === "jump") {
        o.type = "square"; o.frequency.setValueAtTime(220, now); o.frequency.exponentialRampToValueAtTime(520, now + 0.08);
        g.gain.setValueAtTime(0.08, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
        o.start(now); o.stop(now + 0.09);
      } else if (name === "death") {
        o.type = "sawtooth"; o.frequency.setValueAtTime(190, now); o.frequency.exponentialRampToValueAtTime(52, now + 0.16);
        g.gain.setValueAtTime(0.11, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.17);
        o.start(now); o.stop(now + 0.17);
      } else if (name === "edge") {
        o.type = "triangle"; o.frequency.setValueAtTime(340, now); o.frequency.exponentialRampToValueAtTime(480, now + 0.06);
        g.gain.setValueAtTime(0.06, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        o.start(now); o.stop(now + 0.07);
      } else if (name === "key" || name === "coin") {
        o.type = "triangle"; o.frequency.setValueAtTime(660, now); o.frequency.setValueAtTime(990, now + 0.06);
        g.gain.setValueAtTime(0.09, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
        o.start(now); o.stop(now + 0.14);
      } else if (name === "win") {
        o.type = "triangle";
        [523, 659, 784, 1046].forEach((f, i) => o.frequency.setValueAtTime(f, now + i * 0.06));
        g.gain.setValueAtTime(0.1, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.34);
        o.start(now); o.stop(now + 0.34);
      } else if (name === "flip" || name === "lock" || name === "slam") {
        o.type = "square"; o.frequency.setValueAtTime(name === "slam" ? 130 : 410, now);
        g.gain.setValueAtTime(0.07, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        o.start(now); o.stop(now + 0.08);
      }
    } catch (e) {}
  }
}

/* ============================================================================
 * 4. ROOM BUILDER & LEVEL DATA REGISTRIES
 * ============================================================================ */
function buildRoom(fn, opts = {}) {
  const g = Array.from({ length: ROWS }, () => Array(COLS).fill("."));
  for (let c = 0; c < COLS; c++) { g[0][c] = "#"; g[ROWS - 1][c] = "#"; g[ROWS - 2][c] = "#"; g[ROWS - 3][c] = "#"; g[ROWS - 4][c] = "#"; }
  for (let r = 0; r < ROWS; r++) { g[r][0] = "#"; g[r][COLS - 1] = "#"; }
  // Open optional edges cleanly
  if (opts.openLeft)  for (let r = 1; r <= 13; r++) g[r][0] = ".";
  if (opts.openRight) for (let r = 1; r <= 13; r++) g[r][COLS - 1] = ".";
  if (opts.openTop)   for (let c = opts.openTop[0]; c <= opts.openTop[1]; c++) g[0][c] = ".";
  if (opts.openBottom)for (let c = opts.openBottom[0]; c <= opts.openBottom[1]; c++) { for (let r = 14; r < ROWS; r++) g[r][c] = "."; }

  const api = {
    set(c, r, ch) { if (r >= 0 && r < ROWS && c >= 0 && c < COLS) g[r][c] = ch; },
    row(r, c1, c2, ch) { for (let c = c1; c <= c2; c++) api.set(c, r, ch); },
    col(c, r1, r2, ch) { for (let r = r1; r <= r2; r++) api.set(c, r, ch); },
    plat(c, r, w, ch = "#") { api.row(r, c, c + w - 1, ch); },
    pit(c1, c2, spike = "^") {
      for (let c = c1; c <= c2; c++) {
        g[14][c] = "."; g[15][c] = spike; g[16][c] = "#"; g[17][c] = "#";
      }
    },
    clearFloor(c1, c2) { for (let c = c1; c <= c2; c++) { for (let r = 14; r < ROWS; r++) g[r][c] = "."; } }
  };
  if (fn) fn(api);
  return g.map(r => r.join(""));
}

function addMaxLevel(def) {
  MAX_LEVELS.push(def);
  DIFFICULTY_INDEX.push({
    id: def.id,
    chapter2Number: def.chapter2Number,
    name: def.name,
    score: def.score,
    rooms: Object.keys(def.rooms).length,
    spikeTypes: def.spikeTypes || [],
    twist: def.twist || def.mechanic,
    tell: def.tell,
    estTime: def.estTime || "45-75s",
    solutionSummary: def.solutionSummary || ""
  });
}

function assertDifficultyNonDecreasing() {
  const errors = [];
  for (let i = 1; i < DIFFICULTY_INDEX.length; i++) {
    if (DIFFICULTY_INDEX[i].score < DIFFICULTY_INDEX[i - 1].score) {
      errors.push(`L${DIFFICULTY_INDEX[i].id} (${DIFFICULTY_INDEX[i].score}) < L${DIFFICULTY_INDEX[i - 1].id} (${DIFFICULTY_INDEX[i - 1].score})`);
    }
  }
  return { ok: errors.length === 0, errors };
}

/* ============================================================================
 * 5. LEVEL GRAPH VALIDATOR (Reachability of all rooms, keys, and Goal Door)
 * ============================================================================ */
function validateLevelGraph(def) {
  const roomIds = Object.keys(def.rooms || {});
  if (!roomIds.includes(def.startRoom)) return { ok: false, reason: `Invalid startRoom ${def.startRoom}` };
  if (!def.goal || !roomIds.includes(def.goal.room)) return { ok: false, reason: `Invalid goal room` };

  const reached = new Set([def.startRoom]);
  const q = [def.startRoom];
  while (q.length > 0) {
    const r = q.shift();
    const ed = (def.edges && def.edges[r]) || {};
    const targets = [];
    for (const dir of ["left", "right", "top", "bottom"]) {
      if (ed[dir] && ed[dir].to) targets.push(ed[dir].to);
    }
    if (Array.isArray(ed.hidden)) {
      for (const h of ed.hidden) if (h && h.to) targets.push(h.to);
    }
    for (const to of targets) {
      if (!def.rooms[to]) return { ok: false, reason: `Edge from ${r} points to missing room ${to}` };
      if (!reached.has(to)) { reached.add(to); q.push(to); }
    }
  }
  const unreachable = roomIds.filter(r => !reached.has(r));
  if (unreachable.length) return { ok: false, reason: `Unreachable rooms: ${unreachable.join(",")}` };

  // Count keys placed across reachable rooms
  let totalKeys = 0;
  for (const r of reached) totalKeys += (def.rooms[r].keys || []).length;
  if ((def.keysRequired || 0) > totalKeys) {
    return { ok: false, reason: `Requires ${def.keysRequired} keys but only ${totalKeys} placed` };
  }
  if (!reached.has(def.goal.room)) return { ok: false, reason: `Goal room ${def.goal.room} unreachable` };
  return { ok: true, rooms: roomIds.length, keys: totalKeys };
}

function validateAllLevels() {
  const results = MAX_LEVELS.map(l => ({ id: l.id, name: l.name, ...validateLevelGraph(l) }));
  const diffCheck = assertDifficultyNonDecreasing();
  const ok = results.every(r => r.ok) && diffCheck.ok;
  return { ok, results, diffCheck };
}

function getActiveMaxRiddle(state) {
  if (!state || !state.def) return null;
  const mode = progress.riddleMode || "deaths";
  if (mode === "off") return null;
  if (state.totalTick < 120) return null; // Never show in first 2s after respawn
  if (state.decodedText) return { text: state.decodedText, alpha: 1 };

  const deaths = state.levelDeaths || 0;
  let tier = 0;
  if (deaths >= 12) tier = 3;
  else if (deaths >= 8) tier = 2;
  else if (deaths >= 4) tier = 1;
  else if (mode === "always") tier = 1;
  if (tier === 0) return null;

  if (state.totalTick > 420) return null; // 5s fade-out (300 ticks: 120..420)
  const alpha = progress.streamerSafe ? 1 : (state.totalTick > 390 ? Math.max(0, (420 - state.totalTick) / 30) : 1);

  const custom = MAX_RIDDLES[state.def.id];
  let text = "";
  if (custom) {
    text = tier === 3 ? custom.r3 : (tier === 2 ? custom.r2 : custom.r1);
  } else {
    const tag = (state.def.spikeTypes && state.def.spikeTypes[0]) || "wrap";
    const pool = GENERIC_MAX_RIDDLES.filter(g => g.tag === tag);
    text = (pool.length ? pool[(state.def.id + tier) % pool.length] : GENERIC_MAX_RIDDLES[state.def.id % GENERIC_MAX_RIDDLES.length]).text;
  }
  if (!progress.streamerSafe) {
    const chars = Math.min(text.length, Math.floor((state.totalTick - 120) * 1.4) + 1);
    text = text.slice(0, chars);
  }
  return { text, alpha };
}

  for (let r = minR; r <= maxR; r++) {
    for (let c = minC; c <= maxC; c++) {
      const ch = room.grid[r][c];
      if (!isSolidChar(ch)) continue;
      const tr = { x: c * TILE, y: r * TILE, w: TILE, h: TILE };
      if (rectsOverlap(p, tr)) {
        if (p.vy > 0) {
          p.y = tr.y - p.h;
          if (ch === "B") { p.vy = -740; state.soundEvents.push("jump"); }
          else { p.vy = 0; if (gDir > 0) p.onGround = true; }
        } else if (p.vy < 0) {
          p.y = tr.y + tr.h; p.vy = 0;
          if (gDir < 0) p.onGround = true;
        }
      }
    }
  }
  for (const plat of room.movingPlats) {
    if (rectsOverlap(p, plat)) {
      if (p.vy >= 0 && (p.y + p.h - p.vy * FIXED_DT) <= plat.y + 10) {
        p.y = plat.y - p.h; p.vy = 0; p.onGround = true; p.standingPlatId = plat.id;
      } else if (p.vy < 0) {
        p.y = plat.y + plat.h; p.vy = 0;
      }
    }
  }

  // Screen-edge Room Transition!
  if (checkEdgeTransition(state, room, applyVisualSlide)) return;
  if (p.y > LOGICAL_H + 30) { killPlayer(state, "void"); return; }

  // Static tile spikes & fake doors
  const pRect = { x: p.x, y: p.y, w: p.w, h: p.h };
  for (let r = Math.max(0, Math.floor(p.y / TILE)); r <= Math.min(ROWS - 1, Math.floor((p.y + p.h) / TILE)); r++) {
    for (let c = Math.max(0, Math.floor(p.x / TILE)); c <= Math.min(COLS - 1, Math.floor((p.x + p.w) / TILE)); c++) {
      const ch = room.grid[r][c];
      if (ch === "L" && rectsOverlap(pRect, { x: c * TILE + 10, y: r * TILE, w: 10, h: TILE })) { killPlayer(state, "laser"); return; }
      if (isSpikeChar(ch)) {
        const hb = getTileSpikeHitbox(c, r, ch);
        if (hb && rectsOverlap(pRect, hb)) { killPlayer(state, "spike"); return; }
      }
    }
  }
  if (room.def.fakeDoors) {
    for (const fd of room.def.fakeDoors) {
      if (rectsOverlap(pRect, { x: fd.col * TILE + 3, y: fd.row * TILE, w: 24, h: 30 })) {
        killPlayer(state, "fakeDoor"); return;
      }
    }
  }

  // Collect keys
  for (const k of room.keys) {
    if (!k.collected && rectsOverlap(pRect, { x: k.x - 10, y: k.y - 10, w: 20, h: 20 })) {
      k.collected = true;
      state.collectedKeys.add(k.id);
      state.soundEvents.push("key");
    }
  }

  // Step all 14 moving spike types
  stepMovingSpikes(state, room, worldAdvances);
  if (state.dead) return;

  // Check Goal Door (requires collectedKeys.size >= keysRequired)
  if (def.goal.room === room.id && state.collectedKeys.size >= (def.keysRequired || 0)) {
    const gRect = { x: def.goal.col * TILE + 3, y: def.goal.row * TILE, w: 24, h: 30 };
    if (rectsOverlap(pRect, gRect)) {
      state.won = true;
      state.soundEvents.push("win");
    }
  }
}

function stepSimulation(state, rawInput, applyVisualSlide = false) {
  state.soundEvents.length = 0;
  state.shakeEvents.length = 0;
  if (state.won) return;
  if (state.dead) {
    if (state.respawnTicksLeft > 0) state.respawnTicksLeft--;
    return;
  }
  if (state.transition) {
    state.transition.tick++;
    if (state.transition.tick >= state.transition.duration) state.transition = null;
    return;
  }
  stepSingleTick(state, rawInput, applyVisualSlide);
}

/* ============================================================================
 * 9. DETERMINISTIC F9 SOLVER & VALIDATOR SELF-CHECK
 * ============================================================================ */
function expandSolution(segs) {
  const frames = [];
  for (const s of segs || []) {
    const n = s.ticks || 1;
    for (let i = 0; i < n; i++) frames.push({ left: !!s.left, right: !!s.right, jump: !!s.jump });
  }
  return frames;
}

function runHeadlessSolverForLevel(levelId) {
  const def = MAX_LEVELS.find(l => l.id === levelId);
  const segs = MAX_SOLUTIONS[levelId];
  if (!def || !segs) return { id: levelId, name: def ? def.name : "?", pass: false, reason: "Missing solution" };
  const st = createLevelState(def, 0);
  const frames = expandSolution(segs);
  for (let i = 0; i < frames.length; i++) {
    stepSimulation(st, frames[i], false);
    if (st.won) return { id: levelId, name: def.name, pass: true, ticks: st.totalTick, seconds: (st.totalTick / 60).toFixed(2) };
    if (st.dead) return { id: levelId, name: def.name, pass: false, ticks: st.totalTick, reason: `Died (${st.deathReason}) @ room=${st.currentRoomId} t=${st.totalTick}` };
  }
  return { id: levelId, name: def.name, pass: false, ticks: st.totalTick, reason: `Timeout @ room=${st.currentRoomId} (${Math.round(st.player.x)},${Math.round(st.player.y)})` };
}

function runAllSolvers() {
  const val = validateAllLevels();
  const results = MAX_LEVELS.map(l => runHeadlessSolverForLevel(l.id));
  const passed = results.filter(r => r.pass).length;
  console.group(`TRUST ISSUES MAX F9 SOLVER: ${passed}/${results.length} PASS | VALIDATOR: ${val.ok ? "OK" : "FAIL"}`);
  if (!val.ok) console.error(val);
  for (const r of results) {
    console.log(`M${String(r.id).padStart(2,"0")} (${r.name}): ${r.pass ? `PASS [${r.seconds}s / ${r.ticks}t]` : `FAIL - ${r.reason}`}`);
  }
  console.groupEnd();
  return { results, val, passed, total: results.length };
}

function drawRoomScene(state) {
  const room = getCurrentRoom(state);
  const def = state.def;
  // Tiles
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const ch = room.grid[r][c], x = c * TILE, y = r * TILE;
      if (ch === "#" || ch === "B" || ch === "I" || ch === "C") {
        ctx.fillStyle = ch === "B" ? PAL.GOLD : (ch === "I" ? PAL.CYAN : PAL.STONE);
        ctx.fillRect(x, y, TILE, TILE);
        ctx.strokeStyle = PAL.BG; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, TILE - 1, TILE - 1);
      } else if (ch === "L") {
        ctx.fillStyle = PAL.CORAL; ctx.fillRect(x + 11, y, 8, TILE);
      } else if (isSpikeChar(ch)) {
        ctx.fillStyle = PAL.CORAL;
        ctx.beginPath();
        if (ch === "^") { ctx.moveTo(x+3, y+TILE); ctx.lineTo(x+TILE/2, y+4); ctx.lineTo(x+TILE-3, y+TILE); }
        else if (ch === "v") { ctx.moveTo(x+3, y); ctx.lineTo(x+TILE/2, y+TILE-4); ctx.lineTo(x+TILE-3, y); }
        else if (ch === "<") { ctx.moveTo(x+TILE, y+3); ctx.lineTo(x+4, y+TILE/2); ctx.lineTo(x+TILE, y+TILE-3); }
        else { ctx.moveTo(x, y+3); ctx.lineTo(x+TILE-4, y+TILE/2); ctx.lineTo(x, y+TILE-3); }
        ctx.closePath(); ctx.fill();
      }
    }
  }
  // Hidden edge seam tells
  const ed = (def.edges && def.edges[room.id]) || {};
  if (Array.isArray(ed.hidden)) {
    for (const h of ed.hidden) {
      ctx.save(); ctx.globalAlpha = 0.55 + 0.3 * Math.sin(state.totalTick * 0.25);
      ctx.fillStyle = PAL.CYAN; ctx.fillRect(h.rect.x, h.rect.y, 4, h.rect.h);
      ctx.restore();
    }
  }
  // Moving platforms
  for (const pl of room.movingPlats) {
    ctx.fillStyle = PAL.STONE; ctx.fillRect(pl.x, pl.y, pl.w, pl.h);
    ctx.fillStyle = PAL.GOLD; ctx.fillRect(pl.x, pl.y, pl.w, 3);
  }
  // Keys & Fake Doors
  for (const k of room.keys) {
    if (k.collected) continue;
    ctx.fillStyle = PAL.GOLD;
    ctx.beginPath(); ctx.arc(k.x, k.y + Math.sin(state.totalTick * 0.12) * 3, 7, 0, Math.PI * 2); ctx.fill();
    drawPixelText(ctx, "K", k.x, k.y - 6, 1, PAL.ACCENT_TEXT, "center");
  }
  if (room.def.fakeDoors) {
    for (const fd of room.def.fakeDoors) {
      ctx.fillStyle = PAL.GOLD; ctx.fillRect(fd.col * TILE + 3, fd.row * TILE, 24, 30);
      ctx.fillStyle = PAL.CORAL; ctx.fillRect(fd.col * TILE + 18, fd.row * TILE + 15, 2, 2);
    }
  }
  // Goal Door (faint shimmer when hidden, bright gold once unlocked)
  if (def.goal.room === room.id) {
    const unlocked = state.collectedKeys.size >= (def.keysRequired || 0);
    ctx.save();
    ctx.globalAlpha = unlocked ? 1 : 0.4;
    ctx.fillStyle = unlocked ? PAL.GOLD : PAL.STONE;
    ctx.fillRect(def.goal.col * TILE + 3, def.goal.row * TILE, 24, 30);
    ctx.strokeStyle = PAL.CYAN; ctx.lineWidth = 2;
    ctx.strokeRect(def.goal.col * TILE + 3, def.goal.row * TILE, 24, 30);
    ctx.restore();
  }
  // Moving Spikes + Tells
  const p = state.player;
  for (const ms of room.movingSpikes) {
    if (!ms.active) continue;
    if (ms.kind === "rainWave") {
      const cols = ms.cols || [], per = ms.period || 100, warn = ms.warnTicks || 26, stag = ms.stagger || 10;
      for (let ci = 0; ci < cols.length; ci++) {
        const c = cols[ci], ph = ((state.simTick + ci * stag) % per + per) % per;
        if (ph < warn) {
          ctx.fillStyle = PAL.CORAL; ctx.fillRect(c * TILE + 4, 14 * TILE - 4, 22, 4);
        } else if (ph < warn + 34) {
          const dropY = ms.from === "bottom" ? 14 * TILE - Math.min(180, (ph - warn) * 7) : 30 + Math.min(13 * TILE, (ph - warn) * 11);
          ctx.fillStyle = PAL.CORAL; ctx.beginPath();
          ctx.moveTo(c*TILE+4, dropY); ctx.lineTo(c*TILE+26, dropY); ctx.lineTo(c*TILE+15, dropY+22); ctx.closePath(); ctx.fill();
        }
      }
      continue;
    }
    if (ms.kind === "orbit") {
      const radii = ms.chain || [ms.r || 48];
      const count = ms.count || 1;
      ctx.fillStyle = PAL.GOLD; ctx.beginPath(); ctx.arc(ms.cx, ms.cy, 4, 0, Math.PI * 2); ctx.fill();
      for (const rr of radii) {
        ctx.save(); ctx.globalAlpha = 0.2; ctx.strokeStyle = PAL.MUTED; ctx.beginPath(); ctx.arc(ms.cx, ms.cy, rr, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
        for (let ci = 0; ci < count; ci++) {
          const ang = (ms.phase0 || 0) + state.simTick * (ms.omega || 0.04) + (ci / count) * Math.PI * 2;
          ctx.fillStyle = PAL.CORAL; ctx.beginPath();
          ctx.arc(ms.cx + Math.cos(ang) * rr, ms.cy + Math.sin(ang) * rr, 9, 0, Math.PI * 2); ctx.fill();
        }
      }
      continue;
    }
    if (ms.kind === "conveyor") {
      const span = Math.max(60, ms.x2 - ms.x1), spacing = ms.spacing || 90, count = Math.max(1, Math.floor(span / spacing));
      ctx.fillStyle = PAL.STONE; ctx.fillRect(ms.x1, ms.y + 18, span, 6);
      for (let ci = 0; ci < count; ci++) {
        const sx = ms.x1 + (((state.simTick * (ms.speed || 2) + ci * spacing) % span) + span) % span;
        ctx.fillStyle = PAL.CORAL; ctx.beginPath();
        ctx.moveTo(sx, ms.y + 20); ctx.lineTo(sx + 10, ms.y); ctx.lineTo(sx + 20, ms.y + 20); ctx.closePath(); ctx.fill();
      }
      continue;
    }
    if (ms.kind === "train") {
      ctx.fillStyle = PAL.STONE; ctx.fillRect(0, ms.y + 18, LOGICAL_W, 4);
      ctx.fillStyle = PAL.CORAL;
      for (let tx = 0; tx < ms.curW; tx += 16) {
        ctx.beginPath(); ctx.moveTo(ms.curX + tx, ms.y + 20); ctx.lineTo(ms.curX + tx + 8, ms.y); ctx.lineTo(ms.curX + tx + 16, ms.y + 20); ctx.closePath(); ctx.fill();
      }
      continue;
    }
    if (ms.kind === "platRider") {
      const pl = room.movingPlats.find(p0 => p0.id === ms.platId);
      if (pl && ms.edge === "bottom") {
        ctx.fillStyle = PAL.CORAL; ctx.fillRect(pl.x + 2, pl.y + pl.h, pl.w - 4, 8);
      }
      continue;
    }
    if (ms.kind === "ring") {
      const baseAng = state.simTick * (ms.omega || 0.035), count = ms.count || 8, gapIdx = ms.gapIdx || 0;
      ctx.save(); ctx.globalAlpha = 0.25; ctx.strokeStyle = PAL.GOLD; ctx.beginPath(); ctx.arc(ms.cx, ms.cy, ms.r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      for (let i = 0; i < count; i++) {
        if (i === gapIdx) continue;
        const a = baseAng + (i / count) * Math.PI * 2;
        ctx.fillStyle = PAL.CORAL; ctx.beginPath();
        ctx.arc(ms.cx + Math.cos(a) * ms.r, ms.cy + Math.sin(a) * ms.r, 8, 0, Math.PI * 2); ctx.fill();
      }
      continue;
    }
    if (ms.kind === "pendulum") {
      ctx.strokeStyle = PAL.MUTED; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(ms.px, ms.py); ctx.lineTo(ms.curX + ms.curW/2, ms.curY + ms.curH/2); ctx.stroke();
    } else if (ms.kind === "lockedAim" && ms.warning) {
      ctx.save(); ctx.strokeStyle = PAL.GOLD; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(ms.curX + 10, ms.curY + 10); ctx.lineTo(p.x + p.w/2, p.y + p.h/2); ctx.stroke(); ctx.restore();
    }
    ctx.fillStyle = ms.warning ? PAL.GOLD : PAL.CORAL;
    ctx.fillRect(Math.round(ms.curX), Math.round(ms.curY), ms.curW, ms.curH);
  }
  if (state.chaser && state.chaser.delayLeft === 0) {
    ctx.fillStyle = PAL.CORAL;
    ctx.fillRect(Math.round(state.chaser.x), Math.round(state.chaser.y), state.chaser.w, state.chaser.h);
  }
  // Player
  if (!state.dead) {
    const cx = p.x + p.w / 2, by = p.y + p.h;
    ctx.fillStyle = (room.def.flipX || room.def.reverseControls) ? PAL.GOLD : PAL.WHITE;
    ctx.fillRect(Math.round(cx - SPRITE_W / 2), Math.round(by - SPRITE_H), SPRITE_W, SPRITE_H);
    ctx.fillStyle = PAL.BG;
    ctx.fillRect(Math.round(cx + p.facing * 3 - 4), Math.round(by - SPRITE_H + 7), 3, 4);
    ctx.fillRect(Math.round(cx + p.facing * 3 + 2), Math.round(by - SPRITE_H + 7), 3, 4);
  }
}

function renderMiniMap(state) {
  const def = state.def;
  const rids = Object.keys(def.rooms);
  const mx = LOGICAL_W - 142, my = 48, mw = 132, mh = 54;
  ctx.fillStyle = PAL.PANEL; ctx.fillRect(mx, my, mw, mh);
  ctx.strokeStyle = PAL.CYAN; ctx.lineWidth = 1; ctx.strokeRect(mx, my, mw, mh);
  const step = Math.floor((mw - 20) / Math.max(1, rids.length));
  rids.forEach((rid, i) => {
    const seen = state.exploredRooms.has(rid);
    const active = state.currentRoomId === rid;
    const rx = mx + 10 + i * step, ry = my + 18;
    ctx.fillStyle = active ? PAL.CYAN : (seen ? PAL.GOLD : PAL.STONE);
    ctx.fillRect(rx, ry, 14, 14);
    if (i < rids.length - 1) {
      ctx.strokeStyle = def.lyingMap ? PAL.CORAL : PAL.WHITE;
      ctx.beginPath();
      if (def.lyingMap) { ctx.moveTo(rx + 14, ry + 2); ctx.lineTo(rx + step, ry + 14); }
      else { ctx.moveTo(rx + 14, ry + 7); ctx.lineTo(rx + step, ry + 7); }
      ctx.stroke();
    }
  });
  drawPixelText(ctx, def.lyingMap ? "MAP?" : "MAP", mx + mw / 2, my + 4, 1, PAL.MUTED, "center");
}

  addButton(220, 224, 250, 36, `Riddles: ${rm}`, () => { const o = ["deaths","always","off"]; progress.riddleMode = o[(o.indexOf(progress.riddleMode||"deaths")+1)%3]; saveProgress(progress); }, PAL.SURFACE, PAL.WHITE);
  addButton(490, 224, 250, 36, `Streamer Safe: ${progress.streamerSafe ? "ON" : "OFF"}`, () => { progress.streamerSafe = !progress.streamerSafe; saveProgress(progress); }, PAL.SURFACE, PAL.WHITE);
  addButton(220, 272, 250, 36, `Sound: ${progress.muted ? "Muted" : "On"}`, () => { progress.muted = !progress.muted; sfx.muted = progress.muted; saveProgress(progress); }, PAL.SURFACE, PAL.WHITE);
  addButton(490, 272, 250, 36, `OBS Overlay [O]: ${progress.bigDeathOverlay ? "ON" : "OFF"}`, () => { progress.bigDeathOverlay = !progress.bigDeathOverlay; saveProgress(progress); }, PAL.SURFACE, PAL.WHITE);
  addButton(220, 330, 250, 38, "Level Select [L]", () => { app.screen = "select"; }, PAL.STONE, PAL.WHITE);
  addButton(490, 330, 250, 38, "Back to Trust Issues", () => { window.location.href = GAME_LINKS.originalUrl; }, PAL.STONE, PAL.CYAN);
  addButton(320, 412, 320, 40, "Main Menu", () => { app.screen = "title"; app.state = null; }, PAL.SURFACE, PAL.GOLD);
}

function renderHUD(state) {
  const room = getCurrentRoom(state);
  const def = state.def;
  ctx.fillStyle = PAL.SURFACE; ctx.fillRect(0, 0, LOGICAL_W, 40);
  drawPixelText(ctx, `MAX ${def.id} (#${def.chapter2Number}): ${def.name}  •  ${room.def.label || room.id}`, 14, 12, 1.8, PAL.CYAN, "left", null, 500);
  drawPixelText(ctx, `Deaths: ${state.levelDeaths}  Keys: ${state.collectedKeys.size}/${def.keysRequired || 0}`, 640, 12, 1.8, PAL.GOLD, "right", null, 200);
  addButton(780, 6, 80, 28, "RETRY", () => startLevel(app.currentIdx), PAL.STONE, PAL.WHITE);
  addButton(868, 6, 80, 28, "PAUSE", () => { app.screen = "pause"; }, PAL.STONE, PAL.WHITE);
  if ((state.levelDeaths || 0) >= 25 && !state.decodedText) {
    addButton(684, 6, 88, 28, "DECODE", () => { state.decodedText = def.solutionSummary || def.tell; state.usedAssist = true; }, PAL.STONE, PAL.GOLD, PAL.GOLD);
  }
  renderMiniMap(state);
  // Bottom-center Narrator Riddle bar
  const rHint = getActiveMaxRiddle(state);
  if (rHint) {
    ctx.save(); ctx.globalAlpha = rHint.alpha;
    ctx.fillStyle = PAL.PANEL; ctx.fillRect(80, LOGICAL_H - 72, 800, 34);
    ctx.strokeStyle = PAL.GOLD; ctx.lineWidth = 1.5; ctx.strokeRect(80, LOGICAL_H - 72, 800, 34);
    drawPixelText(ctx, rHint.text, 480, LOGICAL_H - 61, 1.4, PAL.GOLD, "center", null, 760);
    ctx.restore();
  }
  ctx.fillStyle = PAL.SURFACE; ctx.fillRect(0, LOGICAL_H - 34, LOGICAL_W, 34);
  drawPixelText(ctx, progress.practiceMode ? "[ ] SWITCH ROOM (PRACTICE)  •  [R] RESTART  •  NO CHECKPOINTS" : "NO CHECKPOINTS  •  DEATH RESETS TO ROOM 1  •  [R] INSTANT RETRY", 480, LOGICAL_H - 24, 1.5, PAL.MUTED, "center");
}

function render() {
  uiButtons.length = 0;
  const showTouch = app.screen === "play" && (app.hasTouch || (window.matchMedia && window.matchMedia("(pointer: coarse)").matches));
  const touchEl = document.getElementById("touch-controls");
  if (touchEl) touchEl.classList.toggle("active", !!showTouch);
  if (app.screen === "title") renderTitleScreen();
  else if (app.screen === "select") renderLevelSelect();
  else if (app.screen === "shame") {
    ctx.fillStyle = PAL.BG; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    drawPixelText(ctx, "HALL OF SHAME (MAX)", 480, 36, 3, PAL.CORAL, "center");
    addButton(360, 460, 240, 42, "BACK", () => { app.screen = "title"; }, PAL.STONE, PAL.WHITE);
  } else if (app.screen === "victory") {
    ctx.fillStyle = PAL.BG; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    drawPixelText(ctx, "CONGRATULATIONS! TRUST ISSUES MAX CLEARED!", 480, 120, 3, PAL.CYAN, "center", null, 880);
    drawPixelText(ctx, `TOTAL SUFFERING: ${progress.totalDeaths} DEATHS`, 480, 190, 2, PAL.GOLD, "center");
    addButton(330, 280, 300, 44, "PLAY AGAIN", () => startLevel(MAX_LEVELS.length > 1 ? 1 : 0), PAL.CYAN, PAL.ACCENT_TEXT);
    addButton(330, 340, 300, 42, "BACK TO TRUST ISSUES", () => { window.location.href = GAME_LINKS.originalUrl; }, PAL.STONE, PAL.GOLD);
  } else if (app.state) {
    ctx.fillStyle = PAL.BG; ctx.fillRect(0, 0, LOGICAL_W, LOGICAL_H);
    ctx.save();
    if (app.state.transition) {
      const k = 1 - app.state.transition.tick / app.state.transition.duration;
      const d = app.state.transition.dir;
      const sx = d === "right" ? LOGICAL_W * k : (d === "left" ? -LOGICAL_W * k : 0);
      const sy = d === "bottom" ? LOGICAL_H * k : (d === "top" ? -LOGICAL_H * k : 0);
      ctx.translate(sx, sy);
    }
    drawRoomScene(app.state);
    ctx.restore();
    renderHUD(app.state);
    if (app.screen === "pause") renderPauseMenu();
  }
  if (app.solverOverlay) {
    ctx.fillStyle = PAL.OVERLAY; ctx.fillRect(100, 50, 760, 440);
    ctx.strokeStyle = PAL.CYAN; ctx.lineWidth = 2; ctx.strokeRect(100, 50, 760, 440);
    drawPixelText(ctx, `SOLVER: ${app.solverOverlay.passed}/${app.solverOverlay.total} PASS | VALIDATOR: ${app.solverOverlay.val.ok ? "OK" : "FAIL"}`, 480, 70, 2, PAL.GOLD, "center");
    app.solverOverlay.results.slice(0, 16).forEach((r, i) => {
      drawPixelText(ctx, `M${String(r.id).padStart(2,"0")} ${r.name}: ${r.pass ? "PASS ("+r.seconds+"s)" : "FAIL - "+r.reason}`, 130, 110 + i * 21, 1.4, r.pass ? PAL.CYAN : PAL.CORAL, "left", null, 700);
    });
    addButton(380, 446, 200, 34, "CLOSE [F9]", () => { app.solverOverlay = null; }, PAL.STONE, PAL.WHITE);
  }
}

window.addEventListener("keydown", e => {
  sfx.unlock();
  if (e.code === "ArrowLeft" || e.code === "KeyA") app.keys.left = true;
  if (e.code === "ArrowRight" || e.code === "KeyD") app.keys.right = true;
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") { app.keys.jump = true; e.preventDefault(); }
  if (e.code === "KeyR" && app.state) startLevel(app.currentIdx);
  if (e.code === "Escape") app.screen = app.screen === "pause" ? (app.state ? "play" : "title") : "pause";
  if (e.code === "KeyL") app.screen = "select";
  if (e.code === "F9") {
    e.preventDefault();
    if (e.shiftKey && app.state && MAX_SOLUTIONS[app.state.def.id]) {
      app.botWatch = { frames: expandSolution(MAX_SOLUTIONS[app.state.def.id]), index: 0 };
      startLevel(app.currentIdx);
    } else {
      app.solverOverlay = app.solverOverlay ? null : runAllSolvers();
    }
  }
  if (progress.practiceMode && app.state && (e.code === "BracketLeft" || e.code === "BracketRight")) {
    const rids = Object.keys(app.state.rooms || app.state.roomStates);
    const i = rids.indexOf(app.state.currentRoomId);
    app.state.currentRoomId = rids[(i + (e.code === "BracketRight" ? 1 : rids.length - 1)) % rids.length];
    app.state.exploredRooms.add(app.state.currentRoomId);
    app.state.usedAssist = true;
  }
});
window.addEventListener("keyup", e => {
  if (e.code === "ArrowLeft" || e.code === "KeyA") app.keys.left = false;
  if (e.code === "ArrowRight" || e.code === "KeyD") app.keys.right = false;
  if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") app.keys.jump = false;
});
function resizeCanvas() {
  const rawW = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  const rawH = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  const stage = document.getElementById("stage");
  const mobile = (app.hasTouch || (window.matchMedia && window.matchMedia("(pointer: coarse)").matches));
  const rot = mobile && rawH > rawW; app.cssRotated90 = rot;
  stage.classList.toggle("landscape-forced", rot);
  const w = rot ? rawH : rawW, h = rot ? rawW : rawH;
  stage.style.width = `${Math.floor(w)}px`; stage.style.height = `${Math.floor(h)}px`;
  const s = Math.min(Math.max(240, w - 8) / LOGICAL_W, Math.max(160, h - 8) / LOGICAL_H);
  canvas.style.width = `${Math.floor(LOGICAL_W * s)}px`; canvas.style.height = `${Math.floor(LOGICAL_H * s)}px`;
}
window.addEventListener("resize", resizeCanvas); resizeCanvas();
canvas.addEventListener("pointermove", e => {
  const r = canvas.getBoundingClientRect();
  app.mouse = app.cssRotated90
    ? { x: (e.clientY - r.top) * LOGICAL_W / Math.max(1, r.height), y: (r.right - e.clientX) * LOGICAL_H / Math.max(1, r.width) }
    : { x: (e.clientX - r.left) * LOGICAL_W / Math.max(1, r.width), y: (e.clientY - r.top) * LOGICAL_H / Math.max(1, r.height) };
});
canvas.addEventListener("pointerdown", e => {
  sfx.unlock();
  if (e.pointerType === "touch" && !app.hasTouch) { app.hasTouch = true; resizeCanvas(); }
  const r = canvas.getBoundingClientRect();
  const pt = app.cssRotated90
    ? { x: (e.clientY - r.top) * LOGICAL_W / Math.max(1, r.height), y: (r.right - e.clientX) * LOGICAL_H / Math.max(1, r.width) }
    : { x: (e.clientX - r.left) * LOGICAL_W / Math.max(1, r.width), y: (e.clientY - r.top) * LOGICAL_H / Math.max(1, r.height) };
  for (let i = uiButtons.length - 1; i >= 0; i--) {
    const b = uiButtons[i];
    if (pt.x >= b.x && pt.x <= b.x + b.w && pt.y >= b.y && pt.y <= b.y + b.h) { b.onClick(); return; }
  }
});
function bindTouch(id, k) {
  const b = document.getElementById(id);
  if (!b) return;
  b.addEventListener("touchstart", e => { e.preventDefault(); sfx.unlock(); app.touch[k] = true; b.classList.add("pressed"); });
  b.addEventListener("touchend", e => { e.preventDefault(); app.touch[k] = false; b.classList.remove("pressed"); });
  b.addEventListener("touchcancel", e => { e.preventDefault(); app.touch[k] = false; b.classList.remove("pressed"); });
}
bindTouch("btn-left", "left"); bindTouch("btn-right", "right"); bindTouch("btn-jump", "jump");

let lastT = performance.now(), acc = 0;
function tickGame() {
  app.uiTick++;
  if (app.screen !== "play" || !app.state || app.solverOverlay) return;
  let inp = { left: app.keys.left || app.touch.left, right: app.keys.right || app.touch.right, jump: app.keys.jump || app.touch.jump };
  if (app.botWatch) {
    inp = app.botWatch.frames[app.botWatch.index++] || {};
    if (app.botWatch.index > app.botWatch.frames.length + 10) app.botWatch = null;
  }
  const wasDead = app.state.dead;
  stepSimulation(app.state, inp, true);
  for (const s of app.state.soundEvents) sfx.play(s);
  if (!wasDead && app.state.dead) {
    progress.totalDeaths++;
    progress.levelDeaths[app.state.def.id] = (progress.levelDeaths[app.state.def.id] || 0) + 1;
    saveProgress(progress);
    if (window.DeathMusic) window.DeathMusic.onDeath();
  }
  if (app.state.dead && app.state.respawnTicksLeft === 0) startLevel(app.currentIdx);
  if (app.state.won) {
    if (!app.state.usedAssist && !progress.practiceMode) progress.cleared[app.state.def.id] = true;
    else progress.assistedClears[app.state.def.id] = true;
    saveProgress(progress);
    if (app.currentIdx + 1 < MAX_LEVELS.length) {
      if (window.DeathMusic) window.DeathMusic.onWin();
      startLevel(app.currentIdx + 1);
    } else {
      if (window.DeathMusic) window.DeathMusic.playVictory();
      app.screen = "victory";
    }
  }
}
function frame(now) {
  const dt = Math.min(0.1, (now - lastT) / 1000); lastT = now; acc += dt;
  while (acc >= FIXED_DT) { tickGame(); acc -= FIXED_DT; }
  render();
  requestAnimationFrame(frame);
}
const hashM = (window.location.hash || "").match(/code=TIM-(\d+)/i);
if (hashM) { const n = parseInt(hashM[1], 10); if (n >= 1 && n <= MAX_LEVELS.length && isLevelUnlocked(n)) startLevel(n - 1); }
requestAnimationFrame(frame);
</script>
<script src="../death_music.js"></script>
</body>
</html>
